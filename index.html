  formBuilder: ()=>{
    if(!fbDraft) fbDraft = { id:null, name:'', fields:[] };
    const editingExisting = !!fbDraft.id;
    const rows = fbRows(fbDraft.fields);
    const gap = (beforeId)=>`<div class="fb-gap" data-gap="${beforeId||''}"></div>`;
    const card = (f)=>{
      const meta = fbTypeMeta(f.type);
      const hasMore = meta.allowAutoFill || meta.hasOptions;
      const open = fbOpenIds.has(f.id) || (meta.hasOptions && !f.source && !(f.options||[]).length);
      const more = !open ? '' : (meta.allowAutoFill ? `
          <select onchange="fbSetFieldAutoFill('${f.id}', this.value)" style="font-size:12.5px;padding:3px 6px;margin-top:6px;width:100%">
            <option value="" ${!f.autoFill?'selected':''}>No auto-fill</option>
            <option value="carName" ${f.autoFill==='carName'?'selected':''}>Auto-fill: car name</option>
            <option value="employeeName" ${f.autoFill==='employeeName'?'selected':''}>Auto-fill: employee name</option>
          </select>` : `
          <select onchange="fbSetSource('${f.id}', this.value)" style="font-size:12.5px;padding:3px 6px;margin-top:6px;width:100%">
            ${fbSourceChoices().map(([v,l])=>`<option value="${v}" ${(f.source||'')===v?'selected':''}>${l}</option>`).join('')}
          </select>
          ${f.source==='paste' ? `<textarea oninput="fbSetPasted('${f.id}', this.value)" rows="5" placeholder="One choice per line" style="width:100%;margin-top:6px;font-size:13px;padding:6px">${(f.options||[]).join('\n').replace(/</g,'&lt;')}</textarea>`
          : fbSourceOptions(f.source) ? `<p class="list-sub" style="margin:6px 0 0;font-size:12.5px">Fills itself with ${fbSourceOptions(f.source).length} item${fbSourceOptions(f.source).length===1?'':'s'} each time you send an update.</p>`
          : `<div style="margin-top:6px;display:flex;flex-direction:column;gap:5px">
            ${(f.options||[]).map((opt,oi)=>`<div style="display:flex;gap:5px;align-items:center"><input value="${(opt||'').replace(/"/g,'&quot;')}" oninput="fbSetDropdownOption('${f.id}', ${oi}, this.value)" placeholder="Choice ${oi+1}" style="flex:1;min-width:0;font-size:13px;padding:4px 6px"><button class="btn-ghost chip-btn" onclick="fbRemoveDropdownOption('${f.id}', ${oi})">✕</button></div>`).join('')}
            <button class="btn-ghost" style="width:auto;align-self:flex-start;padding:3px 10px;font-size:12.5px" onclick="fbAddDropdownOption('${f.id}')">+ Add choice</button>
          </div>`}`);
      return `
      <div class="fb-card" data-fid="${f.id}">
        <div style="display:flex;align-items:center;gap:6px">
          <span class="fb-grip" title="Drag to move" onpointerdown="fbDragStart(event,'move','${f.id}')">⠿</span>
          <span style="flex:none" title="${meta.label}">${meta.icon}</span>
          ${f.type==='blank' ? `<span class="fb-label" style="color:var(--muted);border-bottom:none">Blank space</span>` : `<input class="fb-label" ${f.type==='heading'?'style="font-weight:700;font-size:15.5px" ':''}value="${(f.label||'').replace(/"/g,'&quot;')}" oninput="fbSetFieldLabel('${f.id}', this.value)" placeholder="${meta.label}">`}
          ${hasMore?`<button class="btn-ghost chip-btn" onclick="fbToggleOpen('${f.id}')" title="More options">⚙</button>`:''}
          <button class="btn-ghost chip-btn" onclick="fbRemoveField('${f.id}')" title="Remove">✕</button>
        </div>${more}
      </div>`;
    };
    return `
    <div class="detail-head">
      <p class="kicker">Forms</p>
      <h1 class="detail-title">${editingExisting ? 'Edit form' : 'New form'}${infoTip('Drag a field type from the bottom onto the form (or just tap it to add it at the end). Drop it between rows for its own row, or onto the left/right half of a field to put it beside that one — up to 3 per row. Drag the ⠿ handle to move a field. ⚙ opens a field\'s extra options.')}</h1>
    </div>
    <section class="block infoblock fb-canvas">
      <input class="fb-title-input" id="fbTitleInput" placeholder="Form title..." value="${(fbDraft.name||'').replace(/"/g,'&quot;')}" style="width:100%;background:none;border:none;color:var(--text);font-family:var(--display);font-size:19px;margin-bottom:10px" oninput="fbSetName(this.value)" />
      ${rows.length ? rows.map(r=>`${gap(r[0].id)}<div class="fb-row">${r.map(card).join('')}</div>`).join('') + gap('') : `<div class="fb-gap fb-gap-empty" data-gap="">Drag a field here</div>`}
    </section>
    <button class="btn-ghost" style="width:100%;margin-top:14px" onclick="fbTogglePaste()">📋 Paste a list of checkboxes</button>
    ${fbPasteOpen ? `<div class="infoblock" style="margin-top:8px"><p class="list-sub" style="margin:0 0 6px">One item per line. Each line becomes a checkbox at the end of the form. Blank lines are skipped, and bullets or numbers in front are removed.</p><textarea id="fbPasteBox" rows="7" placeholder="Ease of starting&#10;Cold idle quality&#10;Gear selection quality" style="width:100%;font-size:14px;padding:8px"></textarea><button class="btn-primary" style="width:100%;margin-top:8px" onclick="fbAddPasted()">Add checkboxes</button></div>` : ''}
    <p class="list-sub" style="margin:14px 0 6px">Field types</p>
    <div class="fb-palette">
      ${Object.keys(FB_FIELD_TYPES).map(t=>`<div class="fb-chip" onpointerdown="fbDragStart(event,'new','${t}')">${FB_FIELD_TYPES[t].icon} ${FB_FIELD_TYPES[t].label}</div>`).join('')}
    </div>
    <button class="btn-ghost" style="width:100%;margin-top:14px" onclick="nav({type:'formPreview'})">👁 Preview</button>
    <button class="btn-primary" style="width:100%;margin-top:10px" onclick="fbSave()">Save to Forms library</button>
    <button class="btn-ghost" style="width:100%;margin-top:10px" onclick="fbCancel()">Cancel</button>`;
  },

  formPreview: ()=>{
    if(!fbDraft) return `<p class="list-sub">Nothing to preview.</p><button class="btn-ghost" style="width:100%" onclick="goBack()">← Back</button>`;
    const cell = (f)=>{
      const label = f.label || ('(untitled '+fbTypeMeta(f.type).label.toLowerCase()+')');
      const auto = f.autoFill ? ` <span style="color:var(--accent);font-size:12px">— auto-filled from ${f.autoFill==='carName'?'car name':'employee name'}</span>` : '';
      const opts = fbResolvedOptions(f);
      const lab = `<label style="display:block;margin-bottom:6px;color:var(--muted);font-size:13px">${label}${auto}</label>`;
      if(f.type==='blank') return `<div class="fb-field"></div>`;
      if(f.type==='heading') return `<div class="fb-field"><div style="font-weight:700;font-size:16.5px;padding:10px 0 4px;border-bottom:1px solid var(--line)">${f.label||'(untitled heading)'}</div></div>`;
      if(f.type==='checkbox') return `<div class="fb-field" style="display:flex;align-items:center;gap:10px"><input type="checkbox" style="width:20px;height:20px;flex:none"><span>${label}</span></div>`;
      if(f.type==='yesno') return `<div class="fb-field">${lab}<select style="width:100%"><option value="">—</option><option>Yes</option><option>No</option></select></div>`;
      if(f.type==='radio') return `<div class="fb-field">${lab}<div style="display:flex;flex-wrap:wrap;gap:8px 16px">${opts.length?opts.map(o=>`<label style="display:flex;align-items:center;gap:6px"><input type="radio" name="pv-${f.id}" style="width:20px;height:20px">${o}</label>`).join(''):'<span style="color:var(--muted)">(no choices added yet)</span>'}</div></div>`;
      if(f.type==='dropdown') return `<div class="fb-field">${lab}<select style="width:100%"><option value="">—</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>${opts.length?'':'<span style="color:var(--muted);font-size:12px">(no choices added yet)</span>'}</div>`;
      if(f.type==='photo') return `<div class="fb-field">${lab}<input type="file" accept="image/*"></div>`;
      if(f.type==='signature') return `<div class="fb-field">${lab}<input type="text" style="width:100%" placeholder="Type your full name"></div>`;
      if(f.type==='longtext') return `<div class="fb-field">${lab}<textarea rows="3" style="width:100%"></textarea></div>`;
      if(f.type==='number') return `<div class="fb-field">${lab}<input type="number" inputmode="decimal" style="width:100%"></div>`;
      if(f.type==='date') return `<div class="fb-field">${lab}<input type="date" style="width:100%"></div>`;
      return `<div class="fb-field">${lab}<input type="text" style="width:100%"></div>`;
    };
    return `
    <div class="detail-head">
      <p class="kicker">Forms · Preview</p>
      <h1 class="detail-title">${fbDraft.name || '(untitled form)'}${infoTip('This is what it looks like on WorkClock, and you can try the fields out — nothing here is saved. On a narrow phone, fields that sit side by side stack on top of each other, and blank spaces disappear.')}</h1>
    </div>
    <section class="block infoblock">
      ${fbDraft.fields.length ? fbRows(fbDraft.fields).map(r=>`<div class="fb-prow">${r.map(f=>`<div class="fb-pcell">${cell(f)}</div>`).join('')}</div>`).join('') : `<p class="list-sub" style="margin:0">No fields added yet.</p>`}
    </section>
    <button class="btn-ghost" style="width:100%;margin-top:14px" onclick="goBack()">← Back to editing</button>`;
  },

  assembly: (v)=>{
    const tab = (v&&v.tab) || 'incoming';
    const tabs = `
    <div class="assembly-tabs">
      <button class="assembly-tab ${tab==='incoming'?'active':''}" onclick='navReplace({type:"assembly",tab:"incoming"})'>Incoming — This week's logs</button>
      <button class="assembly-tab ${tab==='outgoing'?'active':''}" onclick='navReplace({type:"assembly",tab:"outgoing"})'>Outgoing — Next update</button>
    </div>`;
    if(tab==='outgoing'){
      if(!outSnap) outSnapTake();
      const selCarsForDisplay = cars.filter(c=>c.includeInEmployeeUpdate!==false);
      const openEmpOut = (v&&v.openEmpOut) || null;
      const pill = (v&&v.pill) || null;
      const carPickerOptions = `<option value="">Not tied to a specific car</option>${selCarsForDisplay.map(c=>`<option value="${c.id}">${c.name}</option>`).join('')}`;
      const generalForms = outgoingForms.filter(f=>!f.employeeId);
      const generalPhotoReqs = outgoingPhotoReqs.filter(p=>!p.employeeId);
      const formRow = f=>{
        const carName = f.carId ? (cars.find(c=>c.id===f.carId)||{name:'(deleted car)'}).name : null;
        const savedForm = f.formId ? forms.find(x=>x.id===f.formId) : null;
        return `<div class="row" style="cursor:default">
          <div><div class="row-title">📄 ${f.name}</div><div class="row-meta">${carName?'For '+carName:'Any car'}${savedForm?' · '+(savedForm.fields||[]).length+' field'+((savedForm.fields||[]).length===1?'':'s'):(f.fileName?' · '+f.fileName:'')}</div></div>
          <button class="btn-ghost chip-btn" onclick="removeOutgoingForm('${f.id}')">✕</button>
        </div>`;
      };
      const photoRow = p=>{
        const carName = p.carId ? (cars.find(c=>c.id===p.carId)||{name:'(deleted car)'}).name : null;
        return `<div class="row" style="cursor:default">
          <div><div class="row-title">📷 ${p.note}</div><div class="row-meta">${carName?'Of '+carName:'Any car'}</div></div>
          <button class="btn-ghost chip-btn" onclick="removeOutgoingPhotoReq('${p.id}')">✕</button>
        </div>`;
      };
      const noteRow = n=>`<div class="row" style="cursor:default">
          <div><div class="row-title">📝 ${n.text}</div></div>
          <button class="btn-ghost chip-btn" onclick="removeOutgoingNote('${n.id}')">✕</button>
        </div>`;
      const picRow = ph=>`<div class="row" style="cursor:default">
          <img src="${ph.dataUrl}" style="width:44px;height:44px;object-fit:cover;border-radius:6px;margin-right:10px">
          <div style="flex:1"><div class="row-title">🖼 ${ph.caption||'Photo'}</div>${ph.carId?`<div class="row-meta">${(cars.find(c=>c.id===ph.carId)||{}).name||''}</div>`:''}</div>
          <button class="btn-ghost chip-btn" onclick="removeOutgoingPhoto('${ph.id}')">✕</button>
        </div>`;
      const listsGoingOut = 2+(consumablesIncluded?1:0)+customLists.filter(l=>l.includeInUpdate).length;
      const pillHead = (key, title, count, tip)=>`
        <div class="assembly-group-head pill-head" onclick='outNav(${pill===key?'null':`"${key}"`}, null)'>
          <h3>${title}${tip?infoTip(tip):''}</h3>
          <span class="group-totals">${count}</span>
          <span style="margin-left:8px;color:var(--muted)">${pill===key?'▲':'▼'}</span>
        </div>`;
      // One person's (or "everyone"'s) panel: their forms, photo requests and, for people, notes + history.
      const personPanel = (key, name, fs, ps, ns, histChecked, isGeneral)=>{
        const open = openEmpOut===key;
        const pics = outgoingPhotos.filter(ph=> isGeneral ? !ph.employeeId : ph.employeeId===key);
        const count = fs.length+ps.length+ns.length+pics.length+(histChecked?1:0);
        const eid = isGeneral ? '' : key;
        return `
        <div class="assembly-group" style="margin-bottom:8px">
          <div class="assembly-group-head pill-head" onclick='outNav("people", ${open?'null':`"${key}"`})'>
            <h3>${name}</h3>
            <span class="group-totals">${count?count+' item'+(count===1?'':'s'):'Nothing assigned'}</span>
            <span style="margin-left:8px;color:var(--muted)">${open?'▲':'▼'}</span>
          </div>
          ${open?`
          <div style="padding-top:8px">
            ${fs.length||ps.length||ns.length||pics.length ? `${fs.map(formRow).join('')}${ps.map(photoRow).join('')}${ns.map(noteRow).join('')}${pics.map(picRow).join('')}` : `<p class="list-sub" style="margin:0 0 10px">Nothing assigned yet.</p>`}
            ${isGeneral?'':`<label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13.5px;cursor:pointer" onclick="event.stopPropagation()">
              <input type="checkbox" ${histChecked?'checked':''} onchange="outgoingToggleHistoryRestore('${key}')">
              Send full history back ${infoTip('For a lost or wiped phone — sends this employee all of their past entries so they can restore them.')}
            </label>`}
            <div class="tap-reveal" onclick="toggleEl('outgoing-add-form-${key}')" style="margin-top:10px;color:var(--accent);font-size:13.5px;font-weight:600">+ Add a form</div>
            <div id="outgoing-add-form-${key}" style="display:none;margin-top:10px">
              ${forms.length ? `
              <select class="week-select" id="newFormSaved-${key}"><option value="">— Pick one of your saved forms —</option>${forms.map(f=>`<option value="${f.id}">${f.name||'(untitled form)'}</option>`).join('')}</select>
              <select class="week-select" id="newFormCarSaved-${key}" style="margin-top:8px">${carPickerOptions}</select>
              <button class="btn-primary" style="margin-top:8px;width:100%" onclick="addOutgoingSavedForm(document.getElementById('newFormSaved-${key}').value, '${eid}', document.getElementById('newFormCarSaved-${key}').value)">Add form</button>` : `<p class="list-sub" style="margin:0">No saved forms yet — build one in Settings → Forms, then it will show up here to pick.</p>`}
            </div>
            <div class="tap-reveal" onclick="toggleEl('outgoing-add-photo-${key}')" style="margin-top:10px;color:var(--accent);font-size:13.5px;font-weight:600">+ Add a photo request</div>
            <div id="outgoing-add-photo-${key}" style="display:none;margin-top:10px">
              <input class="search-input" id="newPhotoNote-${key}" placeholder="What photo do you need? e.g. Rear brake pads">
              <select class="week-select" id="newPhotoCar-${key}" style="margin-top:8px">${carPickerOptions}</select>
              <button class="btn-ghost" style="margin-top:8px" onclick="addOutgoingPhotoReq(document.getElementById('newPhotoNote-${key}').value, '${eid}', document.getElementById('newPhotoCar-${key}').value)">Add photo request</button>
            </div>
            <div class="tap-reveal" onclick="toggleEl('outgoing-add-pic-${key}')" style="margin-top:10px;color:var(--accent);font-size:13.5px;font-weight:600">+ Add a photo</div>
            <div id="outgoing-add-pic-${key}" style="display:none;margin-top:10px">
              <input class="search-input" id="newPicCap-${key}" placeholder="Caption, e.g. Rear bumper before repair">
              <select class="week-select" id="newPicCar-${key}" style="margin-top:8px">${carPickerOptions}</select>
              <button class="btn-ghost" style="margin-top:8px" onclick="toggleEl('outgoing-gallery-${key}')">From Shop Boss photos</button>
              <div id="outgoing-gallery-${key}" style="display:none">${outPicGalleryHTML(key)}</div>
              <button class="btn-ghost" style="margin-top:8px" onclick="triggerOutPic('${key}','camera')">Take a photo</button>
              <button class="btn-ghost" style="margin-top:8px" onclick="triggerOutPic('${key}','file')">From this phone</button>
            </div>
            ${isGeneral?'':`<div class="tap-reveal" onclick="toggleEl('outgoing-add-note-${key}')" style="margin-top:10px;color:var(--accent);font-size:13.5px;font-weight:600">+ Add a note</div>
            <div id="outgoing-add-note-${key}" style="display:none;margin-top:10px">
              <textarea class="search-input" id="newNoteText-${key}" rows="4" style="resize:vertical;min-height:84px;padding-top:10px" placeholder="Write as much as you need — a note for this employee only"></textarea>
              <button class="btn-ghost" style="margin-top:8px" onclick="addOutgoingNote(document.getElementById('newNoteText-${key}').value, '${key}')">Add note</button>
            </div>`}
          </div>`:''}
        </div>`;
      };
      const peopleCount = generalForms.length+generalPhotoReqs.length+outgoingForms.filter(f=>f.employeeId).length+outgoingPhotoReqs.filter(p=>p.employeeId).length+outgoingNotes.length+outgoingPhotos.length+outgoingHistoryRestore.length;
      return `
      <div class="assembly-mode" style="${asmStyle('outgoing')}">
      <div class="assembly-banner"><span>🔒 ASSEMBLY ROOM — editing mode</span><button class="exit-btn" onclick="exitAssembly()">Exit ✕</button></div>
      <h2 class="list-title">Assembly Room${infoTip('Sealed while you\'re in here — nothing links out. Use Exit at the top right when you\'re done.')}</h2>
      ${tabs}
      <h3 style="margin:16px 0 10px;font-size:15px">Next update${infoTip('What goes out to employees next. It\'s independent of the incoming review, so you can build it even while you\'re still reviewing last week\'s logs.')}</h3>

      <div class="assembly-group">
        ${pillHead('lists','Lists', listsGoingOut+' going out', 'Tasks and the Notes Helper always go out. Every other list gets its own box on WorkClock automatically — tick the box to send it.')}
        ${pill==='lists'?`
        <div>
        <div class="row" style="cursor:default">
          <div style="flex:1"><div class="row-title">Tasks</div><div class="row-meta">${workTypes.length} item${workTypes.length===1?'':'s'} · always sent</div></div>
          <label style="width:60px;text-align:center"><input type="checkbox" checked disabled></label>
        </div>
        <div class="row" style="cursor:default">
          <div style="flex:1"><div class="row-title">Notes Helper</div><div class="row-meta">${notesHelper.length} item${notesHelper.length===1?'':'s'} · always sent</div></div>
          <label style="width:60px;text-align:center"><input type="checkbox" checked disabled></label>
        </div>
        <div class="row" style="cursor:default">
          <div style="flex:1"><div class="row-title">Consumables and parts</div><div class="row-meta">${consumables.length} item${consumables.length===1?'':'s'}</div></div>
          <label style="width:60px;text-align:center"><input type="checkbox" ${consumablesIncluded?'checked':''} onchange="toggleConsumablesIncluded()"></label>
        </div>
        ${customLists.map(l=>`
        <div class="row" style="cursor:default">
          <div style="flex:1"><div class="row-title">${l.name}</div><div class="row-meta">${l.items.length} item${l.items.length===1?'':'s'}</div></div>
          <label style="width:60px;text-align:center"><input type="checkbox" ${l.includeInUpdate?'checked':''} onchange="toggleCustomListInclude('${l.id}')"></label>
        </div>`).join('')}
        </div>`:''}
      </div>

      <div class="assembly-group">
        ${pillHead('cars','Cars going out', selCarsForDisplay.length+' of '+cars.length, 'Set from the Cars page, not here — each car has its own "In update" checkbox there (Exit the Assembly Room, then Cars).')}
        ${pill==='cars'?`<p class="list-sub" style="margin:2px 0 0">${selCarsForDisplay.length ? selCarsForDisplay.map(c=>c.name).join(', ') : 'No cars are currently checked to go out.'}</p>`:''}
      </div>

      <div class="assembly-group">
        ${pillHead('people','Employees & general', peopleCount?peopleCount+' item'+(peopleCount===1?'':'s'):'Nothing assigned', 'Give everyone, or one employee, a form or photo request — optionally tied to one car. Notes and full-history restore are per employee only.')}
        ${pill==='people'?`
        <div>
          ${personPanel('general','Everyone', generalForms, generalPhotoReqs, [], false, true)}
          ${employees.map(e=>personPanel(e.id, e.name, outgoingForms.filter(f=>f.employeeId===e.id), outgoingPhotoReqs.filter(p=>p.employeeId===e.id), outgoingNotes.filter(n=>n.employeeId===e.id), outgoingHistoryRestore.includes(e.id), false)).join('')}
        </div>`:''}
      </div>
      <input type="file" id="outgoingFormFile" style="display:none" onchange="handleOutgoingFormFile(event)">
      <input type="file" id="outPicCamera" accept="image/*" capture="environment" style="display:none" onchange="handleOutPicFile(event)">
      <input type="file" id="outPicFile" accept="image/*" style="display:none" onchange="handleOutPicFile(event)">
      <div class="assembly-actions" style="align-items:center">
        <button class="btn-primary" onclick="outgoingSend()">Send update to employees →</button>${infoTip('Each update replaces the forms, photo requests and notes on the phones with what is set up here. Forms and photo requests an employee already finished stay finished.')}
      </div>
      </div>`;
    }
    const openEmp = (v&&v.openEmp) || null;
    const st = asmStatus();
    const doneN = st.filter(x=>x.state==='done').length;
    const icons = {attention:'!', ready:'○', done:'✓'};
    return `
    <div class="assembly-mode" style="${asmStyle('incoming')}">
    <div class="assembly-banner"><span>🔒 ASSEMBLY ROOM — editing mode</span><button class="exit-btn" onclick="exitAssembly()">Exit ✕</button></div>
    <h2 class="list-title">Assembly Room${infoTip('Sealed while you\'re in here — nothing links out. Use Exit at the top right when you\'re done.')}</h2>
    ${tabs}
    <input type="file" id="importSubmissionFile" accept=".json,application/json" multiple style="display:none" onchange="handleImportSubmissionFile(event)">
    <button class="btn-ghost" style="width:100%;margin-bottom:10px" onclick="triggerImportSubmissionPicker()">📥 Import work weeks from WorkClock</button>
    <button class="btn-ghost" style="width:100%;margin-bottom:16px" onclick="printAlerts()">🖨 Print alerts (${entries.filter(l=>l.flag && !l.flagDone).length})</button>
    ${unmatchedCarItemsHTML()}
    ${st.length ? `<p class="list-sub" style="margin:0 0 10px">${doneN} of ${st.length} listing${st.length===1?'':'s'} marked done. Tap a listing to review everything turned in for that work week.</p>` : `<p class="list-sub" style="margin:0 0 10px">Nothing has been turned in yet. A listing appears here when a work week is imported.</p>`}
    ${st.map(x=>{
      const open = openEmp===x.key;
      const es = x.es;
      const b = employeeIncomingBundle(x.e, es);
      const totalLogged = sumBy(es,'hours');
      const totalBillable = sumBy(es,'billable');
      const chLines = listingChangeLines(es), addLines = listingAddedLines(es);
      return `
      <div class="assembly-group">
        <div class="assembly-group-head" style="cursor:pointer" onclick='navReplace({type:"assembly",tab:"incoming",openEmp:${open?'null':JSON.stringify(x.key)}})'>
          ${x.state==='attention'?`<span class="asm-tri">${warnIcon(26)}</span>`:`<span class="asm-icon">${icons[x.state]}</span>`}
          <h3>${x.e.name}${x.wk?` <span style="font-weight:400;color:var(--muted)">· ${wkLabel(x.wk)}</span>`:''}</h3>
          <span class="group-totals">${x.note}</span>
          <span style="margin-left:8px;color:var(--muted)">${open?'▲':'▼'}</span>
        </div>
        ${open?`
        <div style="padding-top:8px">
          ${(chLines.length||addLines.length)?`<div class="flag" style="display:block"><b>Corrected week. Already saved in history.</b><br>${chLines.concat(addLines).map(t=>escH(t)).join('<br>')}<br>Everything else stays exactly as you saved it, including your billable hours, parts and corrections.</div>`:''}
          <div class="stat-pills">
            <span class="pill">${es.length} entr${es.length===1?'y':'ies'}</span>
            ${clocksFor(x.e.name, x.wk).length?`<span class="pill">${fmtHrsMin(empHoursTotal(x.e.name, x.wk))} employee hours${empHoursMissingCount(x.e.name, x.wk)?' ⚠':''}</span>`:''}
            <span class="pill">${fmtHrsMin(totalLogged)} task hours</span>
            <span class="pill">${fmtHrsMin(totalBillable)} billable</span>
            ${b.docs.length?`<span class="pill">📄 ${b.docs.length} form${b.docs.length===1?'':'s'} turned in</span>`:''}

        <p class="detail-meta">${e.phone?`<a href="tel:${e.phone}">${e.phone}</a>`:'No phone on file'}</p>
      </div>
      ${filterBar(['dates','cars'])}
      <div class="stat-pills">
        <span class="pill pill-accent">This work week: ${fmtHrsMin(thisWeekHours(e))}</span>
        <span class="pill">${theirCars.length} car${theirCars.length===1?'':'s'}</span>
        <span class="pill">${fmtHrsMin(logs.reduce((s,l)=>s+(parseFloat(l.hours)||0),0))} task hours</span>
        <span class="pill">${fmtHrsMin(logs.reduce((s,l)=>s+(parseFloat(l.billable)||0),0))} billable</span>
      </div>
      <section class="block infoblock open" id="emp-info">
        <p class="block-title">Info <span class="static-tag">static — rarely changes</span> <span class="edit-link" onclick="nav({type:'editEmployee', id:'${e.id}'})">Edit</span></p>
        <div class="specs">
          <div><span class="spec-k">Phone</span><span class="spec-v">${e.phone?`<a href="tel:${e.phone}">${e.phone}</a>`:'—'}</span></div>
          <div><span class="spec-k">Email</span><span class="spec-v">${e.email?`<a href="mailto:${e.email}">${e.email}</a>`:'—'}</span></div>
          <div><span class="spec-k">Address</span><span class="spec-v">${e.address||'—'}</span></div>
          <div><span class="spec-k">Start date</span><span class="spec-v">${e.startDate||'—'}</span></div>
        </div>
        <div class="theme-divider"></div>
        <p class="tap-reveal" style="color:var(--accent);font-size:13px;font-weight:600;margin:0" onclick="toggleEl('emp-merge')">Merge with another employee…</p>
        <div id="emp-merge" style="display:none;margin-top:10px">
          <p class="list-sub" style="margin-bottom:8px">Pick the duplicate — everything it touched (work entries, cars worked on) moves to ${e.name}, then it's deleted (recoverable for 30 days).</p>
          <div class="chips">
            ${employees.filter(x=>x.id!==e.id).map(x=>`<div class="chip" onclick="mergeEmployees('${e.id}','${x.id}')">${x.name}</div>`).join('')}
          </div>
        </div>
      </section>
      ${calendarHTML(e, v.month||0)}
      <section class="block">
        <p class="block-title">Cars worked on</p>
        <div class="chips">${theirCars.map(c=>`<div class="chip" onclick='nav({type:"intersection",emp:"${e.id}",car:"${c.id}"})'><span class="dot"></span>${c.name}</div>`).join('')}</div>
      </section>
      ${(function(){
        const theirDocs = completedDocs.filter(d=>d.who===e.name).sort((a,b)=>b.id.localeCompare(a.id));
        if(!theirDocs.length) return '';
        return `
      <section class="block">
        <p class="block-title">Forms completed</p>
        ${theirDocs.map(d=>{
          const carName = d.carId ? ((cars.find(x=>x.id===d.carId)||{}).name || d.carTyped || '') : (d.carTyped || '');
          return `<div class="row" onclick="nav({type:'docViewer', docId:'${d.id}'})"><div><div class="row-title">📄 ${d.name}</div><div class="row-meta">${[d.date, carName].filter(Boolean).join(' · ')||'Filed'}</div></div><div class="chev">${icon("chev")}</div></div>`;
        }).join('')}
      </section>`;
      })()}
      <section class="block">
        <p class="block-title">Recent work</p>
        ${shareBtn()}
        ${logs.map(l=>`
          <div class="entry">
            <div class="entry-top"><span class="entry-who">${carNameForEntry(l)}</span><span class="entry-hours">${fmtHrsMin(l.hours)}</span></div>
            <div class="entry-date" onclick='nav({type:"dateView",date:"${l.date}",iso:"${entryIso(l)}"})'>${l.date}</div>
            <div class="entry-desc">${descHTML(l)}</div>
            ${entryExtras(l)}
          </div>`).join('')}
      </section>
      <button class="btn-ghost" style="width:100%;margin-top:22px;border-color:#7a2020;color:#e05a5a" onclick="deleteEmployee('${e.id}')">Delete this employee</button>`;
  },

  intersection: (v)=>{
    const e = employees.find(x=>x.id===v.emp);
    const c = cars.find(x=>x.id===v.car);
    const logs = entries.filter(l=>l.who===e.name && l.car===c.id);
    return `
      <div class="detail-head">
        <p class="kicker">Car · filtered</p>
        <h1 class="detail-title">${c.name}</h1>
        <p class="detail-meta">Showing only ${e.name}'s work</p>
      </div>
      <div class="stat-pills">
        <span class="pill">${logs.length} entr${logs.length===1?'y':'ies'}</span>
        <span class="pill">${fmtHrsMin(logs.reduce((s,l)=>s+(parseFloat(l.hours)||0),0))} task hours</span>
        <span class="pill">${fmtHrsMin(logs.reduce((s,l)=>s+(parseFloat(l.billable)||0),0))} billable</span>
      </div>
      <div class="chips" style="margin-bottom:22px">
        <div class="chip" onclick='nav({type:"car",id:"${c.id}"})' title="Remove this — show everyone on ${c.name}">${e.name} ✕</div>
        <div class="chip" onclick='nav({type:"employee",id:"${e.id}"})' title="Remove this — show all of ${e.name}'s cars">${c.name} ✕</div>
      </div>
      <section class="block" style="margin-top:0">
        <p class="block-title">Work log</p>
        ${shareBtn()}
        ${logs.length? logs.map(l=>`
          <div class="entry">
            <div class="entry-top"><span class="entry-who">${l.who}</span><span class="entry-hours">${fmtHrsMin(l.hours)}</span></div>
            <div class="entry-date" onclick='nav({type:"dateView",date:"${l.date}",iso:"${entryIso(l)}"})'>${l.date}</div>
            <div class="entry-desc">${descHTML(l)}</div>
            ${entryExtras(l)}
            ${flagHTML(l)}
          </div>`).join('') : `<p class="list-sub">No entries yet for this combination.</p>`}
      </section>`;
  },
  dateView: (v)=>{
    const empF = v.emp ? employees.find(x=>x.id===v.emp) : null;
    const dIso = v.iso || (entries.find(l=>l.date===v.date) ? entryIso(entries.find(l=>l.date===v.date)) : '');
    const logs = applyFlt(entries.filter(l=>entryIso(l)===dIso && (!empF || l.who===empF.name)));
    return `
      <div class="detail-head">
        <p class="kicker">Filtered</p>
        <h1 class="detail-title">${v.date}${dIso?', '+dIso.slice(0,4):''}</h1>
        <p class="detail-meta">${empF ? `Only ${empF.name}'s entries this day` : 'Everything logged shop-wide this day'}</p>
      </div>
      ${dIso && logs.length ? `<button class="btn-ghost no-print" style="width:100%;margin:0 0 10px;border-color:#7a2020;color:#e05a5a" onclick='deleteWorkDay(${JSON.stringify(dIso)}, ${empF?JSON.stringify(empF.name):'null'})'>Delete this entire day</button>` : ''}
      ${filterBar(['emps','cars'])}
      <section class="block" style="margin-top:0">
        ${shareBtn()}
        ${logs.length ? '' : '<p class="list-sub">Nothing on this day.</p>'}
        ${logs.map(l=>`
          <div class="entry">
            <div class="entry-top">
              ${(()=>{ const whoEmp = employees.find(e=>e.name===l.who); return whoEmp ? `<span class="entry-who chip-link" onclick='nav({type:"employee",id:"${whoEmp.id}"})'>${l.who}</span>` : `<span class="entry-who">${l.who}</span>`; })()}
              <span class="entry-hours">${fmtHrsMin(l.hours)}</span>
            </div>
            <div class="entry-date chip-link" onclick='nav({type:"car",id:"${l.car}"})'>${carNameForEntry(l)}</div>
            <div class="entry-desc">${descHTML(l)}</div>
            ${entryExtras(l)}
            ${flagHTML(l)}
            <button class="btn-ghost no-print" style="margin-top:8px;border-color:#7a2020;color:#e05a5a" onclick="deleteWorkEntry('${l.id}')">Delete this task</button>
          </div>`).join('')}
      </section>`;
  },
};

loadPersisted();
// Lists default to alphabetical and stay that way until Darren manually reorders one. This also
// catches the demo/seed data, which was written in no particular order — on first run (nothing
// customized yet) everything snaps to A–Z immediately rather than only after the next edit.
normalizeListItems(consumables);
normalizeListItems(workTypes);
if(!listOrderCustomized.cars) sortArrayAlphaInPlace(cars, c=>c.name);
if(!listOrderCustomized.employees) sortArrayAlphaInPlace(employees, e=>e.name);
if(!listOrderCustomized.consumables) sortArrayAlphaInPlace(consumables, c=>c.name);
if(!listOrderCustomized.workTypes) sortArrayAlphaInPlace(workTypes, t=>t.name);
customLists.forEach(l=>{ if(!listOrderCustomized.customLists[l.id]) l.items.sort((a,b)=>a.localeCompare(b)); });
try{
  backupFolderName = localStorage.getItem('sb-folder-backup') || null;
  accountantFolderName = localStorage.getItem('sb-folder-accountant') || null;
  incomingFolderName = localStorage.getItem('sb-folder-incoming') || null;
}catch(e){}
render();
sbRestoreFolderHandles(); // async — reloads any previously-picked folder handles from IndexedDB, so writes/reads there resume without re-asking
</script>
</body>
</html>

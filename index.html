  .search-suggest{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}

  .attn-icon:active{background:rgba(224,160,58,.3)}
  .assembly-banner{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:6px 6px 6px 14px}
  .exit-btn{background:var(--accent-exitbg,#061a19);color:var(--accent);border:none;border-radius:8px;padding:0 14px;min-height:40px;font-family:var(--sans);font-weight:700;font-size:13px;cursor:pointer}
  .flag{display:flex;align-items:center;gap:10px;background:rgba(224,160,58,.14);border:1px solid #E0A03A;border-radius:8px;padding:8px 10px;margin-top:8px;color:var(--text);font-size:13.5px}
  .flag-ic{flex:none;display:flex}
  .flag-tx{flex:1}
  .flag-btn{flex:none;background:none;border:1px solid #E0A03A;color:#E0A03A;border-radius:8px;padding:8px 12px;min-height:44px;font-family:var(--sans);font-size:12.5px;font-weight:700;cursor:pointer}
  .row-warn{flex:none;display:flex;margin-left:6px}
  .asm-tri{flex:none;display:flex;width:28px;justify-content:center}
  .asm-carrow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line);cursor:pointer}
  .asm-carrow input[type="checkbox"]{width:19px;height:19px;accent-color:var(--accent);flex:none}
  .asm-carname{font-size:14.5px;font-weight:500;display:flex;align-items:center;flex-wrap:wrap}
  .needs-attn{background:rgba(224,160,58,.14) !important;border-color:#E0A03A !important;box-shadow:0 0 0 1px #E0A03A}
  .asm-item.missing,.asm-item.attention{background:rgba(224,160,58,.14);border:1px solid #E0A03A;border-radius:8px;padding:10px 12px;margin-top:8px;box-shadow:0 0 0 1px #E0A03A}
  .pill.open{border-color:var(--accent);color:var(--text);box-shadow:0 0 0 1px var(--accent)}
  .reveal-panel.open{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
  .reveal-panel{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:-10px 0 20px}
  .chip-link{cursor:pointer}
  .chip-link.entry-who{border-bottom:1px dotted var(--muted)}
  @media print{
    body.printing-week > *:not(#weekPrintSheet){display:none !important}
    body.printing-week #weekPrintSheet{display:block !important;background:#fff;color:#000;font-family:Arial,sans-serif;font-size:12px}
    #weekPrintSheet .wp-page{page-break-after:always} #weekPrintSheet h1,#weekPrintSheet h2,#weekPrintSheet h3{color:#000}
    body{background:#fff !important;color:#000 !important}
    header, .back, .doors, .setup-link, .btn-primary, .btn-ghost, .edit-link, .share-btn,
    .assembly-tabs, .assembly-banner, .chev, .info-i, footer, input[type="color"], .cal-nav{display:none !important}
    main{max-width:100%;padding:0}
    .assembly-mode{background:#fff !important;margin:0;padding:0}
    .block, .infoblock, .entry, .assembly-row, .assembly-group, .row, .assembly-row{
      background:#fff !important;border:1px solid #ccc !important;color:#000 !important;box-shadow:none !important}
    .detail-title, .row-title, .block-title, .entry-who, .entry-hours, .hours-v, h1, h2, h3{color:#000 !important}
    .muted-v, .spec-k, .hours-k, .list-sub, .kicker, .detail-meta{color:#555 !important}
    .hours-input{border:none !important;color:#000 !important;background:none !important}
    .flag{background:#fff3cd !important;color:#7a5b00 !important;border:1px solid #e0c14a !important}
    .pill, .badge{background:#f0f0f0 !important;color:#333 !important;border-color:#ccc !important}
    .chip{background:#f0f0f0 !important;color:#000 !important;border-color:#ccc !important;cursor:default !important}
    #car-hours-panel, #car-media-panel{display:none !important}
    .print-info{font-size:12px;line-height:1.5;color:#000 !important;border:1px solid #ccc;padding:5px 8px;margin:0 0 8px !important}
    .block{padding:6px 8px !important;margin:6px 0 !important}
    .entry{padding:4px 8px !important;margin:4px 0 !important}
    .detail-head{margin-bottom:6px !important}
  }
  @media print{ .no-print{display:none !important} .print-only{display:block !important;margin-bottom:12px;color:#000} .flag-btn, .exit-btn{display:none !important} .reveal-panel{display:none !important} .print-head{font-size:11px;color:#555 !important;margin-bottom:10px} }
</style>

function fbRows(fields){
  const rows = []; let last = null;
  fields.forEach((f,i)=>{
    const r = (f.row==null) ? 'solo'+i : f.row;
    if(rows.length && last===r) rows[rows.length-1].push(f); else { rows.push([f]); last = r; }
  });

}
function fbCommitRows(rows){

// Drop a brand-new field (kind 'new', val = type) or an existing one (kind 'move', val = field id).
// target is {gapBefore: fieldId|null} (own new row, before that field's row — null = at the end)
// or {field: fieldId, side:'before'|'after'} (beside that field, in its row).
function fbDrop(kind, val, target){
  if(!fbDraft) return;
  let rows = fbRows(fbDraft.fields);
  let f;
  if(kind==='new'){
    const meta = fbTypeMeta(val);
    f = {id:newFieldId(fbDraft.fields), type:val, label:'', autoFill:null};
    if(meta.hasOptions) f.options = [];
  } else {
    if(target && (target.gapBefore===val || target.field===val)) return; // dropped on itself — nothing to do
    for(const r of rows){ const i = r.findIndex(x=>x.id===val); if(i>=0){ f = r.splice(i,1)[0]; break; } }
    if(!f) return;
    rows = rows.filter(r=>r.length);
  }
  if(target && target.field){
    const ri = rows.findIndex(r=>r.some(x=>x.id===target.field));
    if(ri<0){ rows.push([f]); }
    else if(rows[ri].length>=FB_MAX_PER_ROW){ rows.splice(ri+1,0,[f]); } // row is full — starts its own row right below
    else { const pi = rows[ri].findIndex(x=>x.id===target.field); rows[ri].splice(target.side==='after'?pi+1:pi,0,f); }
  } else {
    const gb = target ? target.gapBefore : null;
    const ri = gb ? rows.findIndex(r=>r.some(x=>x.id===gb)) : -1;
    if(ri<0) rows.push([f]); else rows.splice(ri,0,[f]);
  }
  fbCommitRows(rows);
  render();
}

// ---- Touch / mouse drag-and-drop (pointer events). Drag from a field's ⠿ grip or from the palette;
// dropping on a gap between rows starts a new row, dropping on the left/right half of a field puts
// it beside that field. A quick tap on a palette item just adds it at the end. ----
let fbDragState = null;
function fbDragStart(ev, kind, val){
  if(ev.button && ev.button!==0) return;
  ev.preventDefault();
  const label = kind==='new' ? fbTypeMeta(val).icon+' '+fbTypeMeta(val).label : ((fbDraft&&fbDraft.fields.find(x=>x.id===val)||{}).label||'Field');
  const ghost = document.createElement('div');
  ghost.className = 'fb-ghost'; ghost.textContent = label;
  document.body.appendChild(ghost);
  fbDragState = {kind, val, ghost, x0:ev.clientX, y0:ev.clientY, moved:false, target:null, hot:null};
  window.addEventListener('pointermove', fbDragMove);
  window.addEventListener('pointerup', fbDragEnd);
  window.addEventListener('pointercancel', fbDragCancel);
  document.body.classList.add('fb-dragging');
  fbDragMove(ev);
}
function fbClearHot(){
  const st = fbDragState; if(!st || !st.hot) return;
  st.hot.classList.remove('fb-hot','fb-hot-before','fb-hot-after'); st.hot = null;
}
function fbDragMove(ev){
  const st = fbDragState; if(!st) return;
  st.ghost.style.left = (ev.clientX+14)+'px'; st.ghost.style.top = (ev.clientY-18)+'px';
  if(Math.abs(ev.clientX-st.x0)+Math.abs(ev.clientY-st.y0) > 8) st.moved = true;
  fbClearHot(); st.target = null;
  const el = document.elementFromPoint(ev.clientX, ev.clientY);
  const gap = el && el.closest ? el.closest('[data-gap]') : null;
  if(gap){ st.target = {gapBefore: gap.getAttribute('data-gap')||null}; st.hot = gap; gap.classList.add('fb-hot'); }
  else {
    const card = el && el.closest ? el.closest('[data-fid]') : null;
    if(card && card.getAttribute('data-fid')!==st.val){
      const r = card.getBoundingClientRect();
      const side = ev.clientX < r.left + r.width/2 ? 'before' : 'after';
      st.target = {field: card.getAttribute('data-fid'), side}; st.hot = card; card.classList.add('fb-hot-'+side);
    }
  }
  // keep the page scrolling while dragging near the top/bottom edge
  const h = window.innerHeight||800;
  if(ev.clientY < 70) window.scrollBy(0,-14); else if(ev.clientY > h-70) window.scrollBy(0,14);
}
function fbDragCleanup(){
  const st = fbDragState; if(!st) return;
  fbClearHot();
  if(st.ghost && st.ghost.remove) st.ghost.remove();
  window.removeEventListener('pointermove', fbDragMove);
  window.removeEventListener('pointerup', fbDragEnd);
  window.removeEventListener('pointercancel', fbDragCancel);
  try{ document.body.classList.remove('fb-dragging'); }catch(e){}
}
function fbDragEnd(ev){
  const st = fbDragState; if(!st) return;
  const {kind, val, moved, target} = st;
  fbDragCleanup(); fbDragState = null;
  if(!moved){ if(kind==='new') fbDrop('new', val, {gapBefore:null}); return; }
  if(target) fbDrop(kind, val, target);
}
function fbDragCancel(){ fbDragCleanup(); fbDragState = null; }

// ---- Reorderable lists — cars, employees, consumables, work types, and any custom list. These

// unlike claude.use('downloads') which only exists inside the claude.ai preview sandbox.
// This is the fallback that actually saves the file once Shop Boss is running for real.
function sbDownloadBlob(filename, blob){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      try{ document.body.removeChild(a); }catch(e){}
      try{ URL.revokeObjectURL(url); }catch(e){}
    }, 1000);
    return true;
  }catch(e){ return false; }

function dataUrlToBlob(dataUrl){
  const m = /^data:([^;]+);base64,(.*)$/.exec(dataUrl||'');
  if(!m) return null;
  const mime = m[1];
  const bin = atob(m[2]);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], {type:mime});
}

// csvFiles: [{fname, text}, ...] — now always two (hours + billing), kept as a list so this still
// works unchanged if a future export needs a third file.
async function shareOrSaveAccountantBundle(csvFiles, receiptList){
  const files = csvFiles.map(f=>new File([f.text], f.fname, {type:'text/csv'}));
  const csvTextByName = {};
  csvFiles.forEach(f=>{ csvTextByName[f.fname] = f.text; });
  receiptList.forEach((r,i)=>{
    const blob = dataUrlToBlob(r.dataUrl);
    if(!blob) return;
    const fname = 'receipt-'+new Date(r.addedAt).toISOString().slice(0,10)+'-'+(i+1)+'.jpg';
    files.push(new File([blob], fname, {type:'image/jpeg'}));
  });

    if(typeof navigator!=='undefined' && navigator.share && navigator.canShare && navigator.canShare({files})){

    // otherwise fall through and save each file individually instead

    // but fall back to a real browser download everywhere else (the real, installed app included).
    if(typeof claude!=='undefined' && claude.use){

function diffOutgoing(prev, cur){
  prev = prev || {cars:[],employees:[],forms:[],reqs:[],notes:[],pics:[],hist:[],tasks:[],helper:[],cons:null,lists:[],week:null};
  const out = [];
  const byId = a=>{ const m = {}; a.forEach(r=>m[r[0]]=r); return m; };
  const pc = byId(prev.cars), cc = byId(cur.cars);
  cur.cars.forEach(r=>{ if(!pc[r[0]]) out.push('Car added: '+r[1]); else if(pc[r[0]][1]!==r[1]) out.push('Car renamed: '+pc[r[0]][1]+' to '+r[1]); });
  prev.cars.forEach(r=>{ if(!cc[r[0]]){ const c = cars.find(x=>x.id===r[0]); out.push(c ? 'Car check mark turned off: '+r[1] : 'Car deleted: '+r[1]); } });

  cur.employees.forEach(r=>{ if(!pe[r[0]]) out.push('Employee added: '+r[1]); else if(pe[r[0]][1]!==r[1]) out.push('Employee renamed: '+pe[r[0]][1]+' to '+r[1]); });
  prev.employees.forEach(r=>{ if(!ce[r[0]]) out.push('Employee removed: '+r[1]); });

    const ma = byId(a), mb = byId(b);
    b.forEach(r=>{ if(!ma[r[0]]) out.push(label+' added: '+text(r)); });
    a.forEach(r=>{ if(!mb[r[0]]) out.push(label+' removed: '+text(r)); });
  };

  grp('Photo request', prev.reqs, cur.reqs, r=>r[1]+forWho(r));
  grp('Note', prev.notes, cur.notes, r=>(r[1].length>40?r[1].slice(0,40)+'…':r[1])+(r[2]?' (for '+r[2]+')':''));
  grp('Photo', prev.pics, cur.pics, r=>r[1]+forWho(r));
  cur.hist.forEach(n=>{ if(!prev.hist.includes(n)) out.push('Full history will be sent to: '+n); });
  const setDiff = (label, a, b)=>{
    b.forEach(x=>{ if(!a.includes(x)) out.push(label+' added: '+x); });
    a.forEach(x=>{ if(!b.includes(x)) out.push(label+' removed: '+x); });
  };
  setDiff('Task', prev.tasks, cur.tasks);
  setDiff('Notes Helper item', prev.helper, cur.helper);
  if(cur.cons && !prev.cons) out.push('Consumables and parts list: now sent');
  else if(!cur.cons && prev.cons) out.push('Consumables and parts list: no longer sent');
  if(cur.cons && prev.cons) setDiff('Consumables and parts item', prev.cons, cur.cons);
  const pl = byId(prev.lists), cl = byId(cur.lists);
  cur.lists.forEach(r=>{ if(!pl[r[0]]) out.push('List now sent: '+r[1]); else setDiff(r[1]+' item', pl[r[0]][2], r[2]); });
  prev.lists.forEach(r=>{ if(!cl[r[0]]) out.push('List no longer sent: '+r[1]); });

}

// Shop Boss only ever stored this entry's date as "Mon 9/29" — no year. To hand it back to
// WorkClock (which needs a real yyyy-mm-dd), guess the most recent year that date actually fell
// on, same as anyone reading "9/29" off a shop whiteboard today would assume. Good enough for
// recent history; not exact for anything genuinely old.
function shopBossDateToIso(sbDate){
  const m = /(\d+)\/(\d+)/.exec(sbDate||'');
  if(!m) return null;
  const month = parseInt(m[1],10), day = parseInt(m[2],10);
  const today = new Date();
  let year = today.getFullYear();
  let guess = new Date(year, month-1, day);
  if(guess.getTime() > today.getTime()+86400000){ year -= 1; }
  return year+'-'+String(month).padStart(2,'0')+'-'+String(day).padStart(2,'0');
}

function sbNameDistance(a,b){
  a=String(a||'').toLowerCase().trim(); b=String(b||'').toLowerCase().trim();
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=[...Array(n+1).keys()];
  for(let i=1;i<=m;i++){ const cur=[i]; for(let j=1;j<=n;j++){ cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1)); } prev=cur; }
  return prev[n];
}
// When a submission arrives under a name that isn't on the list, ask Daren which employee it is (closest
// spellings first), or whether to add a new one. A match is remembered so later weeks link by themselves.
function resolveSubmissionEmployee(payload, proceed, onSkip){
  const typed = String(payload.employee||'').trim();
  const byId = payload.employeeId && employees.find(e=>e.id===payload.employeeId);
  const byName = typed && employees.find(e=>e.name.toLowerCase()===typed.toLowerCase());
  const aliasId = typed && employeeAliases[typed.toLowerCase()];
  const byAlias = aliasId && employees.find(e=>e.id===aliasId);
  if(byId || byName || !typed){ proceed(); return; }
  if(byAlias){ payload.employee = byAlias.name; proceed(); return; }
  const ranked = employees.slice().sort((a,b)=>sbNameDistance(typed,a.name)-sbNameDistance(typed,b.name));
  const close = ranked.filter(e=>sbNameDistance(typed,e.name) <= Math.max(2, Math.floor(typed.length/3)));
  const pop = document.createElement('div');
  pop.className = 'thumb-pop';
  pop.style.alignItems = 'flex-start'; pop.style.overflowY = 'auto';
  const esc = t=>String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  pop.innerHTML = '<div style="background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;max-width:420px;width:100%;margin:auto">'
    + '<h3 style="margin:0 0 6px">Who is "'+esc(typed)+'"?</h3>'
    + '<p class="list-sub" style="margin:0 0 12px">That name isn\'t on your employee list. If it\'s someone you already have, pick them and it will match automatically from now on.</p>'
    + (employees.length ? ranked.map(e=>'<button class="btn-ghost" data-id="'+e.id+'" style="width:100%;margin:0 0 8px;'+(close.includes(e)?'border-color:var(--accent)':'')+'">'+esc(e.name)+(close.includes(e)?' — looks close':'')+'</button>').join('') : '')
    + '<button class="btn-primary" data-new="1" style="width:100%;margin:8px 0">Add "'+esc(typed)+'" as a new employee</button>'
    + '<button class="btn-ghost" data-skip="1" style="width:100%;margin:0">Cancel — don\'t import</button></div>';
  pop.onclick = ev=>{
    const t = ev.target.closest('button'); if(!t) return;
    if(t.dataset.skip){ pop.remove(); if(onSkip) onSkip(); return; }
    if(t.dataset.new){
      const emp = {id:'emp'+Date.now()+Math.random().toString(36).slice(2,6), name:typed, phone:'', cars:[]};
      employees.push(emp); pop.remove(); persist(); proceed(); return;
    }
    if(t.dataset.id){
      const emp = employees.find(e=>e.id===t.dataset.id); if(!emp) return;
      employeeAliases[typed.toLowerCase()] = emp.id; payload.employee = emp.name; pop.remove(); persist(); proceed();
    }
  };
  document.body.appendChild(pop);
}

function sbShrinkDataUrl(dataUrl, maxDim, cb){
  const img = new Image();
  img.onload = ()=>{
    const scale = Math.min(1, maxDim/Math.max(img.width, img.height));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(img.width*scale)); canvas.height = Math.max(1, Math.round(img.height*scale));
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    cb(canvas.toDataURL('image/jpeg', 0.8));
  };
  img.onerror = ()=>cb(null);
  img.src = dataUrl;
}

function editCarInfo(carId, desc, ownerMode, ownerId, newOwnerName, newOwnerPhone, year, body, vin, dropoff){
  const c = cars.find(x=>x.id===carId);
  if(!c) return;
  let oid = c.owner;
  if(ownerMode==='new'){
    const oName = (newOwnerName||'').trim();
    if(!oName){ alert('Enter the new owner\'s name, or switch to picking an existing owner.'); return; }
    oid = 'owner'+Date.now()+Math.random().toString(36).slice(2,6);
    owners.push({id:oid, name:oName, phone:(newOwnerPhone||'').trim(), cars:[]});
  } else {
    oid = ownerId || c.owner;
  }
  if(oid!==c.owner){
    const oldOwner = owners.find(o=>o.id===c.owner);
    if(oldOwner) oldOwner.cars = oldOwner.cars.filter(id=>id!==carId);
    const newOwner = owners.find(o=>o.id===oid);
    if(newOwner && !newOwner.cars.includes(carId)) newOwner.cars.push(carId);

  c.desc = (desc||'').trim();
  c.year = (year||'').trim();

// ---- receiving a submitted work week back from WorkClock (a file today; wireless once the shop has its own network) ----
// A WorkClock submission is shaped like:
// { app:'WorkClock', kind:'work-week-submission', version:1, submittedAt, employee, employeeId, weekOf,
//   entries:[{car, who, date, hours, task, desc, consumables}, ...],
//   completedDocuments:[{name, car, date, fileName, dataUrl}, ...],
//   photos:[{car, date, fileName, dataUrl}, ...] }
// Matches a car the same way employees are already matched — by the real id first (when
// WorkClock could resolve one), falling back to the typed name only when there's no id. Closes
// the same risk for cars (60 of them, easy to mistype or rename) that was already closed for
// employee names: a bare name match can silently land on the wrong car, or no car at all.
function matchCarForImport(carId, carName){
  if(carId){ const c = cars.find(x=>x.id===carId); if(c) return c; }
  return cars.find(c=>c.name.toLowerCase()===String(carName||'').toLowerCase()) || null;
}
function isoToShopBossDate(iso){
  const d = new Date(iso+'T00:00:00');
  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return dows[d.getDay()]+' '+(d.getMonth()+1)+'/'+d.getDate();
}
function triggerImportSubmissionPicker(){ const el = document.getElementById('importSubmissionFile'); if(el) el.click(); }
function handleImportSubmissionFile(evt){
  const files = Array.from((evt.target.files)||[]);
  evt.target.value = '';
  if(!files.length) return;
  const readOne = f=>new Promise(res=>{
    const reader = new FileReader();
    reader.onload = ()=>{ try{ res({name:f.name, payload:JSON.parse(reader.result)}); }catch(e){ res({name:f.name, bad:true}); } };
    reader.onerror = ()=>res({name:f.name, bad:true});
    reader.readAsText(f);
  });
  Promise.all(files.map(readOne)).then(list=>{
    // Oldest first, so a resent week lands after the one it replaces.
    list.sort((a,b)=>String((a.payload&&a.payload.submittedAt)||'').localeCompare(String((b.payload&&b.payload.submittedAt)||'')));
    const next = ()=>{
      const it = list.shift(); if(!it) return;
      if(it.bad){ alert('"'+it.name+'" doesn\'t look like a WorkClock submission.'); next(); return; }
      applyWorkClockSubmission(it.payload, next);
    };
    next();
  });
}
// Local date + time (to the minute) for file names, e.g. 2026-10-05_1042 — exports made twice in one
// day (a midday correction, say) each get their own name instead of overwriting or clashing.
function sbStamp(d){
  d = d || new Date();
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes());
}
// ---- Work weeks: each employee's work week is its own listing in Incoming ----
function p2(n){ return String(n).padStart(2,'0'); }
function isoAddDays(iso, n){ const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y,m-1,d+n); return dt.getFullYear()+'-'+p2(dt.getMonth()+1)+'-'+p2(dt.getDate()); }
function isoMonday(iso){ const d = new Date(iso+'T00:00:00'); return isoAddDays(iso, -((d.getDay()+6)%7)); }
// The first day of the work week a date falls in. When WorkClock says which week the file is for, that week's
// first day is the anchor; otherwise weeks start on Monday.
function wkForIso(iso, anchor){
  if(!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return (anchor && /^\d{4}-\d{2}-\d{2}$/.test(anchor)) ? anchor : '';
  const a = (anchor && /^\d{4}-\d{2}-\d{2}$/.test(anchor)) ? anchor : isoMonday(iso);
  const diff = Math.round((new Date(iso+'T00:00:00') - new Date(a+'T00:00:00'))/86400000);
  return isoAddDays(a, Math.floor(diff/7)*7);
}
function isoShort(iso){ return new Date(iso+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'}); }
function wkLabel(wk){ return isoShort(wk)+' to '+isoShort(isoAddDays(wk,6)); }
function wkLabelYear(wk){ return wkLabel(wk)+', '+isoAddDays(wk,6).slice(0,4); }
function cyrb53(str){
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for(let i=0;i<str.length;i++){ const ch = str.charCodeAt(i); h1 = Math.imul(h1^ch, 2654435761); h2 = Math.imul(h2^ch, 1597334677); }
  h1 = Math.imul(h1^(h1>>>16), 2246822507) ^ Math.imul(h2^(h2>>>13), 3266489909);
  h2 = Math.imul(h2^(h2>>>16), 2246822507) ^ Math.imul(h1^(h1>>>13), 3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
// A fingerprint of what a submission contains (not when it was sent), so an identical copy is recognised and ignored.
function submissionHash(payload){
  const ents = payload.entries.map(e=>JSON.stringify([e.id||'',e.date||'',e.hours,e.task||'',e.desc||'',e.notes||'',e.car||'',e.consumables||'',e.lowSupply||'',e.flagNote||'',e.pickListAnswers||null])).sort();
  const docs = (payload.completedDocuments||[]).map(d=>JSON.stringify([d.id||'',d.name||'',d.date||'',d.car||'',d.fileName||'',d.flagNote||'',d.answers||null,(d.dataUrl||'').length])).sort();
  const phs = (payload.photos||[]).map(p=>JSON.stringify([p.id||'',p.date||'',p.car||'',p.fileName||'',p.flagNote||'',(p.dataUrl||'').length])).sort();
  const base = [String(payload.employeeId||payload.employee||'').toLowerCase().trim(), ents, docs, phs];
  // Employee hours and task start/end times only change the fingerprint when they are present, so older files keep the same fingerprint.
  if(Array.isArray(payload.clocks) && payload.clocks.length) base.push(payload.clocks.map(c=>JSON.stringify([c.id||'',c.date||'',c.clockedInAt||null,c.clockedOutAt==null?null:c.clockedOutAt])).sort());
  const tm = payload.entries.filter(e=>e.startedAt||e.endedAt).map(e=>JSON.stringify([e.id||'',e.startedAt||null,e.endedAt||null])).sort();
  if(tm.length) base.push(tm);
  return cyrb53(JSON.stringify(base));
}
// What the employee sent for an entry, kept untouched so a later resend is compared to the original and not to Daren's edited copy.
function entryOrig(l){ return {date:l.date, hours:String(l.hours), desc:l.desc||'', notes:l.notes||'', consumables:l.consumables||'', car:l.car||l.carTyped||''}; }
const ORIG_FIELD_NAMES = {date:'date', hours:'hours', desc:'task', notes:'note', consumables:'parts and supplies', car:'car'};
// Copies Daren's billable hours, parts and corrections onto a resent entry wherever the employee did not change that field.
// Returns the list of fields the employee changed, each {f, before, after}.
function mergeOntoOld(ne, old){
  const o0 = old.orig || entryOrig(old);
  const diffs = [];
  Object.keys(ORIG_FIELD_NAMES).forEach(f=>{
    const nv = ne.orig[f], ov = o0[f];
    if(String(nv==null?'':nv)!==String(ov==null?'':ov)) diffs.push({f, before:ov, after:nv});
    else if(f==='car'){ ne.car = old.car; ne.carTyped = old.carTyped||null; }
    else ne[f] = old[f];
  });
  ne.billable = old.billable;
  if(old.parts) ne.parts = JSON.parse(JSON.stringify(old.parts));
  if(!diffs.some(d=>d.f==='notes'||d.f==='consumables')){ ne.flag = old.flag; ne.flagDone = old.flagDone; }
  return diffs;
}
function spellWord(w){ return '['+w.toUpperCase().split('').join('-')+']'; }
function textChangeBits(a, b){
  const A = String(a==null?'':a).split(/\s+/).filter(Boolean), B = String(b==null?'':b).split(/\s+/).filter(Boolean);
  let i = 0; while(i<A.length && i<B.length && A[i]===B[i]) i++;
  let ja = A.length, jb = B.length; while(ja>i && jb>i && A[ja-1]===B[jb-1]){ ja--; jb--; }
  return {before:A.slice(i,ja).join(' '), after:B.slice(i,jb).join(' ')};
}
// One plain line for one changed field: the date, who, which field, then before and after.
function changeLine(l, c){
  const when = l.iso ? isoShort(l.iso) : (l.date||'');
  const label = ORIG_FIELD_NAMES[c.f];
  let car = c.f==='car';
  const bits = (c.f==='desc'||c.f==='notes'||c.f==='consumables') ? textChangeBits(c.before, c.after) : {before:String(c.before==null?'':c.before), after:String(c.after==null?'':c.after)};
  const one = s=>s.trim().split(/\s+/).length===1 && s.length<=12 && /^[A-Za-z]+$/.test(s);
  const show = s=>'"'+s+'"'+(one(s)?' '+spellWord(s):'');
  let text;
  if(!bits.before && bits.after) text = 'added '+show(bits.after);
  else if(bits.before && !bits.after) text = 'removed '+show(bits.before);
  else text = show(bits.before)+' changed to '+show(bits.after);
  return when+', '+l.who+', '+label+': '+text+'.';
}
function applyWorkClockSubmission(payload, done){
  if(!payload || typeof payload!=='object' || !Array.isArray(payload.entries)){ alert('That file doesn\'t look like a WorkClock submission.'); if(done) done(); return; }
  resolveSubmissionEmployee(payload, ()=>{ applyWorkClockSubmissionCore(payload); if(done) done(); }, done);
}
function applyWorkClockSubmissionCore(payload){
  if(!payload || typeof payload!=='object' || !Array.isArray(payload.entries)){ alert('That file doesn\'t look like a WorkClock submission.'); return; }
  // Darren should be able to import the same file as many times as he wants — on purpose, since
  // he may not remember whether he already got someone's hours. Every submission carries the exact
  // moment it was sent, which (paired with who sent it) makes a reliable fingerprint: if we've
  // already imported this exact submission before, skip it instead of adding everything twice.
  const importHash = submissionHash(payload);
  if(entries.some(l=>l.ch===importHash) || completedDocs.some(d=>d.ch===importHash) || clockRecs.some(c=>c.ch===importHash)){
    alert('Shop Boss already has this work week exactly as it was sent. Nothing was changed.');
    return;
  }
  const importFingerprint = (payload.employeeId || String(payload.employee||'').toLowerCase().trim() || '?') + '@' + (payload.submittedAt || '');
  if(payload.submittedAt && importedSubmissionFingerprints.includes(importFingerprint)){
    // Not a hard block — this just means a submission with this exact employee+timestamp was
    // imported before. If those entries were since deleted (cleaning up a mistake, re-doing a
    // week), there'd otherwise be no way back in, so ask instead of silently refusing.
    if(!confirm('This looks like a submission you already imported before. If you deleted those entries and want to bring them back in, choose OK to import it again anyway.')) return;
  }
  // Match the employee by ID first (reliable), falling back to matching their typed name
  // (best-effort — this is exactly the fuzzy-match risk we're trying to move away from).
  let emp = null;
  if(payload.employeeId) emp = employees.find(e=>e.id===payload.employeeId) || null;
  if(!emp && payload.employee) emp = employees.find(e=>e.name.toLowerCase()===String(payload.employee).toLowerCase()) || null;
  if(!emp && payload.employee){
    const typedName = String(payload.employee).trim();
    if(typedName && confirm('"'+typedName+'" isn\'t on your employee list yet. Add them as a new employee now, so future weeks match automatically?')){
      emp = {id:'emp'+Date.now()+Math.random().toString(36).slice(2,6), name:typedName, phone:'', cars:[]};
      employees.push(emp);
    }
  }
  const whoName = emp ? emp.name : (payload.employee || 'Unknown');
  // Employee hours (clock-in to clock-out), one record per clock-in. A resent week replaces what Shop Boss had for that employee and week.
  const incomingClocks = Array.isArray(payload.clocks) ? payload.clocks.filter(c=>c && c.date && c.clockedInAt).map(c=>({
    id:'ck'+Date.now()+Math.random().toString(36).slice(2,7), wcId:c.id||null, empId:emp?emp.id:null, who:whoName, date:c.date,
    wk:wkForIso(c.date, payload.weekOf), inAt:Number(c.clockedInAt), outAt:c.clockedOutAt==null?null:Number(c.clockedOutAt), ch:importHash, sub:importFingerprint})) : [];
  const clockWks = new Set(incomingClocks.map(c=>c.wk)); if(Array.isArray(payload.clocks) && payload.weekOf) clockWks.add(payload.weekOf);
  const clockSigOf = list=>JSON.stringify(list.map(c=>[c.wcId||'',c.date,c.inAt,c.outAt]).sort());
  const oldClocks = clockRecs.filter(c=>c.who===whoName && clockWks.has(c.wk));
  const clocksChanged = Array.isArray(payload.clocks) && clockSigOf(oldClocks)!==clockSigOf(incomingClocks);
  let unmatchedCars = 0;
  const newEntries = payload.entries.map(pe=>{
    const car = matchCarForImport(pe.carId, pe.car);
    if(!car) unmatchedCars++;
    // A "running low on" pick and a general "flag for Darren" note both become the same
    // yellow-alert flag here — same display and "Solved" button as any other flagged entry.
    // Both can be set at once, so join them instead of one overwriting the other.
    // Any non-blank Notes text becomes the alert (blank/whitespace does nothing).
    const flagParts = [];
    const newFormat = ('notes' in pe);
    const notesText = newFormat ? String(pe.notes||'').trim() : '';
    if(notesText) flagParts.push(notesText);
    if(pe.lowSupply) flagParts.push('Running low: '+pe.lowSupply);
    if(pe.flagNote) flagParts.push(pe.flagNote);
    const ans = pe.pickListAnswers && typeof pe.pickListAnswers==='object' ? pe.pickListAnswers : null;
    const ne = {
      id: newEntryId(), sub: importFingerprint, ch: importHash, wcId: pe.id||null,
      iso: pe.date||null, wk: wkForIso(pe.date, payload.weekOf), empId: emp?emp.id:null, startedAt: pe.startedAt||null, endedAt: pe.endedAt||null,
      car: car ? car.id : (pe.car||''),
      carTyped: car ? null : (pe.car||null), // remembers the exact text that didn't match, for the "needs a car assigned" review
      who: whoName,
      date: isoToShopBossDate(pe.date),
      hours: String(pe.hours!=null?pe.hours:''),
      billable: '', // comes in blank on purpose — the book's billable-hour standard often doesn't match how long the job actually took, so Darrell types the real number in himself instead of starting from a guess
      desc: newFormat ? (String(pe.task||'').trim() || '(no task)') : ([pe.task, pe.desc].filter(Boolean).join(' — ') || '(no description)'),
      notes: notesText || null, lists: newFormat,
      flag: flagParts.length ? flagParts.join(' · ') : null, flagDone:false,
      consumables: pe.consumables || (ans && ans.consumables) || null, photos:0, docs:[],
      pickListAnswers: ans
    };
    ne.orig = entryOrig(ne);
    return ne;
  });
  // A flagged document or photo becomes its own zero-hour flagged entry against the matching
  // car — that reuses every bit of the existing alert machinery (the warning triangle, the open-
  // alerts list, "Solved") instead of needing a second, parallel alert system just for attachments.
  const flaggedAttachmentEntries = [];
  if(Array.isArray(payload.completedDocuments)) payload.completedDocuments.forEach(d=>{
    if(!d.flagNote) return;
    if(d.id && entries.some(x=>x.wcId==='doc:'+d.id)) return;
    const car = matchCarForImport(d.carId, d.car);
    flaggedAttachmentEntries.push({
      id: newEntryId(), sub: importFingerprint, ch: importHash, wcId: d.id?'doc:'+d.id:null, iso: d.date||null, wk: wkForIso(d.date, payload.weekOf), empId: emp?emp.id:null,
      car: car ? car.id : (d.car||''), carTyped: car ? null : (d.car||null), who: whoName, date: isoToShopBossDate(d.date),
      hours:'0', billable:'0', desc:'📄 '+(d.name||'Document')+' needs attention',
      flag: d.flagNote, flagDone:false, consumables:null, photos:0, docs:[]
    });
  });
  if(Array.isArray(payload.photos)) payload.photos.forEach(p=>{
    if(!p.flagNote) return;
    if(p.id && entries.some(x=>x.wcId==='photo:'+p.id)) return;
    const car = matchCarForImport(p.carId, p.car);
    flaggedAttachmentEntries.push({
      id: newEntryId(), sub: importFingerprint, ch: importHash, wcId: p.id?'photo:'+p.id:null, iso: p.date||null, wk: wkForIso(p.date, payload.weekOf), empId: emp?emp.id:null,
      car: car ? car.id : (p.car||''), carTyped: car ? null : (p.car||null), who: whoName, date: isoToShopBossDate(p.date),
      hours:'0', billable:'0', desc:'📷 Photo needs attention',
      flag: p.flagNote, flagDone:false, consumables:null, photos:0, docs:[]
    });
  });
  // ---- Match against what Shop Boss already has for these days (current listings and History) ----
  let sameCount = 0;
  const currentReplacements = []; // {ne, old}: a day that already exists in Incoming and has changed
  const keptNew = [];
  newEntries.forEach(ne=>{
    const old = ne.wcId ? entries.find(x=>x.wcId===ne.wcId && x.who===whoName) : null;
    if(!old){ if(ne.wk && historyWeeks.some(h=>h.wk===ne.wk)) ne.late = true; keptNew.push(ne); return; }
    const diffs = mergeOntoOld(ne, old);
    if(!diffs.length){ sameCount++; old.startedAt = ne.startedAt; old.endedAt = ne.endedAt; return; }
    ne.replaces = old.id; ne.chg = diffs;
    if(old.historyWeekId){ ne.fromHistory = true; keptNew.push(ne); }
    else currentReplacements.push({ne, old});
  });
  newEntries.length = 0; newEntries.push(...keptNew);
  const docsIn = (Array.isArray(payload.completedDocuments) ? payload.completedDocuments : []).filter(d=>!(d.id && completedDocs.some(x=>x.wcId===d.id)));
  const photosIn = (Array.isArray(payload.photos) ? payload.photos : []).filter(p=>!(p.id && (unmatchedPhotos.some(x=>x.wcId===p.id) || cars.some(c=>safeArr(c.photos).some(x=>x.wcId===p.id)))));
  if(!newEntries.length && !currentReplacements.length && !flaggedAttachmentEntries.length && !docsIn.length && !photosIn.length && !clocksChanged){
    alert('Shop Boss already has everything in this submission. Nothing was changed.');
    return;
  }
  const docCount = docsIn.length;
  const photoCount = photosIn.length;
  const flagCount = newEntries.filter(e=>e.flag).length + flaggedAttachmentEntries.length;
  const unmatchedDocs = docsIn.filter(d=>!matchCarForImport(d.carId, d.car)).length;
  const unmatchedPhotosCount = photosIn.filter(p=>!matchCarForImport(p.carId, p.car)).length;
  const unmatchedTotal = unmatchedCars + unmatchedDocs + unmatchedPhotosCount;
  const entryTotalNew = newEntries.length + currentReplacements.length;
  const summary = entryTotalNew+' entr'+(entryTotalNew===1?'y':'ies')+
    (incomingClocks.length?', '+incomingClocks.length+' clock-in/clock-out record'+(incomingClocks.length===1?'':'s'):'')+
    (docCount?', '+docCount+' completed document'+(docCount===1?'':'s'):'')+
    (photoCount?', '+photoCount+' photo'+(photoCount===1?'':'s'):'')+
    (flagCount?', '+flagCount+' flag'+(flagCount===1?'':'s')+' needing attention':'')+
    ' from '+whoName+(payload.weekOf?' for the week of '+payload.weekOf:'')+
    (unmatchedTotal?'.\n\n⚠ '+unmatchedTotal+" didn't match a car on file (check spelling) — nothing is lost, they'll be waiting under \"Needs a car assigned\" in Incoming so you can fix and assign them.":'.');
  if(!confirm('Import this submission?\n\n'+summary)) return;
  // If any of these days already have entries for this same employee, ask rather than silently
  // stacking a second copy — this is what makes "just import it again if you're not sure" safe
  // even when the content actually changed (a day that got corrected and resent, say).
  // A day that already exists in Incoming and has changed: ask, one day at a time. Billable hours, parts and corrections stay.
  currentReplacements.forEach(({ne, old})=>{
    if(confirm('You already have '+old.date+' for '+whoName+'.\n\nReplace it with the new version? Your billable hours, parts and corrections stay.')){
      const i = entries.indexOf(old); if(i>=0) entries.splice(i,1);
      newEntries.push(ne);
    }
  });
  // Older WorkClock files carry no entry ids, so fall back to asking by date.
  const datesInThisImport = [...new Set(newEntries.filter(e=>!e.wcId).map(e=>e.date))];
  datesInThisImport.forEach(date=>{
    const existing = entries.filter(e=>e.who===whoName && e.date===date && !e.historyWeekId);
    if(!existing.length) return;
    const useNew = confirm('You already have an entry for '+whoName+' on '+date+'.\n\nUse this new version instead? (Cancel keeps both.)');
    if(useNew){
      for(let i=entries.length-1;i>=0;i--){ if(entries[i].who===whoName && entries[i].date===date && !entries[i].historyWeekId) entries.splice(i,1); }
    }
  });
  if(payload.submittedAt) importedSubmissionFingerprints.push(importFingerprint);
  if(clocksChanged){ clockRecs = clockRecs.filter(c=>!(c.who===whoName && clockWks.has(c.wk))); clockRecs.push(...incomingClocks); }
  entries.push(...newEntries, ...flaggedAttachmentEntries);
  // Log completed documents and photos against the matching car so they show up on its page,
  // same as work logged directly in Shop Boss.
  docsIn.forEach(d=>{
    const car = matchCarForImport(d.carId, d.car);
    if(car && d.name) car.docs.push(d.name);
    // Keep the actual filled-in file (photo/scan of the form), not just its name, so it can
    // really be opened later — previously this content was received and then thrown away.
    completedDocs.push({
      id:'doc-'+Date.now()+Math.random().toString(36).slice(2,6), sub: importFingerprint, ch: importHash, wcId: d.id||null, iso: d.date||null, wk: wkForIso(d.date, payload.weekOf),
      carId: car?car.id:null, carTyped: car?null:(d.car||null), name: d.name||'Document',
      date: d.date?isoToShopBossDate(d.date):null, who: d.employee || whoName,
      whoId: d.employeeId || payload.employeeId || null,
      fileName: d.fileName||null, mime: d.mime||null, dataUrl: d.dataUrl||null,
      answers: d.answers||null

function fmtClockTime(ms){ return new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }

// One row per day: first clock-in, last clock-out, employee hours. A day with a clock-in that never got a clock-out is flagged and counted as nothing.
function clockDays(who, wk){
  const byDate = {};
  clocksFor(who, wk).forEach(c=>{ (byDate[c.date] = byDate[c.date] || []).push(c); });
  return Object.keys(byDate).sort().map(date=>{
    const cs = byDate[date].slice().sort((a,b)=>a.inAt-b.inAt);
    const missing = cs.some(c=>c.outAt==null);
    const hours = cs.reduce((t,c)=>t+(c.outAt==null?0:(c.outAt-c.inAt)/3600000),0);
    const outs = cs.filter(c=>c.outAt!=null);
    return {date, inAt:cs[0].inAt, outAt: missing ? null : (outs.length?outs[outs.length-1].outAt:null), hours: Math.round(hours*100)/100, missing, count:cs.length};
  });

function empHoursMissingCount(who, wk){ return clockDays(who, wk).filter(d=>d.missing).length; }

// ---- Delete one listing (one employee's one work week). The employee is never deleted. Shop Boss forgets it

function asmDeleteListing(key){
  const L = asmListings().find(x=>x.key===key); if(!L) return;
  const {e, wk, es} = L;
  const subs = new Set(es.map(l=>l.sub).filter(Boolean));
  const mine = x=>!x.pkgWeek && ((x.sub && subs.has(x.sub)) || (wk && x.wk===wk && (x.who===e.name || x.empName===e.name)));
  const docs = completedDocs.filter(mine);
  const photos = [];
  cars.forEach(c=>safeArr(c.photos).forEach(ph=>{ if(mine(ph)) photos.push({carId:c.id, photo:ph}); }));
  const loose = unmatchedPhotos.filter(mine);
  const clk = wk ? clockRecs.filter(c=>c.who===e.name && c.wk===wk) : [];
  const bits = [es.length+' entr'+(es.length===1?'y':'ies')];
  if(clk.length) bits.push(clk.length+' clock-in/clock-out record'+(clk.length===1?'':'s'));
  if(docs.length) bits.push(docs.length+' form'+(docs.length===1?'':'s'));
  if(photos.length+loose.length) bits.push((photos.length+loose.length)+' photo'+(photos.length+loose.length===1?'':'s'));
  if(!confirm('Delete '+e.name+'\'s listing for '+listingTitle(wk).toLowerCase()+'?\n\nThis removes '+bits.join(', ')+'. '+e.name+' stays on your employee list. Shop Boss forgets it received this listing, so the same WorkClock file can be imported again. A copy goes to Recently Deleted so you can restore it.')) return;
  const snap = {key, empId:e.id, empName:e.name, wk, entries:es.slice(), docs:docs.slice(), photos:photos.slice(), loose:loose.slice(), clocks:clk.slice(), subs:[...subs]};
  const eset = new Set(es);
  for(let i=entries.length-1;i>=0;i--) if(eset.has(entries[i])) entries.splice(i,1);
  docs.forEach(d=>{ const i=completedDocs.indexOf(d); if(i>=0) completedDocs.splice(i,1); });
  photos.forEach(x=>{ const c=cars.find(k=>k.id===x.carId); if(c){ const i=c.photos.indexOf(x.photo); if(i>=0) c.photos.splice(i,1); } });
  loose.forEach(ph=>{ const i=unmatchedPhotos.indexOf(ph); if(i>=0) unmatchedPhotos.splice(i,1); });
  clockRecs = clockRecs.filter(c=>!clk.includes(c));
  snap.subs.forEach(sub=>{ if(!entries.some(l=>l.sub===sub)){ const i=importedSubmissionFingerprints.indexOf(sub); if(i>=0) importedSubmissionFingerprints.splice(i,1); } });

  persist(); render();
}

const SB_STORE_KEY = 'sb-shop-data-v2';

    if(Array.isArray(d.billingParts)){ billingParts.length=0; billingParts.push(...d.billingParts); }
    if(Array.isArray(d.notesHelper)){ notesHelper.length=0; notesHelper.push(...d.notesHelper); }
    if(Array.isArray(d.forms)){ forms.length=0; forms.push(...d.forms); }
    if(Array.isArray(d.customLists)){ customLists.length=0; customLists.push(...d.customLists); }
    if(Array.isArray(d.completedDocs)){ completedDocs.length=0; completedDocs.push(...d.completedDocs); }
    if(Array.isArray(d.unmatchedPhotos)){ unmatchedPhotos.length=0; unmatchedPhotos.push(...d.unmatchedPhotos); }
    if(Array.isArray(d.receipts)){ receipts.length=0; receipts.push(...d.receipts); }

    if(Array.isArray(d.shopExpenses)) shopExpenses = d.shopExpenses;
    if(d.lastSentState && typeof d.lastSentState==='object') lastSentState = d.lastSentState;
    if(d.listOrderCustomized) listOrderCustomized = Object.assign({cars:false, employees:false, consumables:false, workTypes:false, customLists:{}}, d.listOrderCustomized);
    if(Array.isArray(d.incomingProcessedFiles)){ incomingProcessedFiles.length=0; incomingProcessedFiles.push(...d.incomingProcessedFiles); }
    if(Array.isArray(d.importedSubmissionFingerprints)){ importedSubmissionFingerprints.length=0; importedSubmissionFingerprints.push(...d.importedSubmissionFingerprints); }
    // Lists created before this feature existed default to "not included, not mandatory" — safe,
    // inert defaults rather than silently starting to send a list Darryl never opted into.
    customLists.forEach(l=>{ if(typeof l.includeInUpdate!=='boolean') l.includeInUpdate=false; delete l.mandatory; });

    // as something other than an array (e.g. photos used to just be a count).
    cars.forEach(c=>{
      if(!Array.isArray(c.photos)) c.photos = [];

}

function mergeEmployees(keepId, mergeId){
  const keep = employees.find(e=>e.id===keepId);
  const merge = employees.find(e=>e.id===mergeId);
  if(!keep || !merge) return;
  if(!confirm(`Move everything from ${merge.name} into ${keep.name}? ${merge.name} will be deleted (recoverable for 30 days). Proceed?`)) return;
  entries.forEach(l=>{ if(l.who===merge.name) l.who = keep.name; });
  merge.cars.forEach(cid=>{
    if(!keep.cars.includes(cid)) keep.cars.push(cid);
    const c = cars.find(x=>x.id===cid);
    if(c){ if(!c.employees.includes(keepId)) c.employees.push(keepId); c.employees = c.employees.filter(id=>id!==mergeId); }
  });
  const idx = employees.indexOf(merge);
  if(idx>=0) employees.splice(idx,1);
  trash.push({id:'merge-'+mergeId+'-'+Date.now(), kind:'Employee', name:merge.name+' (merged into '+keep.name+')', deleted:'Just now', daysLeft:30});
  nav({type:'employee', id:keepId});
}

function pdfClean(s){
  return String(s==null?'':s).replace(/[—–]/g,'-').replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/…/g,'...').replace(/ /g,' ')
    .replace(/[^\x20-\x7e¡-ÿ]/g,'?').replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)');

function pdfBuild(pages){
  // pages: [[{t,x,y,size,bold}]] with y measured from the top of a 612 x 792 page.
  const objs = [];
  const n = pages.length;
  objs[1] = '<< /Type /Catalog /Pages 2 0 R >>';
  objs[2] = '<< /Type /Pages /Kids ['+pages.map((_,i)=>(5+i*2)+' 0 R').join(' ')+'] /Count '+n+' >>';
  objs[3] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>';
  objs[4] = '<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>';
  pages.forEach((items,i)=>{
    const body = items.map(it=>'BT /'+(it.bold?'F2':'F1')+' '+it.size+' Tf '+it.x.toFixed(1)+' '+(792-it.y).toFixed(1)+' Td ('+pdfClean(it.t)+') Tj ET').join('\n');
    objs[5+i*2] = '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents '+(6+i*2)+' 0 R >>';
    objs[6+i*2] = '<< /Length '+body.length+' >>\nstream\n'+body+'\nendstream';
  });
  let out = '%PDF-1.4\n'; const offs = [];
  for(let i=1;i<objs.length;i++){ offs[i] = out.length; out += i+' 0 obj\n'+objs[i]+'\nendobj\n'; }
  const xref = out.length;
  out += 'xref\n0 '+objs.length+'\n0000000000 65535 f \n'+offs.slice(1).map(o=>String(o).padStart(10,'0')+' 00000 n \n').join('')+'trailer\n<< /Size '+objs.length+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF\n';
  const u8 = new Uint8Array(out.length);
  for(let i=0;i<out.length;i++) u8[i] = out.charCodeAt(i) & 255;
  return u8;
}
// Lays text out line by line and starts a new page when one fills up.
function pdfLayout(){
  const pages = []; let cur = null, y = 0;
  const newPage = ()=>{ cur = []; pages.push(cur); y = 54; };
  newPage();
  const api = {
    space(h){ y += h; },
    line(text, o){
      o = o || {}; const size = o.size || 10, lh = size*1.45;
      const x = o.x != null ? o.x : 54;
      const maxChars = Math.max(10, Math.floor((612-54-x)/(size*0.5)));
      const words = String(text==null?'':text).split(/\s+/); let ln = '';
      const flush = s=>{ if(y+lh > 760) newPage(); cur.push({t:s, x, y, size, bold:!!o.bold}); y += lh; };
      if(!words.join('')){ y += lh; return; }
      words.forEach(w=>{
        while(w.length > maxChars){ if(ln){ flush(ln); ln = ''; } flush(w.slice(0,maxChars)); w = w.slice(maxChars); }
        if((ln+' '+w).trim().length > maxChars){ flush(ln); ln = w; } else ln = (ln+' '+w).trim();
      });
      if(ln) flush(ln);
    },
    row(cells, o){
      o = o || {}; const size = o.size || 10, lh = size*1.45;
      if(y+lh > 760) newPage();
      cells.forEach(c=>{ cur.push({t:String(c[0]==null?'':c[0]).slice(0, c[2]||60), x:c[1], y, size, bold:!!o.bold}); });
      y += lh;
    },
    newPage(){ newPage(); },
    pages(){ return pages; }
  };
  return api;
}

async function deliverZips(zips){
  const files = zips.map(z=>new File([z.blob], z.fname, {type:'application/zip'}));
  try{
    if(typeof navigator!=='undefined' && navigator.share && navigator.canShare && navigator.canShare({files})){
      await navigator.share({files, title:'Shop Boss — accountant package'});
      return {result:'shared', wroteCopy:false};
    }
  }catch(err){
    if(err && err.name==='AbortError') return {result:'declined', wroteCopy:false};
  }
  let wroteCopy = false;
  if(accountantDirHandle){
    for(const z of zips){ if(await sbWriteFileToHandle(accountantDirHandle, z.fname, z.blob)) wroteCopy = true; }
  }
  let saved = 0;
  try{
    if(typeof claude!=='undefined' && claude.use){
      const downloads = await claude.use('downloads');
      if(downloads){ for(const z of zips){ await downloads.save({filename:z.fname, data: await z.blob.arrayBuffer()}); saved++; } return {result:'saved', wroteCopy}; }
    }
  }catch(err){ if(err && err.code==='declined') return {result:'declined', wroteCopy}; }
  for(const z of zips){ if(sbDownloadBlob(z.fname, z.blob)) saved++; }
  if(!saved && !wroteCopy) return {result:'unavailable', wroteCopy:false};
  return {result:'saved', wroteCopy};
}

    h += `</div>`;
  }
  if(pkg.docs.length){

function entryFinished(l){ return String(l.billable==null?'':l.billable).trim()!==''; }
function recalcHistoryWeek(hw){
  const es = entries.filter(l=>l.historyWeekId===hw.id);
  hw.cars = [...new Set(es.map(l=>l.car).filter(Boolean))];
  hw.totalLogged = Math.round(es.reduce((s,l)=>s+(parseFloat(l.hours)||0),0)*100)/100;
  hw.totalBillable = Math.round(es.reduce((s,l)=>s+(parseFloat(l.billable)||0),0)*100)/100;
}
// Records which forms, photos and receipts belong to a released week (they stay stored where they are; nothing is copied).
function tagPackage(hw, grp, withReceipts){
  const subs = new Set(grp.map(l=>l.sub).filter(Boolean));
  const mine = x=>!x.pkgWeek && ((hw.wk && x.wk===hw.wk) || (!hw.wk && !x.wk && x.sub && subs.has(x.sub)));
  completedDocs.forEach(d=>{ if(mine(d)) d.pkgWeek = hw.id; });
  cars.forEach(c=>safeArr(c.photos).forEach(ph=>{ if(mine(ph)) ph.pkgWeek = hw.id; }));
  unmatchedPhotos.forEach(ph=>{ if(mine(ph)) ph.pkgWeek = hw.id; });
  if(withReceipts){ receipts.forEach(r=>{ if(!r.pkgWeek) r.pkgWeek = hw.id; }); shopExpenses.forEach(x=>{ if(!x.pkgWeek) x.pkgWeek = hw.id; }); }
}
function correctionMessage(hw, who, g2){
  const all = [...listingChangeLines(g2), ...listingAddedLines(g2)];
  return 'Change your saved week of '+wkLabel(hw.wk)+' for '+who+'?\n\n'+(all.length===1?'The only change:\n':'The changes:\n')+all.join('\n')+'\n\nEverything else stays the same.';
}
function applyToHistoryWeek(hw, g2){
  g2.forEach(l=>{
    if(l.replaces){
      const old = entries.find(x=>x.id===l.replaces);
      if(old){
        const i = entries.indexOf(old); entries.splice(i,1);
        trash.push({id:'trash-rep-'+Date.now()+Math.random().toString(36).slice(2,6), kind:'ReplacedEntry', name:old.who+' — '+old.date+' (before the change)', deleted:'Just now', daysLeft:30, snapshot:{old, newId:l.id}});
      }
    }
    l.historyWeekId = hw.id;
    delete l.replaces; delete l.fromHistory; delete l.chg; delete l.late;
  });
}
async function asmReleaseToHistory(){
  if(!asm.sentToAccountant && !confirm('You haven\'t marked this week as sent to the accountant yet. Release to history anyway?')) return;
  const allLive = currentEntries();
  const clockOnlyWks = asmListings().filter(L=>!L.es.length).map(L=>L.wk);
  if(!allLive.length && !clockOnlyWks.length){ alert('Nothing to release — Incoming is already empty.'); return; }
  const unfinished = allLive.filter(l=>!entryFinished(l));
  const left = asmStatus().filter(x=>x.state!=='done').length;
  if(!unfinished.length && left && !confirm(left+(left===1?' listing is':' listings are')+' not marked done yet. Release to history anyway?')) return;
  let live = allLive;
  if(unfinished.length){
    const fin = allLive.length - unfinished.length;
    const c = await sbChoiceMulti('Release to History\n\nFinished entries (billable hours filled in): '+fin+'\nNot finished (billable hours missing): '+unfinished.length+'\n\nWhat do you want to send?', ['Send only the finished entries ('+fin+')', 'Send everything ('+allLive.length+')', 'Cancel']);
    if(c===2) return;
    if(c===0){
      if(!fin){ alert('No entry is finished yet, so nothing was sent. Fill in the billable hours first.'); return; }
      live = allLive.filter(entryFinished);
    } else if(!(await sbChoice('Are you sure? '+unfinished.length+' unfinished entr'+(unfinished.length===1?'y':'ies')+' will go to History with an exclamation mark.', 'Yes, send everything', 'Cancel'))) return;
  }
  const released = []; const kept = []; let firstDone = false; let lastLabel = '';
  for(const wk of [...new Set([...live.map(l=>l.wk||''), ...(live===allLive?clockOnlyWks:[])])].sort()){
    const grp = live.filter(l=>(l.wk||'')===wk);
    const hw0 = wk ? historyWeeks.find(h=>h.wk===wk) : null;
    if(hw0){
      for(const who of [...new Set(grp.map(l=>l.who))]){
        const g2 = grp.filter(l=>l.who===who);
        const all = [...listingChangeLines(g2), ...listingAddedLines(g2)];
        if(all.length && !(await sbChoice(correctionMessage(hw0, who, g2), 'Make this change', 'Cancel'))){ kept.push(who+', week of '+wkLabel(wk)); continue; }
        applyToHistoryWeek(hw0, g2); released.push(...g2);
      }
      recalcHistoryWeek(hw0); tagPackage(hw0, grp, !firstDone); firstDone = true; lastLabel = hw0.label;
    } else {
      const wid = 'w'+Date.now()+Math.random().toString(36).slice(2,5);
      const now = new Date();
      const fmtShort = d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
      const label = wk ? wkLabelYear(wk) : fmtShort(new Date(now.getFullYear(),now.getMonth(),now.getDate()-6))+' – '+fmtShort(now);
      const hw = {id:wid, label, wk, wkEnd: wk?isoAddDays(wk,6):'', cars:[], totalLogged:0, totalBillable:0, sentToAccountant: asm.sentToAccountant, releasedAt: now.toISOString()};
      historyWeeks.unshift(hw);
      grp.forEach(l=>{ l.historyWeekId = wid; delete l.replaces; delete l.fromHistory; delete l.chg; delete l.late; });
      recalcHistoryWeek(hw); tagPackage(hw, grp, !firstDone); firstDone = true; lastLabel = label; released.push(...grp);
    }
  }
  const rest = currentEntries();
  // Entries left behind in a week that is now saved in History join it later through the "Change your saved week" question.
  rest.forEach(l=>{ if(l.wk && historyWeeks.some(h=>h.wk===l.wk) && !l.fromHistory) l.late = true; });
  if(!rest.length) asm = {reviewed:{}, waived:{}, sentToAccountant:false};
  else asmListings().forEach(L=>{ if(!L.es.length) { delete asm.reviewed[L.key]; delete asm.waived[L.key]; } });
  persist();
  if(!released.length && !lastLabel){ render(); return; }
  alert('Released — '+released.length+' entr'+(released.length===1?'y':'ies')+' moved into History as "'+lastLabel+'".'+(kept.length?'\n\nStill in Incoming because you chose Cancel: '+kept.join('; ')+'.':' Incoming is clear for next week.'));
  navReplace({type:'history'});
}
// Pulls an archived week's entries back into Incoming, editable again — for a correction after
// the fact. The history record itself is removed since those entries are live again, not archived.
function reopenHistoryWeek(wid){
  const w = historyWeeks.find(x=>x.id===wid);
  if(!w) return;
  if(!confirm('Reopen "'+w.label+'" in Assembly Room? Its entries go back to Incoming, editable again, and you\'ll need to send and release it again when you\'re done.')) return;
  entries.forEach(l=>{ if(l.historyWeekId===wid) l.historyWeekId = null; });
  completedDocs.forEach(d=>{ if(d.pkgWeek===wid) delete d.pkgWeek; });
  receipts.forEach(r=>{ if(r.pkgWeek===wid) delete r.pkgWeek; });
  shopExpenses.forEach(x=>{ if(x.pkgWeek===wid) delete x.pkgWeek; });
  cars.forEach(c=>safeArr(c.photos).forEach(ph=>{ if(ph.pkgWeek===wid) delete ph.pkgWeek; }));
  unmatchedPhotos.forEach(ph=>{ if(ph.pkgWeek===wid) delete ph.pkgWeek; });
  const idx = historyWeeks.findIndex(x=>x.id===wid);
  if(idx>=0) historyWeeks.splice(idx,1);
  asm.sentToAccountant = false;
  persist();
  navReplace({type:'assembly', tab:'incoming'});
}
// ---- Real deletes of work records: a week, a day, or one task. Employees, cars and blank forms are never touched. ----
function wrAllCarPhotos(){ const out = []; cars.forEach(c=>safeArr(c.photos).forEach(ph=>out.push({carId:c.id, photo:ph}))); return out; }
function wrCollectWeek(hw){
  return {
    entries: entries.filter(l=>l.historyWeekId===hw.id),
    clocks: hw.wk ? clockRecs.filter(c=>c.wk===hw.wk) : [],
    docs: completedDocs.filter(d=>d.pkgWeek===hw.id),

    loose: unmatchedPhotos.filter(ph=>ph.pkgWeek===hw.id)
  };
}
function wrCollectDay(iso, es, who){
  return {
    entries: es.slice(),
    clocks: clockRecs.filter(c=>c.date===iso && (!who || c.who===who)),
    docs: completedDocs.filter(d=>d.iso===iso && (!who || d.who===who)),
    photos: wrAllCarPhotos().filter(x=>x.photo.iso===iso && (!who || x.photo.empName===who)),

  };

function wrCountsText(s){
  const bits = [];
  if(s.entries.length) bits.push(s.entries.length+' work entr'+(s.entries.length===1?'y':'ies')+' ('+fmtHrsMin(s.entries.reduce((t,l)=>t+(parseFloat(l.hours)||0),0))+' task hours)');
  const parts = s.entries.reduce((t,l)=>t+safeArr(l.parts).length,0);
  if(parts) bits.push(parts+' part'+(parts===1?'':'s'));
  if(s.clocks.length) bits.push(s.clocks.length+' clock-in/clock-out record'+(s.clocks.length===1?'':'s'));
  if(s.docs.length) bits.push(s.docs.length+' form'+(s.docs.length===1?'':'s'));
  const ph = s.photos.length + s.loose.length;
  if(ph) bits.push(ph+' photo'+(ph===1?'':'s'));
  return bits.length ? bits.join(', ') : 'nothing';
}
// Takes the records out of every place they live, fixes the History week summaries, and keeps a copy in Recently Deleted for 30 days.
function wrRemove(s, kind, name, extraSnap){
  const hwIds = new Set(s.entries.map(l=>l.historyWeekId).filter(Boolean));
  const subs = new Set([...s.entries, ...s.docs, ...s.photos.map(x=>x.photo), ...s.loose].map(x=>x.sub).filter(Boolean));
  const eset = new Set(s.entries);
  for(let i=entries.length-1;i>=0;i--) if(eset.has(entries[i])) entries.splice(i,1);
  const cset = new Set(s.clocks); clockRecs = clockRecs.filter(c=>!cset.has(c));
  s.docs.forEach(d=>{
    const i = completedDocs.indexOf(d); if(i>=0) completedDocs.splice(i,1);
    const c = cars.find(k=>k.id===d.carId); if(c && Array.isArray(c.docs)){ const j = c.docs.indexOf(d.name); if(j>=0) c.docs.splice(j,1); }
  });
  s.photos.forEach(x=>{ const c = cars.find(k=>k.id===x.carId); if(c){ const i = c.photos.indexOf(x.photo); if(i>=0) c.photos.splice(i,1); } });
  s.loose.forEach(ph=>{ const i = unmatchedPhotos.indexOf(ph); if(i>=0) unmatchedPhotos.splice(i,1); });
  const removedWeeks = [];
  hwIds.forEach(id=>{
    const hw = historyWeeks.find(h=>h.id===id); if(!hw) return;
    const left = entries.some(l=>l.historyWeekId===id);
    const hasClocks = hw.wk && clockRecs.some(c=>c.wk===hw.wk);
    if(!left && !hasClocks){ historyWeeks.splice(historyWeeks.indexOf(hw),1); removedWeeks.push(hw); }
    else recalcHistoryWeek(hw);
  });
  if(s.wholeWeek && !removedWeeks.includes(s.wholeWeek)){ const i = historyWeeks.indexOf(s.wholeWeek); if(i>=0){ historyWeeks.splice(i,1); removedWeeks.push(s.wholeWeek); } }
  subs.forEach(sub=>{
    const still = entries.some(l=>l.sub===sub) || completedDocs.some(d=>d.sub===sub) || clockRecs.some(c=>c.sub===sub) || wrAllCarPhotos().some(x=>x.photo.sub===sub) || unmatchedPhotos.some(x=>x.sub===sub);
    if(!still){ const i = importedSubmissionFingerprints.indexOf(sub); if(i>=0) importedSubmissionFingerprints.splice(i,1); }
  });
  trash.push({id:'trash-wr-'+Date.now()+Math.random().toString(36).slice(2,6), kind, name, deleted:'Just now', daysLeft:30,
    snapshot:Object.assign({entries:s.entries, clocks:s.clocks, docs:s.docs, photos:s.photos, loose:s.loose, weeks:removedWeeks, subs:[...subs]}, extraSnap||{})});
  persist();
}
function wrRestore(sn){
  safeArr(sn.weeks).forEach(hw=>{ if(!historyWeeks.some(h=>h.id===hw.id)) historyWeeks.unshift(hw); });
  safeArr(sn.entries).forEach(l=>{ if(!entries.includes(l) && !(l.id && entries.some(x=>x.id===l.id))) entries.push(l); });
  safeArr(sn.clocks).forEach(c=>{ if(!clockRecs.some(x=>x.id===c.id)) clockRecs.push(c); });
  safeArr(sn.docs).forEach(d=>{ if(!completedDocs.some(x=>x.id===d.id)){ completedDocs.push(d); const c = cars.find(k=>k.id===d.carId); if(c && d.name){ if(!Array.isArray(c.docs)) c.docs = []; c.docs.push(d.name); } } });
  safeArr(sn.photos).forEach(x=>{ const c = cars.find(k=>k.id===x.carId); if(c){ if(!Array.isArray(c.photos)) c.photos = []; if(!c.photos.some(q=>q.id===x.photo.id)) c.photos.push(x.photo); } });
  safeArr(sn.loose).forEach(ph=>{ if(!unmatchedPhotos.some(x=>x.id===ph.id)) unmatchedPhotos.push(ph); });
  safeArr(sn.subs).forEach(sub=>{ if(!importedSubmissionFingerprints.includes(sub)) importedSubmissionFingerprints.push(sub); });
  historyWeeks.forEach(hw=>recalcHistoryWeek(hw));
}

function runSearch(q){
  const box = document.getElementById('search-results'), sug = document.getElementById('search-suggest');
  q = q.trim().toLowerCase();
  if(!q){ box.innerHTML=''; sug.innerHTML=''; return; }
  const toks = q.split(/\s+/), last = toks[toks.length-1];
  const idx = searchIndex();
  const vocab = new Set();

function normalizeCars(){
  // Guards against older saved/restored data where a car's photos/notes/docs/employees
  // were stored as something other than an array (e.g. photos used to just be a count).
  // Runs every render, not just at boot, so a trash-restore or an imported backup can't
  // reintroduce the shape and crash a screen later.
  cars.forEach(c=>{
    if(!Array.isArray(c.photos)) c.photos = [];
    if(!Array.isArray(c.notes)) c.notes = [];
    if(!Array.isArray(c.docs)) c.docs = [];
    if(!Array.isArray(c.employees)) c.employees = [];
  });
}
function render(){
  try{ normalizeCars(); }catch(e){}
  try{ persist(); }catch(e){}
  if(!stack || !stack.length) stack = ['home'];
  const view = stack[stack.length-1];
  if(!isAsmSubView(view.type)) outSnap = null;
  try{
    const backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.hidden = stack.length<=1 || view.type==='assembly';
    const app = document.getElementById('app');
    const body = renderers[view.type] ? renderers[view.type](view) : renderers.home();
    const printed = sbToday().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    app.innerHTML = `<div class="print-only print-head">Shop Boss — printed ${printed}${fltActive()?' — Filtered: '+fltSummary():''}</div>` + body;
  }catch(err){
    // A screen failed to draw. Never leave the tap looking like nothing happened —
    // show a visible, recoverable error instead of freezing on stale content.
    const app = document.getElementById('app');
    if(app){
      const msg = (err && err.message) ? err.message : String(err);
      app.innerHTML = `
        <h2 class="list-title">Something went wrong opening that screen</h2>
        <p class="list-sub">This screen hit an error instead of loading. Nothing was lost — your cars, employees and work log are untouched. Tap below to go back to the start screen.</p>
        <p class="list-sub" style="font-family:monospace;font-size:12px;word-break:break-all">${String(msg).replace(/</g,'&lt;')}</p>
        <button class="btn-primary" style="width:100%" onclick="recoverToHome()">Back to start screen</button>`;

  }
}

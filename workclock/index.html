// ---- adding a work entry for a day that's already passed — reached from the calendar/day view,
// since the live timer only makes sense for whatever's happening right now. ----
function dateBaseMs(dateStr){ return new Date(dateStr+'T12:00:00').getTime(); }
function saveManualEntry(dateStr, car, taskText, startTimeStr, endTimeStr, notes){
  car = (car||'').trim();
  const task = normList(taskText);
  const common = {date:dateStr, car, task, notes, startTimeStr, endTimeStr, answers: collectPickListAnswers()};
  if(!car){ navReplace({type:'newEntryForDate', ...common, err:'Enter which car this was for.'}); return; }
  if(!task){ navReplace({type:'newEntryForDate', ...common, err:'Add at least one task — type it, or tap + to pick.'}); return; }
  if(!startTimeStr || !endTimeStr){ navReplace({type:'newEntryForDate', ...common, err:'Pick a start and end time.'}); return; }
  const base = dateBaseMs(dateStr);
  const startedAt = timeInputToMs(startTimeStr, base);
  const endedAt = timeInputToMs(endTimeStr, base);
  if(startedAt>Date.now()){ navReplace({type:'newEntryForDate', ...common, err:'That start time is in the future.'}); return; }
  if(endedAt<=startedAt){ navReplace({type:'newEntryForDate', ...common, err:'End time has to be after the start time.'}); return; }
  const hours = (endedAt-startedAt)/3600000;
  entries.push({
    id: uid(), empId: currentEmp, empName: (employees.find(e=>e.id===currentEmp)||{}).name||'',
    car, carId: matchShopCarId(car), task, desc:(notes||'').trim(), consumables:'', lowSupply:null, flagNote:null,
    pickListAnswers: collectPickListAnswers(),
    date: dateStr, hours, startedAt, endedAt, weekId: null, submitted:false
  });
  showToast('Entry added for '+fmtDate(dateStr)+'.');
  goBack();
  showFormReminder(car);
}
// Forms assigned to this car that this employee hasn't filled out yet. A gentle reminder only — nothing here ever blocks saving.
function carFormsWaiting(carName){
  const cn = String(carName||'').trim().toLowerCase(); if(!cn) return [];
  return documents.filter(d=>docIsReal(d) && d.car && String(d.car).trim().toLowerCase()===cn && (!d.empId || d.empId===currentEmp) && docIsOpen(d) && docTimesFilled(d)===0);
}
function showFormReminder(carName){
  const w = carFormsWaiting(carName); if(!w.length) return;
  const names = w.map(d=>d.name).join(' and ');
  const ov = document.createElement('div'); ov.id = 'formReminder';
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px';
  ov.innerHTML = '<div class="card" style="width:min(380px,100%)"><h3 style="margin:0 0 8px">'+escText(names)+' '+(w.length>1?'are':'is')+' waiting</h3><p class="sub" style="margin:0 0 14px">For '+escText(carName)+'.</p><button class="btn-primary" id="frNow">Fill it out now</button><button class="btn-ghost" id="frLater" style="margin-top:8px">Later</button></div>';
  document.body.appendChild(ov);
  document.getElementById('frLater').onclick = ()=>ov.remove();
  document.getElementById('frNow').onclick = ()=>{ ov.remove(); stack = [{type:'home'},{type:'fillDocument', id:w[0].id}]; render(); };
}
// Jobs from Shop Boss's to-do lists that this employee hasn't already done (done = saved on this device).
function openTodoCars(){
  return shopTodos.map(c=>({carName:c.carName, jobs:c.jobs.filter(j=>todoDone.indexOf(j.id)<0)})).filter(c=>c.jobs.length);
}
function todoShort(c){
  const t = c.jobs.map(j=>j.text).join(', ');
  return t.length>60 ? t.slice(0,57).replace(/[ ,]+$/,'')+'…' : t;
}
function startTodo(carName, jobId){
  const c = openTodoCars().find(x=>x.carName===carName); const j = c && c.jobs.find(x=>x.id===jobId); if(!j) return;
  if(active && !activeIsMine()){ showToast(activeOwnerName()+' still has a task running on this tablet — switch to them to end it first.', true); return; }
  if(active && activeIsMine()){ showToast('End your current task first.', true); return; }
  askConfirm('Start a timer task on this job? '+carName+' — '+j.text, 'Yes', ()=>startTask(carName, j.text, j.id));
}
function saveEntry(id, car, taskText, minutes, notes, startedAt, endedAt, empId){
  minutes = parseFloat(minutes);
  const task = normList(taskText);
  if(!car || !car.trim()){ showToast('Enter which car this was for.', true); return; }
  if(!task){ showToast('Add at least one task — type it, or tap + to pick.', true); return; }
  if(!(minutes>0)){ showToast('Minutes worked has to be more than zero.', true); return; }
  const hours = minutes/60;
  // The entry is credited to whoever actually ran the task (carried through explicitly from when
  // it started), not whoever happens to be signed in at the moment Save is tapped — on a shared
  // tablet those can be two different people if it got handed off mid-task.
  const ownerId = empId || currentEmp;
  const todoId = (active && active.id===id && active.todoId) ? active.todoId : null;
  if(todoId && todoDone.indexOf(todoId)<0) todoDone.push(todoId);
  entries.push({
    todoId,
    id: id||uid(), empId: ownerId, empName: (employees.find(e=>e.id===ownerId)||{}).name||'',
    car: car.trim(), carId: matchShopCarId(car), task, desc:(notes||'').trim(), consumables:'',
    lowSupply:null, flagNote:null, pickListAnswers: collectPickListAnswers(),
    date: startedAt?isoDateOf(startedAt):todayISO(), hours, startedAt, endedAt, weekId: null, submitted:false
  });
  // The task really is done now that its hours are safely recorded — this is what actually
  // clears it, rather than clearing it the moment the Save screen opens (see stopTask above).
  if(active && active.id===id) active = null;
  stack = [{type:'home'}];
  render();
  showFormReminder(car);
}
// Explicit, confirmed way to throw a stopped-but-unsaved task away — reachable only from the
// Save-hours screen itself, never by accident. Anything attached mid-task (a photo, a form) gets
// dropped with it, same as cancelling a task that never got this far.
function discardStoppedTask(id){
  if(!confirm('Discard this task? Its hours will NOT be saved — this can\'t be undone.')) return;
  for(let i=photos.length-1;i>=0;i--) if(photos[i].entryId===id) photos.splice(i,1);
  for(let i=completedDocs.length-1;i>=0;i--) if(completedDocs[i].entryId===id) completedDocs.splice(i,1);
  if(active && active.id===id) active = null;
  stack = [{type:'home'}];
  render();
}

// ---- editing a start/end time after the fact (forgot to clock in/out or start/stop a task on time) ----
function saveEditTime(which, timeStr){
  if(!timeStr){ showToast('Pick a time.', true); return; }
  if(which==='clockIn'){
    const dc = myOpenDayClock();
    if(!dc) return;
    const ms = timeInputToMs(timeStr, dc.clockedInAt);
    if(ms>Date.now()){ showToast('That time is in the future.', true); return; }
    dc.clockedInAt = ms;
    stack=[{type:'home'}]; render();
  } else if(which==='clockOut'){
    const dc = myOpenDayClock();
    if(!dc) return;
    const ms = timeInputToMs(timeStr, Date.now());
    if(ms>Date.now()){ showToast('That time is in the future.', true); return; }
    if(ms<=dc.clockedInAt){ showToast('Clock-out has to be after clock-in.', true); return; }
    dc.clockedOutAt = ms;
    stack=[{type:'home'}]; render();
  } else if(which==='taskStart'){
    if(!active) return;
    const ms = timeInputToMs(timeStr, active.startedAt);
    if(ms>Date.now()){ showToast('That time is in the future.', true); return; }
    active.startedAt = ms;
    navReplace({type:'running'});
  }
}
function saveActiveTaskEdit(car, taskText, timeStr, notes){
  if(!active) return;
  car = (car||'').trim();
  const task = normList(taskText);
  if(!car){ showToast('Enter which car this is for.', true); return; }
  if(!task){ showToast('Add at least one task — type it, or tap + to pick.', true); return; }
  if(!timeStr){ showToast('Pick a start time.', true); return; }
  const ms = timeInputToMs(timeStr, active.startedAt);
  if(ms>Date.now()){ showToast('That time is in the future.', true); return; }
  const dc = myOpenDayClock();
  if(dc && ms<dc.clockedInAt){ showToast("That's before you clocked in today — pick a time after that.", true); return; }
  if(!okToChangeCar(active.car, car)) return;
  active.car = car;
  active.carId = matchShopCarId(car);
  active.task = task;
  active.startedAt = ms;
  active.notes = (notes||'').trim();
  active.lists = collectPickListAnswers();
  goBack();
}

// ---- editing an already-saved entry (after the task has ended) ----
function saveEditedEntry(id, car, taskText, startTimeStr, endTimeStr, notes, dateStr){
  const entry = entries.find(l=>l.id===id);
  if(!entry) return;
  dateStr = dateStr || entry.date;
  if(dateStr>todayISO()){ showToast('That date is in the future.', true); return; }
  car = (car||'').trim();
  const task = normList(taskText);
  if(!car){ showToast('Enter which car this was for.', true); return; }
  if(!task){ showToast('Add at least one task — type it, or tap + to pick.', true); return; }
  if(!startTimeStr || !endTimeStr){ showToast('Pick a start and end time.', true); return; }
  const baseMs = new Date(dateStr+'T12:00:00').getTime();
  const startedAt = timeInputToMs(startTimeStr, baseMs);
  const endedAt = timeInputToMs(endTimeStr, baseMs);
  if(endedAt>Date.now()){ showToast('End time is in the future.', true); return; }
  if(endedAt<=startedAt){ showToast('End time has to be after the start time.', true); return; }
  const dc = dayClocks.find(d=>d.empId===currentEmp && d.date===dateStr);
  if(dc && startedAt<dc.clockedInAt){ showToast("That's before you clocked in that day — pick a time after that.", true); return; }
  if(dc && dc.clockedOutAt!=null && endedAt>dc.clockedOutAt){ showToast("That's after you clocked out that day — pick a time before that.", true); return; }
  if(!okToChangeCar(entry.car, car)) return;
  entry.car = car;
  entry.carId = matchShopCarId(car);
  entry.task = task;
  entry.desc = (notes||'').trim();
  entry.pickListAnswers = collectPickListAnswers();
  entry.startedAt = startedAt;
  entry.endedAt = endedAt;
  entry.date = isoDateOf(startedAt); // filed under the day it actually starts on
  entry.weekId = weekIdFor(entry.date);
  entry.hours = Math.round((endedAt-startedAt)/3600000*100)/100;
  // If this entry already went out to Shop Boss, the correction has to go out again too — otherwise
  // it silently never leaves this phone, since Submit only ever looks at what's still unsent.
  const wasAlreadySent = entry.submitted;
  entry.submitted = false;
  showToast(wasAlreadySent ? 'Entry updated — it\'ll go out again next time you submit.' : 'Entry updated.');
  goBack(); // returns to wherever this entry was opened from — home, a week, or a day
}
function requestDeleteEntry(id){
  askConfirm('Delete this entry? This can\'t be undone.', 'Delete', ()=>doDeleteEntry(id));
}
function doDeleteEntry(id){
  const idx = entries.findIndex(l=>l.id===id);
  if(idx>=0) entries.splice(idx,1);
  stack.pop(); // the confirm screen
  stack.pop(); // the edit-entry screen
  if(!stack.length) stack = [{type:'home'}];
  render();
}

// ---- submit work week: the one-way hand-off into Shop Boss ----
function myWeekEntries(){
  return entries.filter(l=>l.empId===currentEmp && inCurrentWeek(l.date));
}
function myUnsubmittedWeekEntries(){ return myWeekEntries().filter(l=>!l.submitted); }
function myUnsubmittedCompletedDocsForWeek(wid){
  return completedDocs.filter(d=>d.empId===currentEmp && d.weekId===wid && !d.submitted);
}
function myUnsubmittedPhotosForWeek(wid){
  return photos.filter(p=>p.empId===currentEmp && p.weekId===wid && !p.submitted);
}
// "Submit work week" doesn't actually mean "only this calendar week" — someone adding a day they
// forgot, after a new week has already started, still needs it to go out next time they hit
// Submit. So this sweeps up EVERY unsent entry/doc/photo for this employee, no matter how old.
function myAllUnsubmittedEntries(){ return entries.filter(l=>l.empId===currentEmp && !l.submitted); }
function myAllUnsubmittedDocs(){ return completedDocs.filter(d=>d.empId===currentEmp && !d.submitted); }
function myAllUnsubmittedPhotos(){ return photos.filter(p=>p.empId===currentEmp && !p.submitted); }
function myUnsubmittedClocks(){ return dayClocks.filter(c=>c.empId===currentEmp && !c.submitted); }
// Everything this person has not sent yet, across every week. A work week with a clock time that
// has not gone out yet is sent whole (its already-sent entries too), so the file is always a full week.
function myUnsentWork(){
  const entriesNew = myAllUnsubmittedEntries(), docs = myAllUnsubmittedDocs(), phs = myAllUnsubmittedPhotos(), clocks = myUnsubmittedClocks();
  const clockWids = [...new Set(clocks.map(c=>weekIdFor(c.date)))];
  const extra = entries.filter(l=>l.empId===currentEmp && l.submitted && clockWids.includes(weekIdFor(l.date)));
  return {entries: entriesNew.concat(extra), docs, photos: phs, clocks, clockWids,
          count: entriesNew.length + docs.length + phs.length + clocks.length};
}
function myUnsubmittedEntriesForDate(dateStr){ return entries.filter(l=>l.empId===currentEmp && l.date===dateStr && !l.submitted); }
function myUnsubmittedDocsForDate(dateStr){ return completedDocs.filter(d=>d.empId===currentEmp && d.date===dateStr && !d.submitted); }
function myUnsubmittedPhotosForDate(dateStr){ return photos.filter(p=>p.empId===currentEmp && p.date===dateStr && !p.submitted); }
// A plain nudge, not a hard rule: which weekdays so far this week (Mon–Fri, up to but not
// including today) have nothing logged at all for this employee — so they can catch it themselves
// before leaving, rather than Darren finding out next week.
// Is this weekday (0 Sun..6 Sat) inside the work week Shop Boss set (start day through end day)?
// Before Shop Boss has said, fall back to Mon-Fri. Days outside it never trigger the "nothing
// logged" note - but they can still be logged on, and that still goes out with the submission.
function isWorkWeekDow(dow){
  if(!weekEndDay || WEEK_DAY_CODES.indexOf(weekStartDay)<0) return dow!==0 && dow!==6;
  const sIdx = (WEEK_DAY_CODES.indexOf(weekStartDay)+1)%7, eIdx = (WEEK_DAY_CODES.indexOf(weekEndDay)+1)%7;
  return sIdx<=eIdx ? (dow>=sIdx && dow<=eIdx) : (dow>=sIdx || dow<=eIdx);
}
function missingWeekdaysSoFar(){
  const {start} = weekRange();
  const todayStr = todayISO();
  const out = [];
  const d = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  for(let i=0;i<7;i++){
    const ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    if(ds>=todayStr) break;
    const dow = d.getDay(); // 0 Sun..6 Sat
    if(isWorkWeekDow(dow) && !entries.some(l=>l.empId===currentEmp && l.date===ds)) out.push(ds);
    d.setDate(d.getDate()+1);
  }
  return out;
}
function submitWeek(){
  const u = myUnsentWork();
  const toSend = u.entries, docsToSend = u.docs, photosToSend = u.photos;
  if(!u.count){ showToast('Nothing new to submit.'); return; }
  const parts = [];
  const newEntries = myAllUnsubmittedEntries();
  if(newEntries.length) parts.push(newEntries.length+' entr'+(newEntries.length===1?'y':'ies')+' ('+fmtHrsMin(newEntries.reduce((s,l)=>s+l.hours,0))+')');
  if(u.clocks.length) parts.push(u.clocks.length+' clock-in/clock-out day'+(u.clocks.length===1?'':'s'));
  if(docsToSend.length) parts.push(docsToSend.length+' completed document'+(docsToSend.length===1?'':'s'));
  if(photosToSend.length) parts.push(photosToSend.length+' photo'+(photosToSend.length===1?'':'s'));
  askConfirm(
    'Submit '+parts.join(', ')+' to Shop Boss? Each work week goes out as its own file. This only sends what you log here — it never lets Shop Boss be viewed or changed from this device.',
    'Submit',
    ()=>doSubmitBatch(toSend, docsToSend, photosToSend, {type:'home'}, null, u.clockWids)
  );
}
// ---- Work Report: one compact, printable page per week (any past week), with a Send button ----
function shiftWeekId(wid, deltaWeeks){
  const [y,m,d] = wid.split('-').map(Number);
  const dt = new Date(y, m-1, d + 7*deltaWeeks);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
// ---- Work Report generator: a read-only report over any period, optionally for chosen cars ----
let repState = {period:'week', wid:null, from:'', to:'', cars:[]};
function isoPlus(iso, n){ const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y, m-1, d+n); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'); }
function openReport(opts){
  opts = opts || {};
  repState = {period: opts.period || 'week', wid: opts.wid || weekId(), from:'', to:'', cars: []};
  nav({type:'workReport'});
}
function setRepPeriod(val){
  if(val==='all') repState.period = 'all';
  else if(val==='custom'){ const r = repRange(); repState.period = 'custom'; repState.from = r.from.startsWith('0000') ? '' : r.from; repState.to = r.to.startsWith('9999') ? '' : r.to; }
  else { repState.period = 'week'; repState.wid = val; }
  render();
}
function setRepDate(which, val){
  const r = repRange();
  repState.period = 'custom';
  repState.from = r.from.startsWith('0000') ? '' : r.from;
  repState.to = r.to.startsWith('9999') ? '' : r.to;
  repState[which] = val || '';
  render();
}
function setRepAllCars(){ repState.cars = []; render(); }
function toggleRepCar(name){
  const i = repState.cars.indexOf(name);
  if(i>=0) repState.cars.splice(i,1); else repState.cars.push(name);
  render();
}
function repRange(){
  if(repState.period==='all') return {from:'0000-01-01', to:'9999-12-31'};
  if(repState.period==='custom') return {from: repState.from || '0000-01-01', to: repState.to || '9999-12-31'};
  const wid = repState.wid || weekId();
  return {from: wid, to: isoPlus(wid, 6)};
}
function repData(){
  const {from, to} = repRange();
  const pick = repState.cars;
  const carOk = c=>!pick.length || pick.includes(c||'');
  const inRange = d=>d>=from && d<=to;
  const ents = entries.filter(l=>l.empId===currentEmp && inRange(l.date) && carOk(l.car)).sort((a,b)=>(a.date<b.date?-1:a.date>b.date?1:(a.startedAt||0)-(b.startedAt||0)));
  const docs = completedDocs.filter(x=>x.empId===currentEmp && inRange(x.date) && carOk(x.car));
  const phs = photos.filter(p=>p.empId===currentEmp && inRange(p.date) && carOk(p.car));
  // Clock-in and clock-out belong to the day, not to a car, so they are left out when cars are chosen.
  const showClocks = !pick.length;
  const clocks = showClocks ? dayClocks.filter(c=>c.empId===currentEmp && inRange(c.date)).sort((a,b)=>a.clockedInAt-b.clockedInAt) : [];
  const dates = [...new Set([...ents.map(l=>l.date), ...docs.map(x=>x.date), ...phs.map(p=>p.date), ...clocks.map(c=>c.date)])].sort();
  return {from, to, entries:ents, docs, photos:phs, clocks, showClocks, dates,
          taskHrs: ents.reduce((t,l)=>t+l.hours,0), clockHrs: clocks.reduce((t,c)=>t+clockHoursOf(c),0)};
}
function reportDayClockText(date){
  const clocks = dayClocks.filter(c=>c.empId===currentEmp && c.date===date).sort((a,b)=>a.clockedInAt-b.clockedInAt);
  if(!clocks.length) return '';
  const first = clocks[0], last = clocks[clocks.length-1];
  const out = last.clockedOutAt ? fmtTime(last.clockedOutAt) : 'still clocked in';
  const total = clocks.reduce((t,c)=>t+((c.clockedOutAt||Date.now())-c.clockedInAt),0)/3600000;
  return 'In '+fmtTime(first.clockedInAt)+' · Out '+out+' · '+fmtHrsMin(total);
}
function reportEntryLine(l){
  const t = (l.startedAt&&l.endedAt) ? fmtTime(l.startedAt)+'–'+fmtTime(l.endedAt)+' · ' : '';
  const parts = [t+escText(l.car||'No car'), escText(l.task||'')].filter(Boolean).join(' · ');
  let extra = '';
  if(l.desc) extra += '<div class="rep-note">Notes: '+escText(l.desc)+'</div>';
  const ans = l.pickListAnswers || {};
  const listName = id=> id==='consumables' ? 'Consumables and parts' : (shopPickLists.find(x=>x.id===id)||{}).name || (id==='billingparts' ? 'Parts used' : 'List');
  const hasCons = ans.consumables;
  if(l.consumables && !hasCons) extra += '<div class="rep-note">Consumables and parts: '+escText(l.consumables)+'</div>';
  Object.keys(ans).forEach(id=>{ if(ans[id]) extra += '<div class="rep-note">'+escText(listName(id))+': '+escText(ans[id])+'</div>'; });
  return '<div class="rep-line"><span>'+parts+'</span><span class="rep-hrs">'+fmtHrsMin(l.hours)+'</span></div>'+extra;
}
// "Submit this work week": sends EVERYTHING in that week — including entries sent before — so a past week
// can be sent again (after an edit, or because the shop lost it). No editing is needed first. Shop Boss ignores
// an identical copy and shows the differences when the week has changed.
function submitThisWeek(wid, returnView){
  const toSend = entries.filter(l=>l.empId===currentEmp && weekIdFor(l.date)===wid);
  const docsToSend = completedDocs.filter(d=>d.empId===currentEmp && weekIdFor(d.date)===wid);
  const photosToSend = photos.filter(p=>p.empId===currentEmp && weekIdFor(p.date)===wid);
  const clocksInWeek = dayClocks.filter(c=>c.empId===currentEmp && weekIdFor(c.date)===wid);
  if(!toSend.length && !docsToSend.length && !photosToSend.length && !clocksInWeek.length){ showToast('Nothing logged in this work week.', true); return; }
  const parts = [];
  if(toSend.length) parts.push(toSend.length+' entr'+(toSend.length===1?'y':'ies')+' ('+fmtHrsMin(toSend.reduce((s,l)=>s+l.hours,0))+')');
  if(clocksInWeek.length) parts.push(clocksInWeek.length+' clock-in/clock-out day'+(clocksInWeek.length===1?'':'s'));
  if(docsToSend.length) parts.push(docsToSend.length+' completed document'+(docsToSend.length===1?'':'s'));
  if(photosToSend.length) parts.push(photosToSend.length+' photo'+(photosToSend.length===1?'':'s'));
  askConfirm('Submit the work week of '+weekLabel(wid)+' ('+parts.join(' and ')+') to Shop Boss? Everything in this work week is sent, including anything sent before. If Shop Boss already has an identical copy, it ignores it.', 'Submit', ()=>doSubmitBatch(toSend, docsToSend, photosToSend, returnView||{type:'home'}, wid, [wid]));
}
// Gets a JSON payload off this device however the device supports: the OS share sheet first
// (email, AirDrop/Nearby Share, Messages, whatever's installed — works with or without the shop's
// own WiFi, since none of those need it), falling back to a plain saved file.
// Returns 'shared' | 'saved' | 'declined' | 'unavailable'.
// Real, standard browser file download — works in any real browser tab or installed PWA, unlike
// claude.use('downloads') which only exists inside the claude.ai preview sandbox. This is what
// actually saves the file once WorkClock is running for real, not just a theoretical fallback.
function wcDownloadBlob(filename, blob){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      try{ document.body.removeChild(a); }catch(e){}
      try{ URL.revokeObjectURL(url); }catch(e){}
    }, 1000);
    return true;
  }catch(e){ return false; }
}
async function shareOrSaveFile(fname, jsonText, shareTitle, shareText){
  try{
    if(typeof navigator!=='undefined' && navigator.share && navigator.canShare){
      const file = new File([jsonText], fname, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title: shareTitle||fname, text: shareText||''});
        return 'shared';
      }
    }
  }catch(err){
    if(err && err.name==='AbortError') return 'declined';
  }
  try{
    if(typeof claude!=='undefined' && claude.use){
      const downloads = await claude.use('downloads');
      if(downloads){
        await downloads.save({filename: fname, data: jsonText});
        return 'saved';
      }
    }
    const blob = new Blob([jsonText], {type:'application/json'});
    if(wcDownloadBlob(fname, blob)) return 'saved';
    throw {code:'unavailable'};
  }catch(err){
    if(err && err.code==='declined') return 'declined';
    return 'unavailable';
  }
}
// A compact, sortable, unique-enough stamp so the same person submitting more than once in the
// same week doesn't produce several files with the exact same name (which can silently overwrite
// each other when saved or shared) — Darren needs to be able to tell them apart at a glance.
function fileStamp(d){
  d = d || new Date();
  const p = n=>String(n).padStart(2,'0');
  return d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'-'+p(d.getHours())+p(d.getMinutes());
}
// Opens the device's email app, addressed and subject-filled, so sending a copy to Darren by
// email is one tap of "attach" away instead of typing his address every time. No phone lets any
// app auto-attach a file to an email for security reasons, so attaching stays a manual step —
// nothing we can do about that part.
function maybeOpenEmailToDarren(fname, subjectLabel){
  if(!darrenEmail) return;
  try{
    const subject = encodeURIComponent(subjectLabel);
    const body = encodeURIComponent('Attach the file "'+fname+'" that was just saved to this phone (Share > Save, or your Downloads), then send.');
    window.location.href = 'mailto:'+darrenEmail+'?subject='+subject+'&body='+body;
  }catch(e){}
}
// Shared core for both "Submit work week" and "Submit this day" — builds one payload out of
// whatever set of entries/docs/photos it's handed, sends it every way this device supports, and
// only marks things submitted once at least one of those ways actually worked.
// Each work week goes out as its own file (with its own dates), so Shop Boss can treat every work week
// as its own listing — even when one person sends this week and an older week together.
async function doSubmitBatch(toSend, docsToSend, photosToSend, returnView, onlyWid, extraWids){
  extraWids = extraWids || [];
  if(!toSend.length && !docsToSend.length && !photosToSend.length && !extraWids.length){ navReplace(returnView); return; }
  const wids = new Set(extraWids);
  toSend.forEach(l=>wids.add(weekIdFor(l.date)));
  docsToSend.forEach(d=>wids.add(weekIdFor(d.date||todayISO())));
  photosToSend.forEach(p=>wids.add(weekIdFor(p.date||todayISO())));
  if(onlyWid || wids.size<=1){ return doSubmitOne(toSend, docsToSend, photosToSend, returnView, onlyWid || [...wids][0]); }
  for(const w of [...wids].sort()){
    await doSubmitOne(toSend.filter(l=>weekIdFor(l.date)===w), docsToSend.filter(d=>weekIdFor(d.date||todayISO())===w), photosToSend.filter(p=>weekIdFor(p.date||todayISO())===w), returnView, w);
  }
}
async function doSubmitOne(toSend, docsToSend, photosToSend, returnView, widArg, soloItem){
  const wid = widArg || weekId();
  // The clock-in and clock-out times for this work week ride in the same file (they are what the
  // employee is paid from) - kept separate from the task entries, which are what gets billed.
  const clocksToSend = soloItem ? [] : dayClocks.filter(c=>c.empId===currentEmp && weekIdFor(c.date)===wid);
  if(!toSend.length && !docsToSend.length && !photosToSend.length && !clocksToSend.length){ navReplace(returnView); return; }
  const emp = employees.find(e=>e.id===currentEmp);
  const payload = {
    app:'WorkClock', kind:'work-week-submission', version:1, submittedAt:new Date().toISOString(),
    deviceId: (function(){ if(!deviceId){ deviceId = 'dev'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); try{ persist(); }catch(e){} } return deviceId; })(),
    employee: emp ? emp.name : '',
    employeeThumb: emp ? (emp.thumb||null) : null,
    employeeId: emp ? (emp.shopBossId||null) : null, // Shop Boss's real ID, when this employee has linked up — lets Shop Boss match this back reliably instead of guessing from the name
    weekOf: wid,
    weekEnd: shiftWeekId(wid,1),
    // carId rides alongside the typed car name wherever it was resolved at the time — Shop Boss
    // matches on that real id first (same idea as employeeId above), falling back to the name
    // only when there's no id, which is the same risk the employee-name fix already closed.
    entries: toSend.map(l=>({id:l.id, car:l.car, carId:l.carId||null, who:emp?emp.name:'', date:l.date, hours:l.hours, startedAt:l.startedAt||null, endedAt:l.endedAt||null, task:l.task||null, notes:l.desc||'', desc:null, consumables:l.consumables||null, lowSupply:l.lowSupply||null, flagNote:l.flagNote||null, pickListAnswers:l.pickListAnswers||null, todoId:l.todoId||null})),
    completedDocuments: docsToSend.map(d=>({id:d.id, employee:((employees.find(e=>e.id===d.empId)||emp||{}).name)||'', employeeId:((employees.find(e=>e.id===d.empId)||emp||{}).shopBossId)||null, name:d.templateName, car:d.car||null, carId:d.carId||null, date:d.date, fileName:d.fileName||null, dataUrl:d.dataUrl||null, flagNote:d.flagNote||null, answers:d.answers||null})),
    photos: photosToSend.map(p=>({id:p.id, car:p.car||null, carId:p.carId||null, date:p.date, fileName:p.fileName||null, dataUrl:p.dataUrl||null, flagNote:p.flagNote||null, label:(function(){ const rq = p.requestId ? photoRequests.find(r=>r.id===p.requestId) : null; if(rq && rq.note) return rq.note; const en = p.entryId ? entries.find(x=>x.id===p.entryId) : null; return en && en.task ? 'Task: '+en.task : null; })()})),
    // Employee hours: one record per clock-in. clockedOutAt is null while still clocked in.
    clocks: clocksToSend.slice().sort((a,b)=>a.clockedInAt-b.clockedInAt).map(c=>({id:c.id, date:c.date, clockedInAt:c.clockedInAt, clockedOutAt:c.clockedOutAt==null?null:c.clockedOutAt, clockIn:new Date(c.clockedInAt).toISOString(), clockOut:c.clockedOutAt==null?null:new Date(c.clockedOutAt).toISOString()}))
  };
  const fname = 'workclock-'+(emp?emp.name.toLowerCase().replace(/\s+/g,'-'):'submission')+'-'+wid+'-'+fileStamp()+'.json';
  const json = JSON.stringify(payload,null,2);
  navReplace(returnView);
  const result = await shareOrSaveFile(fname, json, 'WorkClock submission', (emp?emp.name+'\'s':'Weekly') + ' hours for Shop Boss');
  // Independent of however that just went (shared, saved, or not available at all) — if a
  // "Submitted weeks" folder has been chosen on this device, always also drop a copy straight
  // into it. That's the local paper trail: it exists even if the wireless/share side of this
  // failed silently, and it's how the hours stay recoverable no matter what else goes wrong.
  const wroteCopy = submittedDirHandle ? await wcWriteFileToHandle(submittedDirHandle, fname, json) : false;
  // Cancelling the share sheet with no backup folder configured used to just silently do
  // nothing here — the person already saw the confirm dialog and the share sheet, landed back
  // on Home, and had every reason to think it went through. Nothing was actually sent or marked
  // submitted, so they need to be told plainly, not left to find out later that hours are missing.
  if(result==='declined'){ showToast('Not sent — you closed the send menu without sending. Nothing was submitted; try again when ready.', true); return; }
  if(result==='unavailable' && !wroteCopy){
    showToast('Couldn\'t save that file on this device. Try again — if it keeps happening, check that your browser allows downloads.', true);
    return;
  }
  toSend.forEach(l=>{ l.submitted=true; l.weekId=weekIdFor(l.date); });
  docsToSend.forEach(d=>{ d.submitted=true; });
  photosToSend.forEach(p=>{ p.submitted=true; });
  clocksToSend.forEach(c=>{ c.submitted=true; });
  if(result!=='mailbox') maybeOpenEmailToDarren(fname, (emp?emp.name+"'s":'Weekly')+' hours for Shop Boss');
  const msg = result==='mailbox' ? ((window.__mbLast && window.__mbLast.state==='waiting') ? 'Saved to send later. It goes out by itself when the shop mailbox is found.' : 'Sent to the shop mailbox. Waiting for Shop Boss to pick it up.') : result==='shared' ? 'Sent.' : (result==='saved' ? 'Submitted.' : 'Submitted — nothing was shared or saved generally, but a copy landed in your Submitted Weeks folder.');
  showToast(wroteCopy && result!=='unavailable' ? msg + ' A copy is also in '+submittedFolderName+'.' : msg);
  render();
}

// ---- receiving a weekly update from Shop Boss (a file today; wireless once the shop has its own network) ----
// A Shop Boss update is a JSON file shaped like:
// { app:'ShopBoss', kind:'workclock-update', version:1, sentAt:'...',
//   documents:[ {name, employeeId, employeeName, carId, carName, fileName, mime, dataUrl, note}, ... ],
//   photoRequests:[ {note, employeeId, employeeName, carId, carName}, ... ] }
// employeeId/employeeName and carId/carName are each independently optional — a doc or photo request
// can be for a specific employee, a specific car, both at once, or neither (general, for everyone).
// Anything WorkClock doesn't recognize in that file is just ignored, so future updates can add more without breaking this version.
function triggerImportUpdatePicker(){
  const inp = document.getElementById('importUpdateFile');
  if(inp) inp.click();
}
function handleImportUpdateFile(evt){
  const file = evt.target && evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let payload;
    try{ payload = JSON.parse(reader.result); }
    catch(e){ showToast('That file doesn\'t look like a Shop Boss update.', true); return; }
    applyShopUpdate(payload);
  };
  reader.onerror = ()=>{ showToast('Couldn\'t read that file.', true); };
  reader.readAsText(file);
  evt.target.value = '';
}
// Matches an update entry's employee reference to a LOCAL WorkClock employee record — by Shop
// Boss's real ID first (reliable, once employees have linked up via addEmployee's auto-match),
// falling back to comparing the name text (the old, fragile way) only when no ID was sent at all.
function matchLocalEmployee(employeeId, employeeName){
  if(employeeId){
    const byId = employees.find(e=>e.shopBossId===employeeId);
    if(byId) return byId;
  }
  if(employeeName){
    const byName = employees.find(e=>e.name.toLowerCase()===String(employeeName).toLowerCase());
    if(byName) return byName;
  }
  return null;
}
// A form or photo request addressed to a named employee who is not on this device yet stays hidden
// from everyone else. When that person is added or linked later, it appears for them.
function isGeneralItem(x){ return !x.empId && !x.forShopId && !x.forName; }
function resolveRestrictedItems(){
  const fix = x=>{
    if(x.empId || (!x.forShopId && !x.forName)) return;
    const emp = matchLocalEmployee(x.forShopId, x.forName);
    if(emp){ x.empId = emp.id; x.forShopId = null; x.forName = null; }
  };
  documents.forEach(fix); photoRequests.forEach(fix);
}
function applyShopUpdate(payload){
  if(!payload || typeof payload!=='object'){ showToast('That file doesn\'t look like a Shop Boss update.', true); return; }
  let added = 0;
  // Shop Boss owns which day starts the work week — once its export includes this, WorkClock must
  // switch over to match, or the two apps will slice weeks up differently and nothing will reconcile.
  if(payload.weekStart && WEEK_DAY_CODES.includes(payload.weekStart)){
    weekStartDay = payload.weekStart;
  }
  if(payload.weekEnd && WEEK_DAY_CODES.includes(payload.weekEnd)) weekEndDay = payload.weekEnd;
  // Photos the shop sent: a snapshot like cars/employees - each update replaces the last set.
  if(Array.isArray(payload.shopPhotos)){
    shopPhotos.length = 0;
    payload.shopPhotos.forEach(ph=>{
      if(!ph || !ph.dataUrl) return;
      const emp = (ph.employeeId||ph.employeeName) ? matchLocalEmployee(ph.employeeId, ph.employeeName) : null;
      if((ph.employeeId||ph.employeeName) && !emp) return; // aimed at someone who isn't on this device
      shopPhotos.push({id: uid(), empId: emp?emp.id:null, car: ph.carName||ph.car||'', caption: ph.caption||'', dataUrl: ph.dataUrl});
      added++;
    });
  }
  // The car list and employee roster are a snapshot of "right now," not something to accumulate —
  // each new update fully replaces the last one.
  if(Array.isArray(payload.cars)){
    shopCars.length = 0;
    payload.cars.forEach(c=>{ if(c && c.name) shopCars.push({id:c.id||null, name:String(c.name), thumbDataUrl:c.thumbDataUrl||null, info:c.info||null}); });
  }
  if(Array.isArray(payload.employees)){
    shopBossEmployees.length = 0;
    payload.employees.forEach(e=>{ if(e && e.name) shopBossEmployees.push({id:e.id, name:String(e.name)}); });
    // anyone already on this device gets linked up retroactively too, not just new adds
    employees.forEach(emp=>{
      if(!emp.shopBossId){
        const match = shopBossEmployees.find(se=>se.name.toLowerCase()===emp.name.toLowerCase());
        if(match) emp.shopBossId = match.id;
      }
    });
  }
  // Tasks (always sent) drive the Task box's + button; the Notes Helper (always sent, may be empty)
  // drives the Notes box's + button.
  shopTaskMode = (payload.taskMode==='single'||payload.taskMode==='listonly') ? payload.taskMode : 'multi';
  if(Array.isArray(payload.workTypes)){
    shopWorkTypes.length = 0;
    payload.workTypes.forEach(t=>{ if(t) shopWorkTypes.push(String(t)); });
  }
  if(Array.isArray(payload.library)) shopLibrary = payload.library.map(String);
  if(typeof payload.showNotes==='boolean') shopShowNotes = payload.showNotes;
  shopTodos = Array.isArray(payload.todos) ? payload.todos.map(t=>({carName:String(t.carName||''), jobs:(t.jobs||[]).map(j=>({id:String(j.id), text:String(j.text||'')}))})) : [];
  todoDone = [];
  if(Array.isArray(payload.notesHelper)){
    shopNotesHelper.length = 0;
    payload.notesHelper.forEach(t=>{ if(t) shopNotesHelper.push(String(t)); });
  }
  // Darren's own custom lists, each with its own "Included"/"Mandatory" toggle set in Assembly Room
  // → Outgoing — only the ones currently marked Included ride along here. Snapshot, same rule as
  // cars/employees/consumables: this fully replaces whatever was here before, it doesn't accumulate.
  if(Array.isArray(payload.pickLists)){
    shopPickLists.length = 0;
    payload.pickLists.forEach(l=>{
      if(!l || !l.name) return;
      shopPickLists.push({id: l.id||uid(), name: String(l.name), items: Array.isArray(l.items)?l.items.map(String):[], mode: (l.mode==='single'||l.mode==='listonly')?l.mode:'multi'});
    });
  }
  // Anything already SUBMITTED (photos, completed documents) is cleared on every update, since
  // Darren already has his copy from that submission — but anything still pending (not yet
  // submitted) is never touched, on purpose.
  for(let i=completedDocs.length-1;i>=0;i--){ if(completedDocs[i].submitted) completedDocs.splice(i,1); }
  for(let i=photos.length-1;i>=0;i--){ if(photos[i].submitted) photos.splice(i,1); }
  // A new update means fresh blank forms — but only when Darren's update actually includes a
  // documents list. If this update is about something else (cars, consumables), the blank forms
  // an employee already has on their tablet are left alone instead of being wiped out blind.
  if(Array.isArray(payload.documents)){
    documents.length = 0;
    payload.documents.forEach(d=>{
      if(!d || !d.name) return;
      // A doc can be aimed at a specific employee, a specific car, both, or neither (general) — these
      // are independent, not one exclusive "scope" anymore, so Shop Boss can say "this form is for
      // Dana, on whatever car" or "this form is for Kowalski, whoever's working it" or both at once.
      const emp = d.employeeId || d.employeeName ? matchLocalEmployee(d.employeeId, d.employeeName) : null;
      documents.push({
        id: uid(),
        name: String(d.name),
        empId: emp ? emp.id : null,
        empName: d.employeeName || null,
        forShopId: (d.employeeId && !emp) ? d.employeeId : null,
        forName: (d.employeeName && !emp) ? d.employeeName : null,
        car: d.carName || null,
        fileName: d.fileName || null,
        mime: d.mime || null,
        dataUrl: d.dataUrl || null,
        note: d.note || null,
        // When Darryl sent this as a saved Form Builder form (not just a plain reminder), the real
        // field definitions ride along so this renders actual fillable inputs instead of just an
        // "attach a scanned file" placeholder.
        fields: Array.isArray(d.fields) ? d.fields : null,
        receivedAt: Date.now()
      });
      added++;
    });
  }
  // Photo requests and notes are a snapshot too: the update's list replaces the old one, so nothing
  // piles up and an old request does not linger. A request already fulfilled here stays finished,
  // and the same request arriving again is not added a second time.
  if(Array.isArray(payload.photoRequests)){
    const finished = photoRequests.filter(r=>r.fulfilled);
    photoRequests.length = 0;
    finished.forEach(r=>photoRequests.push(r));
    payload.photoRequests.forEach(r=>{
      if(!r) return;
      const emp = r.employeeId || r.employeeName ? matchLocalEmployee(r.employeeId, r.employeeName) : null;
      const note = r.note || null, car = r.carName || r.car || null;
      const already = finished.some(f=>(f.note||null)===note && (f.car||null)===car && (f.empId||null)===(emp?emp.id:null) && (f.forShopId||null)===((r.employeeId && !emp)?r.employeeId:null));
      if(already) return;
      photoRequests.push({
        id: uid(),
        note,
        empId: emp ? emp.id : null,
        empName: r.employeeName || null,
        forShopId: (r.employeeId && !emp) ? r.employeeId : null,
        forName: (r.employeeName && !emp) ? r.employeeName : null,
        car,
        receivedAt: Date.now(),
        fulfilled: false
      });
      added++;
    });
  }
  if(Array.isArray(payload.notes)){
    const oldNotes = employeeNotes.slice();
    employeeNotes.length = 0;
    payload.notes.forEach(n=>{
      if(!n || !n.text) return;
      const emp = matchLocalEmployee(n.employeeId, n.employeeName);
      if(!emp) return; // a note with no matching employee on this device has nowhere to go
      const prev = oldNotes.find(o=>o.empId===emp.id && o.text===n.text);
      employeeNotes.push({ id: prev ? prev.id : uid(), text: n.text, empId: emp.id, receivedAt: prev ? prev.receivedAt : Date.now(), dismissed: prev ? !!prev.dismissed : false });
      if(!prev) added++;
    });
  }
  resolveRestrictedItems();
  // Someone's lost/wiped phone, getting their history handed back — applied as already-submitted,
  // so none of it goes out to Shop Boss again the next time they hit Submit. Skipped quietly if
  // this device doesn't actually have that employee (nowhere local to attach it to), and skipped
  // per-entry if it looks like a duplicate of something already here.
  if(Array.isArray(payload.historyRestore)){
    payload.historyRestore.forEach(hr=>{
      if(!hr) return;
      const emp = matchLocalEmployee(hr.employeeId, hr.employeeName);
      if(!emp || !Array.isArray(hr.entries)) return;
      hr.entries.forEach(re=>{
        if(!re || !re.date || !re.car) return;
        const dup = entries.some(l=>l.empId===emp.id && l.date===re.date && l.car===re.car && String(l.hours)===String(re.hours));
        if(dup) return;
        const base = dateBaseMs(re.date);
        const hrs = parseFloat(re.hours)||0;
        entries.push({
          id: uid(), empId: emp.id, empName: emp.name,
          car: re.car, task:'', desc: re.desc||'', consumables:'', lowSupply:null, flagNote:null,
          date: re.date, hours: hrs, startedAt: base, endedAt: base+hrs*3600000,
          weekId: weekIdFor(re.date), submitted:true
        });
        added++;
      });
    });
  }
  // Remembered employee stays signed in across updates — unless the new roster no longer has them.
  if(currentEmp && shopBossEmployees.length){
    const me = employees.find(e=>e.id===currentEmp);
    const stillThere = me && (!me.shopBossId || shopBossEmployees.some(se=>se.id===me.shopBossId || se.name.toLowerCase()===me.name.toLowerCase()));
    if(!stillThere) currentEmp = null;
  }
  lastUpdateAt = new Date().toISOString();
  persist();
  // Before anyone's picked a name yet (a brand-new device), land back on "who's clocking in" — the
  // update just populated it with Darren's real employee list to pick from. Once someone's already
  // logged in, this is a routine mid-week refresh, so Documents (where the new items show) makes more sense.
  stack = currentEmp ? [{type:'home'},{type:'documents'}] : [{type:'who'}];
  if(currentEmp && currentEmpNeedsLink()) stack.push({type:'linkEmployee'});
  showToast(added ? ('Update received — '+added+' item'+(added===1?'':'s')+' added.') : 'Update received.');
  render();
}
async function saveDataUrlFile(dataUrl, filename){
  const comma = dataUrl.indexOf(',');
  const b64 = comma>=0 ? dataUrl.slice(comma+1) : dataUrl;
  const mimeMatch = /^data:([^;]+);base64/.exec(dataUrl);
  const mime = mimeMatch ? mimeMatch[1] : 'application/octet-stream';
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  try{
    if(typeof claude!=='undefined' && claude.use){
      const downloads = await claude.use('downloads');
      if(downloads){
        await downloads.save({filename, data: bytes.buffer});
        showToast('Saved.');
        return;
      }
    }
    const blob = new Blob([bytes], {type: mime});
    if(wcDownloadBlob(filename, blob)){ showToast('Saved.'); return; }
    throw {code:'unavailable'};
  }catch(err){
    if(err && err.code==='declined') return;
    showToast('Couldn\'t save that file on this device. Try again — if it keeps happening, check that your browser allows downloads.', true);
  }
}
// A form tied to a specific car gets that car baked into the saved filename itself — not just shown
// on screen — so it's still unmistakable once it's sitting in Downloads, attached to an email, or
// sent to a printer, all places where the on-screen "— Civic" label no longer travels with it.
async function saveDocument(id){
  const doc = documents.find(x=>x.id===id);
  if(!doc || !doc.dataUrl) return;
  const fname = doc.car ? (doc.name+' - '+doc.car+'.pdf') : (doc.fileName || (doc.name+'.pdf'));
  await saveDataUrlFile(doc.dataUrl, fname);
}
async function saveCompletedDoc(id){
  const doc = completedDocs.find(x=>x.id===id);
  if(!doc || !doc.dataUrl) return;
  const fname = doc.car ? (doc.templateName+' - '+doc.car+'.pdf') : (doc.fileName || (doc.templateName+'.pdf'));
  await saveDataUrlFile(doc.dataUrl, fname);
}
let docsOpenPill = null;

function docsTogglePill(key){ docsOpenPill = (docsOpenPill===key) ? null : key; render(); }
function toggleDocTip(key){ const el=document.getElementById('doctip-'+key); if(el) el.style.display = el.style.display==='none' ? '' : 'none'; }
// A form addressed to one person, or tied to one car, is a one-time job: once filled out it leaves
// the list (Undo in Completed / Sent puts it back). A general form with no car stays available.
function docTimesFilled(d){ return completedDocs.filter(c=>c.templateId===d.id && c.empId===currentEmp).length; }

function docIsOpen(d){ return !(docIsOneTime(d) && docTimesFilled(d)>0); }
function docIsReal(d){ return (Array.isArray(d.fields)&&d.fields.length>0) || !!d.dataUrl; }
function docRow(d){
  const real = docIsReal(d);
  return `
  <div class="card" style="margin-bottom:10px">
    <div class="entry-car">${d.name}${d.car?` <span style="color:var(--accent)">— ${d.car}</span>`:''}</div>
    ${d.note?`<div class="entry-desc">${d.note}</div>`:''}
    <div class="entry-date">Added ${new Date(d.receivedAt).toLocaleDateString()}${d.empName?' · for '+d.empName:''}${Array.isArray(d.fields)&&d.fields.length?' · '+d.fields.length+' field'+(d.fields.length===1?'':'s')+' to fill':''}</div>
    ${(!docIsOneTime(d) && docTimesFilled(d)>0)?`<div class="entry-date">Filled out ${docTimesFilled(d)}× so far — you can fill it out again.</div>`:''}
    ${real ? '' : '<div class="entry-date">Reminder only — nothing to fill in.</div>'}
    <div style="display:flex;gap:8px;margin-top:10px">
      ${d.dataUrl?`<button class="btn-ghost" style="margin:0;flex:1" onclick="saveDocument('${d.id}')">⬇ Blank form</button>`:''}
      ${real
        ? `<button class="btn-primary" style="margin:0;flex:1" onclick="nav({type:'fillDocument', id:'${d.id}'})">Open and fill out</button>`
        : `<button class="btn-primary" style="margin:0;flex:1" onclick="markReminderDone('${d.id}')">Mark done</button>`}
    </div>
  </div>`;
}
function markReminderDone(id){ markDocFilled(id, '', null, null, ''); }
function completedDocRow(d){
  return `
  <div class="card" style="margin-bottom:10px">
    <div class="entry-car">${d.templateName}${d.car?' · '+d.car:''}</div>
    <div class="entry-date">${fmtDate(d.date)}${d.submitted?' · <span class="badge submitted">Sent</span>':' · <span class="badge">Not sent yet</span>'}${d.answers?(()=>{const n=Object.values(d.answers).filter(x=>x.type!=='heading').length; return ' · '+n+' field'+(n===1?'':'s')+' filled';})():''}</div>
    ${d.submitted?'<div class="entry-date">Sent — stays on this phone until the next update.</div>':''}
    ${d.dataUrl?`<button class="btn-ghost" style="margin-top:10px" onclick="saveCompletedDoc('${d.id}')">⬇ Open / save</button>`:''}
    <button class="btn-ghost" style="margin-top:10px" onclick="sendOneDoc('${d.id}')">Send just this form</button>
    <p class="switch-link" style="color:#e05c5c;margin-top:6px" onclick="requestDeleteCompletedDoc('${d.id}')">Undo — remove "filled out"</p>
  </div>`;
}
// Sends one filled-out form or one photo on its own (the "forgot to send it Friday" case). Shop Boss files it under the right car and week,
// even when that week is already finished there.
function sendOneDoc(id){
  const d = completedDocs.find(x=>x.id===id); if(!d) return;
  askConfirm('Send just this form ("'+d.templateName+'"'+(d.car?' · '+d.car:'')+') to Shop Boss?', 'Send it', ()=>{ doSubmitOne([], [d], [], {type:'documents'}, weekIdFor(d.date||todayISO()), true); });
}
function sendOnePhoto(id){
  const ph = photos.find(x=>x.id===id); if(!ph) return;
  askConfirm('Send just this photo'+(ph.car?' ('+ph.car+')':'')+' to Shop Boss?', 'Send it', ()=>{ doSubmitOne([], [], [ph], {type:'documents'}, weekIdFor(ph.date||todayISO()), true); });
}
function requestDeleteCompletedDoc(id){
  const cd = completedDocs.find(d=>d.id===id);
  const msg = (cd && cd.submitted)
    ? 'This puts the form back in your list so you can fill it out again. The shop already has the copy you sent. The new copy goes out with your next submit.'
    : 'Remove this "filled out" record? If you marked this by mistake, this undoes it and the blank form goes back in your list.';
  askConfirm(msg, 'Remove', ()=>doDeleteCompletedDoc(id));
}
function doDeleteCompletedDoc(id){
  const idx = completedDocs.findIndex(d=>d.id===id);
  if(idx>=0) completedDocs.splice(idx,1);
  stack.pop(); // the confirm screen
  render();
}
// ---- marking a blank template as filled out: records who/when/which car, and optionally attaches the filled file ----
function markDocFilled(templateId, car, fileDataUrl, fileName, flagNote){
  const tmpl = documents.find(d=>d.id===templateId);
  if(!tmpl) return;
  const date = todayISO();
  completedDocs.push({
    id: uid(), templateId, templateName: tmpl.name,
    car: (car||'').trim() || null, carId: matchShopCarId(car),
    empId: currentEmp, date, weekId: weekIdFor(date),
    fileName: fileName || null, dataUrl: fileDataUrl || null,
    flagNote: (flagNote||'').trim()||null,
    submitted: false, completedAt: Date.now()
  });
  stack = [{type:'home'},{type:'documents'}];
  showToast('Marked as filled out.');
  render();
}
function saveFilledDocument(templateId, car, fileInputEl, flagNote){
  const file = fileInputEl && fileInputEl.files && fileInputEl.files[0];
  if(file){
    const reader = new FileReader();
    reader.onload = ()=>{ markDocFilled(templateId, car, reader.result, file.name, flagNote); };
    reader.onerror = ()=>{ showToast('Couldn\'t read that file — saving without it.', true); markDocFilled(templateId, car, null, null, flagNote); };
    reader.readAsDataURL(file);
  } else {
    markDocFilled(templateId, car, null, null, flagNote);
  }
}
// ---- filling out a real, field-typed form (from Shop Boss's Form Builder) ----
// Separate from the legacy "attach a scanned file" flow above — this one renders an actual input
// per field and stamps the completed record with today's date, this employee, and the car, the
// same way markDocFilled does, but keeps each field's own answer instead of just a file.
let fbFillPhotos = {}; // {fieldId: dataUrl} — scratch storage while a structured form is open on screen; cleared on submit
// ---- Forms: shared look and behaviour (same code in Shop Boss and WorkClock). A NAMED heading starts a SECTION: the fields after it
// belong to it until its end marker (or the next named heading). Fields after an end marker stand on their own. A heading with
// no name is just a line. Sections show as bold bars; tapping one opens it and closes the one that was open. A badge on each bar
// counts the checkboxes not yet checked. Nothing here ever blocks submitting a form. ----
function fmEsc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
const FM_HDR_AUTO = [['yearmake','Year / make'],['vin','VIN'],['ownername','Owner'],['ownerphone','Phone']];
const FM_HDR_TYPED = [['email','Email'],['address','Address']];
function fmNamedHeading(f){ return !!(f && f.type==='heading' && String(f.label||'').trim()); }
function fmBlankPx(f){ return f && f.size==='l' ? 56 : (f && f.size==='m' ? 28 : 12); }
// The header's lines in their fixed order: [{key,label,auto}]. "auto" lines are filled in by Shop Boss from the car and owner records.
function wcHdrAutoVal(carName, key){
  const nm = String(carName||'').trim().toLowerCase(); if(!nm) return '';
  const c = shopCars.find(x=>x.name && x.name.toLowerCase()===nm);
  return (c && c.info && c.info[key]) || '';
}
function wcHdrFill(){
  const inp = document.getElementById('carInput'); if(!inp) return;
  document.querySelectorAll('.fm-hdr-in[data-auto]').forEach(el=>{
    const v = wcHdrAutoVal(inp.value, el.dataset.key);
    if(!el.value || el.value===el.dataset.auto) el.value = v;
    el.dataset.auto = v;
  });
}
function fmHdrLines(f){
  const items = Array.isArray(f.items) ? f.items : ['car','date'], out = [];
  FM_HDR_AUTO.forEach(a=>{ if(items.indexOf(a[0])>=0) out.push({key:a[0], label:a[1], auto:true}); });
  FM_HDR_TYPED.forEach(a=>{ if(items.indexOf(a[0])>=0) out.push({key:a[0], label:a[1], auto:false}); });
  (f.custom||[]).forEach(c=>{ if(String(c.label||'').trim()) out.push({key:'c:'+c.id, label:String(c.label).trim(), auto:false}); });
  return out;
}
function fmHdrHTML(o){
  return '<div class="fm-hdr"><div class="fm-hdr-top">'+(o.title!=null?'<div class="fm-hdr-title">'+fmEsc(o.title)+'</div>':'<div></div>')+(o.dateHTML?'<div class="fm-hdr-date">'+o.dateHTML+'</div>':'')+'</div>'
    +(o.carHTML!=null?'<div class="fm-hdr-car-in">'+o.carHTML+'</div>':'')
    +(o.car!=null?'<div class="fm-hdr-car">'+fmEsc(o.car||'—')+'</div>':'')
    +((o.lines||[]).length?'<div class="fm-hdr-grid">'+o.lines.map(l=>'<div class="fm-hdr-line"><span class="fm-hdr-k">'+fmEsc(l.label)+'</span><span class="fm-hdr-v">'+(l.html!=null?l.html:fmEsc(l.value||'—'))+'</span></div>').join('')+'</div>':'')+'</div>';
}
// Splits a form into blocks in order: {kind:'rows', rows} (stand-alone fields) and {kind:'sec', head, rows}.
function fmBlocks(fields, rowsFn){
  const blocks = []; let cur = null, loose = null;
  rowsFn(fields).forEach(r=>{
    const f = r[0];
    if(fmNamedHeading(f)){ cur = {kind:'sec', head:f, rows:[]}; blocks.push(cur); loose = null; const rest = r.slice(1).filter(x=>x.type!=='endsec'); if(rest.length) cur.rows.push(rest); return; }
    if(f.type==='endsec'){ cur = null; loose = null; return; }
    if(cur){ cur.rows.push(r); return; }
    if(!loose){ loose = {kind:'rows', rows:[]}; blocks.push(loose); }
    loose.rows.push(r);
  });
  return blocks;
}
function fmIsCheck(f){ return f && (f.type==='checkbox' || f.type==='checkexp'); }
function fmBadgeHTML(un, total){
  if(!total) return '<span class="fm-badge" hidden></span>';
  return un ? '<span class="fm-badge">'+un+' unchecked</span>' : '<span class="fm-badge ok">✓ all checked</span>';
}
function fmRowHTML(r, cellFn){
  const f0 = r[0];
  if(f0 && f0.type==='heading' && !fmNamedHeading(f0) && r.length===1) return '<div class="fm-line"></div>';
  if(r.every(f=>f.type==='blank')){ const px = Math.max.apply(null, r.map(fmBlankPx)); return '<div class="fm-row fm-row-blank"><div class="fm-cell fm-blank" style="height:'+px+'px"></div></div>'; }
  if(r.length===1 && r[0].type==='formheader') return '<div class="fm-row fm-row-blank"><div class="fm-cell" style="padding:8px 0 0">'+cellFn(r[0])+'</div></div>';
  return '<div class="fm-row">'+r.map(f=>'<div class="fm-cell'+(f.type==='blank'?' fm-blank':'')+'">'+cellFn(f)+'</div>').join('')+'</div>';
}
function fmFormHTML(fields, rowsFn, cellFn){
  let firstSec = true;
  return '<div class="fm-form">'+fmBlocks(fields, rowsFn).map(b=>{
    if(b.kind==='rows') return b.rows.map(r=>fmRowHTML(r, cellFn)).join('');
    const total = b.rows.reduce((n,r)=>n+r.filter(fmIsCheck).length, 0);
    const open = firstSec; firstSec = false;
    return '<div class="fm-sec'+(open?' open':'')+'"><button type="button" class="fm-sec-head" onclick="fmToggleSection(this)"><span class="fm-title">'+fmEsc(b.head.label)+'</span>'+fmBadgeHTML(total,total)+'<span class="fm-chev">▸</span></button><div class="fm-body">'+b.rows.map(r=>fmRowHTML(r, cellFn)).join('')+'</div></div>';
  }).join('')+'</div>';
}
function fmCheckHTML(o){
  return '<div class="fm-check"><div class="fm-left"><label class="fm-ct"><input type="checkbox" class="fm-cb"'+(o.id?' id="'+o.id+'"':'')+' onchange="fmCheckChanged(this)"><span>'+fmEsc(o.label||'(untitled checkbox)')+'</span></label>'
    +(o.help?'<button type="button" class="fm-info" onclick="fmToggleHelp(this)" aria-label="More info">ⓘ</button>':'')+'</div>'
    +(o.note?'<textarea class="fm-note"'+(o.noteId?' id="'+o.noteId+'"':'')+' rows="1" hidden placeholder="Explanation (optional)" oninput="fmGrow(this)"></textarea>':'')
    +(o.help?'<div class="fm-help" hidden>'+fmEsc(o.help)+'</div>':'')+'</div>';
}
function fmNoteTextHTML(f){ return '<div class="fm-notetext'+(f.hl?' hl':'')+'">'+fmEsc(f.label||'')+'</div>'; }
function fmComboHTML(id, options, extra){
  return '<div class="fm-combo"><input type="text" id="'+id+'" data-accombo="1" data-acmode="single" autocomplete="off" placeholder="Type, or tap ▾ to pick" data-acopts="'+fmEsc(JSON.stringify(options||[]))+'"'+(extra||'')+'><button type="button" class="sbx-arrow" onpointerdown="event.preventDefault()" onclick="acToggleAll(\''+id+'\')" aria-label="Show the list">▾</button></div>';
}
function fmHdrCarFit(el){
  if(!el || !el.parentNode) return;
  const box = el.closest('.fm-hdr-car-in'); if(!box) return;
  const cs = getComputedStyle(el); const cv = fmHdrCarFit.cv || (fmHdrCarFit.cv = document.createElement('canvas')); const cx = cv.getContext('2d');
  const txt = el.value || el.placeholder || 'Car name';
  const avail = Math.max(80, box.clientWidth - 44);
  let fs = 28, w;
  for(;;){ cx.font = '700 '+fs+'px '+cs.fontFamily; w = cx.measureText(txt).width; if(w <= avail-14 || fs <= 16) break; fs -= 1; }
  el.style.setProperty('font-size', fs+'px', 'important');
  el.style.setProperty('width', Math.min(avail, Math.ceil(w)+16)+'px', 'important');
}
(function(){
  const all = ()=>document.querySelectorAll('.fm-hdr-car-in input').forEach(fmHdrCarFit);
  document.addEventListener('input', e=>{ if(e.target && e.target.closest && e.target.closest('.fm-hdr-car-in')) fmHdrCarFit(e.target); });
  document.addEventListener('change', e=>{ if(e.target && e.target.closest && e.target.closest('.fm-hdr-car-in')) fmHdrCarFit(e.target); });
  window.addEventListener('resize', all);
  try{ new MutationObserver(all).observe(document.body,{childList:true,subtree:true}); }catch(e){}
})();
function fmGrow(el){ if(!el||!el.style) return; el.style.height='auto'; el.style.height=(el.scrollHeight||0)>0 ? el.scrollHeight+'px' : ''; }
function fmCheckChanged(cb){
  const w = cb.closest ? cb.closest('.fm-check') : null;
  if(w){
    w.classList.toggle('on', cb.checked);
    const n = w.querySelector('.fm-note');
    if(n){ n.hidden = !cb.checked; if(cb.checked){ fmGrow(n); try{ n.focus(); }catch(e){} } }
  }
  fmBadges(document);
}
function fmToggleHelp(btn){ const w = btn.closest('.fm-check'); const h = w && w.querySelector('.fm-help'); if(h) h.hidden = !h.hidden; }
function fmToggleSection(btn){
  const sec = btn.closest('.fm-sec'); if(!sec) return;
  const was = sec.classList.contains('open');
  Array.prototype.forEach.call(sec.parentNode.children, s=>{ if(s.classList && s.classList.contains('fm-sec')) s.classList.remove('open'); });
  if(!was){ sec.classList.add('open'); try{ sec.scrollIntoView({block:'start', behavior:'smooth'}); }catch(e){} }
}
function fmBadges(root){
  (root||document).querySelectorAll('.fm-sec').forEach(sec=>{
    const b = sec.querySelector('.fm-badge'); if(!b) return;
    const total = sec.querySelectorAll('input.fm-cb').length, un = sec.querySelectorAll('input.fm-cb:not(:checked)').length;
    if(!total){ b.hidden = true; return; }
    b.hidden = false; b.className = un ? 'fm-badge' : 'fm-badge ok'; b.textContent = un ? un+' unchecked' : '✓ all checked';
  });
}
// A filled-out form, read-only, in the same sections. ctx = {title, date, car, auto(key)} supplies the stamped details for the header.
function fmViewerHTML(answers, ctx){
  ctx = ctx || {};
  const list = Object.values(answers||{}).filter(a=>a && a.type!=='blank' && a.type!=='note');
  const blocks = []; let cur = null, loose = null;
  const pushLoose = a=>{ if(!loose){ loose = {kind:'rows', items:[]}; blocks.push(loose); } loose.items.push(a); };
  list.forEach(a=>{
    if(a.type==='heading' && String(a.label||'').trim()){ cur = {kind:'sec', head:a, items:[]}; blocks.push(cur); loose = null; return; }
    if(a.type==='endsec'){ cur = null; loose = null; return; }
    if(cur) cur.items.push(a); else pushLoose(a);
  });
  const item = a=>{
    if(a.type==='heading') return '<div class="fm-line"></div>';
    if(a.type==='formheader'){
      const lines = (a.lines||[]).map(l=>({label:l.label, value: l.auto ? (ctx.auto ? ctx.auto(l.key) : '') : l.value})).filter(l=>String(l.value||'').trim());
      const items = a.items||['car','date'];
      return fmHdrHTML({title: ctx.title, car: items.indexOf('car')>=0 ? ctx.car : null, dateHTML: items.indexOf('date')>=0 ? fmEsc(a.date||ctx.date||'') : '', lines});
    }
    if(fmIsCheck(a)) return '<div class="fm-row"><div class="fm-cell"><div class="fm-vcheck"><span class="fm-vbox'+(a.value?' on':'')+'">'+(a.value?'✔':'')+'</span><div><div class="fm-vlabel">'+fmEsc(a.label||'(untitled checkbox)')+'</div>'+((a.note&&String(a.note).trim())?'<div class="fm-vnote">'+fmEsc(a.note)+'</div>':'')+'</div></div></div></div>';
    let shown;
    if(a.type==='photo') shown = a.value ? '📷 photo attached' : '— no photo taken';
    else if(a.type==='signature') shown = a.value ? '✒ '+a.value : '— not signed';
    else shown = (a.value===''||a.value==null) ? '—' : a.value;
    return '<div class="fm-row"><div class="fm-cell"><div class="fm-vk">'+fmEsc(a.label||'(untitled field)')+'</div><div class="fm-vv">'+fmEsc(shown)+'</div></div></div>';
  };
  let firstSec = true;
  return '<div class="fm-form">'+blocks.map(b=>{
    if(b.kind==='rows') return b.items.map(item).join('');
    const checks = b.items.filter(fmIsCheck), un = checks.filter(a=>!a.value).length;
    const open = firstSec; firstSec = false;
    return '<div class="fm-sec'+(open?' open':'')+'"><button type="button" class="fm-sec-head" onclick="fmToggleSection(this)"><span class="fm-title">'+fmEsc(b.head.label)+'</span>'+fmBadgeHTML(un, checks.length)+'<span class="fm-chev">▸</span></button><div class="fm-body">'+b.items.map(item).join('')+'</div></div>';
  }).join('')+'</div>';
}

function fbFillFieldHTML(f, empName, carVal){
  const fid = 'ff-'+f.id;
  const label = (f.label||'').trim() || '(untitled field)';
  if(f.autoFill==='carName'){
    return `<div class="field"><label>${label}</label><input type="text" id="${fid}" value="${(carVal||'').replace(/"/g,'&quot;')}" readonly style="color:var(--muted)"><p class="hint" style="margin:4px 0 0">Auto-filled from the car above</p></div>`;
  }
  if(f.autoFill==='employeeName'){
    return `<div class="field"><label>${label}</label><input type="text" id="${fid}" value="${(empName||'').replace(/"/g,'&quot;')}" readonly style="color:var(--muted)"><p class="hint" style="margin:4px 0 0">Auto-filled with your name</p></div>`;
  }
  switch(f.type){
    case 'longtext':
      return `<div class="field"><label>${label}</label><textarea id="${fid}" rows="3"></textarea></div>`;
    case 'number':
      return `<div class="field"><label>${label}</label><input type="number" inputmode="decimal" id="${fid}"></div>`;
    case 'date':
      return `<div class="field"><label>${label}</label><input type="date" id="${fid}" value="${todayISO()}"></div>`;
    case 'checkbox':
      return fmCheckHTML({id:fid, label:f.label, help:f.help});
    case 'checkexp':
      return fmCheckHTML({id:fid, noteId:fid+'-note', label:f.label, help:f.help, note:true});
    case 'yesno':
      return `<div class="field"><label>${label}</label><select id="${fid}"><option value="">—</option><option value="Yes">Yes</option><option value="No">No</option></select></div>`;
    case 'blank':
      return `<div></div>`;
    case 'heading':
      return `<div style="font-weight:700;font-size:17px;padding:14px 0 4px;border-bottom:1px solid var(--line);margin-bottom:2px">${label}</div>`;
    case 'radio':
      return `<div class="field"><label>${label}</label><div style="display:flex;flex-wrap:wrap;gap:8px 18px">${(f.options||[]).map((o,i)=>`<label style="display:flex;align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text)"><input type="radio" name="ffr-${f.id}" value="${escAttr(o)}" style="width:20px;height:20px;flex:none">${escText(o)}</label>`).join('')}</div></div>`;
    case 'dropdown':
      return `<div class="field"><label>${label}</label>${fmComboHTML(fid, f.options||[])}</div>`;
    case 'note':
      return fmNoteTextHTML(f);
    case 'formheader': {
      const items = Array.isArray(f.items) ? f.items : ['car','date'];
      const lines = fmHdrLines(f);
      const hasCar = items.indexOf('car')>=0;
      const lineHTML = l=>{ const v = l.auto ? wcHdrAutoVal(carVal, l.key) : ''; return `<input type="text" class="fm-hdr-in" data-key="${l.key}" ${l.auto?`data-auto="${escAttr(v)}"`:''} value="${escAttr(v)}" id="${fid}-l-${l.key.replace(':','_')}">`; };
      const carHTML = hasCar ? fmComboHTML('carInput', knownCars(), ' oninput="wcHdrFill()" onchange="wcHdrFill()"'+(carVal?' value="'+escAttr(carVal)+'" readonly':'')).replace('Type, or tap ▾ to pick','Car name') : null;
      return fmHdrHTML({title:fmTmplName, carHTML, dateHTML: items.indexOf('date')>=0 ? `<input type="date" id="${fid}-date" value="${todayISO()}">` : '', lines: lines.map(l=>({label:l.label, html:lineHTML(l)}))});
    }
    case 'endsec':
      return '';
    case 'photo':
      return `<div class="field"><label>${label}</label><input type="file" accept="image/*" capture="environment" id="${fid}" onchange="handleFillPhotoField(event,'${f.id}')">${fbFillPhotos[f.id]?`<img src="${fbFillPhotos[f.id]}" style="width:100%;border-radius:10px;margin-top:8px;display:block">`:''}</div>`;
    case 'signature':
      return `<div class="field"><label>${label} <span style="text-transform:none;color:var(--muted)">(type your name to sign)</span></label><input type="text" id="${fid}" placeholder="Type your full name"></div>`;
    default:
      return `<div class="field"><label>${label}</label><input type="text" id="${fid}"></div>`;
  }
}
// Fields saved side by side in Shop Boss's form maker share a row number; fields next to each other
// with the same number sit in one row here too (and stack on a narrow phone). Old forms: one per row.
function fbFillRows(fields){
  const rows = []; let last = null;
  (fields||[]).forEach((f,i)=>{
    const r = (f.row==null) ? 'solo'+i : f.row;
    if(rows.length && last===r) rows[rows.length-1].push(f); else { rows.push([f]); last = r; }
  });
  return rows;
}
function handleFillPhotoField(evt, fieldId){
  const file = evt.target && evt.target.files && evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ fbFillPhotos[fieldId] = reader.result; render(); };
  reader.onerror = ()=>{ showToast('Couldn\'t read that photo.', true); };
  reader.readAsDataURL(file);
}
function markDocFilledStructured(templateId, car, answers, flagNote){
  const tmpl = documents.find(d=>d.id===templateId);

    if(f.type==='radio'){ const r = document.querySelector('input[name="ffr-'+f.id+'"]:checked'); answers[f.id] = {label:f.label||'', type:f.type, value: r ? r.value : ''}; return; }

// ---- quick backup — same idea as Shop Boss: local storage is convenience, a real file is the safety net ----
async function quickBackup(){
  const payload = {app:'WorkClock', kind:'backup', version:1, savedAt:new Date().toISOString(), data:{employees, dayClocks, entries, documents, completedDocs, photos, photoRequests}};
  const fname = 'workclock-backup-'+todayISO()+'.json';
  const json = JSON.stringify(payload,null,2);
  const wroteCopy = backupDirHandle ? await wcWriteFileToHandle(backupDirHandle, fname, json) : false;
  try{
    if(typeof claude!=='undefined' && claude.use){
      const downloads = await claude.use('downloads');
      if(downloads){
        await downloads.save({filename: fname, data: json});
        try{ localStorage.setItem('wc-last-backup', new Date().toISOString()); }catch(e){}
        showToast(wroteCopy ? 'Backup saved — also copied to '+backupFolderName+'.' : 'Backup saved.');
        render();
        return;
      }
    }
    const blob = new Blob([json], {type:'application/json'});
    if(wcDownloadBlob(fname, blob)){
      try{ localStorage.setItem('wc-last-backup', new Date().toISOString()); }catch(e){}
      showToast(wroteCopy ? 'Backup saved — also copied to '+backupFolderName+'.' : 'Backup saved.');
      render();
      return;
    }
    throw {code:'unavailable'};
  }catch(err){
    if(err && err.code==='declined') return;
    if(wroteCopy){
      try{ localStorage.setItem('wc-last-backup', new Date().toISOString()); }catch(e){}
      showToast('Backup saved to '+backupFolderName+'.');
      render();
      return;
    }
    showToast('Couldn\'t save that file on this device. Try again — if it keeps happening, check that your browser allows downloads.', true);
  }
}

// ---- History: Calendar view (a scrollable month grid) ----
function buildCalendarHTML(year, month, curWeekId){
  const first = new Date(year, month, 1);
  const startDowIdx = WEEK_DAY_CODES.indexOf(weekStartDay)>=0 ? (WEEK_DAY_CODES.indexOf(weekStartDay)+1)%7 : 1; // 0=Sun..6=Sat
  const startDow = (first.getDay() - startDowIdx + 7)%7; // how many empty cells before day 1, given wherever the week starts
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const monthLabel = first.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  let pm = month-1, py = year; if(pm<0){ pm = 11; py--; }
  let nm = month+1, ny = year; if(nm>11){ nm = 0; ny++; }
  const dowLabels = ['M','T','W','T','F','S','S']; // Mon..Sun, in order
  const rotatedDows = [...dowLabels.slice(WEEK_DAY_CODES.indexOf(weekStartDay)>=0?WEEK_DAY_CODES.indexOf(weekStartDay):0), ...dowLabels.slice(0, WEEK_DAY_CODES.indexOf(weekStartDay)>=0?WEEK_DAY_CODES.indexOf(weekStartDay):0)];
  const dows = rotatedDows.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  let cells = '';
  for(let i=0;i<startDow;i++) cells += '<div class="cal-cell empty"></div>';
  for(let d=1; d<=daysInMonth; d++){
    const dateStr = year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
    const dayEntries = myEntriesForDate(dateStr);
    const hrs = dayEntries.reduce((s,l)=>s+l.hours,0);
    const entryCount = dayEntries.length;
    const hasAttachment = completedDocs.some(cd=>cd.empId===currentEmp && cd.date===dateStr) || photos.some(p=>p.empId===currentEmp && p.date===dateStr);
    const wid = weekIdFor(dateStr);
    let cls = 'cal-cell';
    // Any day up through today is tappable, even with nothing logged yet — that's how a
    // work entry gets added for a day that's already passed (dayDetail has the "+ Add" button).
    let clickable = dateStr<=todayISO();
    // Only the days of the work week Shop Boss set are outlined as the current week - plus any other day
    // of that week that has work or a clock record on it. Everything else with work is just "worked".
    const dowN = new Date(dateStr+'T00:00:00').getDay();
    const worked = hrs>0 || hasAttachment || myClocksForDate(dateStr).length>0;
    if(wid===curWeekId && (isWorkWeekDow(dowN) || worked)){ cls += ' cur-week'; }
    else if(worked){ cls += ' has-work'; }
    else cls += ' no-work';
    cells += `<div class="${cls}"${clickable?` onclick="nav({type:'dayDetail',date:'${dateStr}'})"`:''}>${entryCount?`<span class="cal-count-badge" title="${entryCount} work entr${entryCount===1?'y':'ies'}">${entryCount}</span>`:''}${hasAttachment?'<span class="cal-doc-badge" title="Document or photo attached">📎</span>':''}<span class="cal-daynum">${d}</span>${hrs>0?`<span class="cal-hrs">${fmtHrsMin(hrs)}</span>`:''}</div>`;
  }
  return `
    <div class="cal-head">
      <button class="cal-nav" onclick="navReplace({type:'history',mode:'calendar',year:${py},month:${pm}})">‹</button>
      <span>${monthLabel}</span>
      <button class="cal-nav" onclick="navReplace({type:'history',mode:'calendar',year:${ny},month:${nm}})">›</button>
    </div>
    <div class="cal-grid">${dows}${cells}</div>
    <div class="cal-legend">
      <span><i class="dot cur-week"></i>This week</span>
      <span><i class="dot has-work"></i>Worked</span>
      <span><i class="dot no-work"></i>No work</span>
      <span>📎 Doc or photo</span>
    </div>`;
}

let lastRenderedViewType = null; // used only to detect "just arrived at home" vs. "still sitting on home" (a toggle click re-renders home too, and that must NOT re-collapse the card the person just opened)
function render(){
  try{ persist(); }catch(e){}
  if(timerHandle){ clearInterval(timerHandle); clearTimeout(timerHandle); timerHandle=null; }
  if(!stack || !stack.length) stack = [{type:'who'}];
  const view = stack[stack.length-1];
  // Landing on home from anywhere else — the logo, a Back, a Submit, finishing a task, whatever
  // the path — always starts both cards collapsed again, on purpose: it's the "nothing's running
  // wide open to a stray tap" state you want to land in, every single time you arrive here.
  if(view.type==='home' && lastRenderedViewType!=='home'){ homeClockExpanded=false; homeTaskExpanded=false; }
  lastRenderedViewType = view.type;
  try{
    const whoBtn = document.getElementById('whoBtn');
    if(currentEmp && view.type!=='who'){
      whoBtn.hidden = false;
      const meE = employees.find(e=>e.id===currentEmp) || {};
      document.getElementById('whoName').textContent = meE.name || '';
      document.getElementById('whoAv').innerHTML = meE.thumb ? empAvatarHTML(meE, 28) : '👤';
    } else { whoBtn.hidden = true; }
    const app = document.getElementById('app');
    app.innerHTML = (renderers[view.type]||renderers.who)(view);
    autoGrowAll();
    const dc = myOpenDayClock();
    if(dc || active){
      // Ticks are scheduled to land exactly on the real second boundary of the running
      // clock-in/task, instead of a fixed 1000ms interval started at whatever moment render()
      // happened to fire. A plain setInterval(tick,1000) can leave the on-screen number up to
      // just under a second stale between its own ticks; any later render (e.g. a logo tap)
      // then recomputes the true value and can make the display visibly jump by a second. This
      // keeps the displayed value always correct, so there's nothing left to "jump."
      const tick = ()=>{
        const d1 = document.getElementById('dayTimerNum'); if(d1 && dc) d1.textContent = fmtElapsed(Date.now()-dc.clockedInAt);
        const d2 = document.getElementById('taskTimerNum'); if(d2 && active) d2.textContent = fmtElapsed(Date.now()-active.startedAt);
        const d3 = document.getElementById('timerNum'); if(d3 && active) d3.textContent = fmtElapsed(Date.now()-active.startedAt);
      };
      const scheduleNextTick = ()=>{
        const now = Date.now();
        let delay = 1000;
        if(dc) delay = Math.min(delay, 1000 - ((now - dc.clockedInAt) % 1000));
        if(active) delay = Math.min(delay, 1000 - ((now - active.startedAt) % 1000));
        if(!(delay > 0 && delay <= 1000)) delay = 1000;
        timerHandle = setTimeout(()=>{ tick(); scheduleNextTick(); }, delay);
      };
      tick();
      scheduleNextTick();
    }
  }catch(err){
    // A screen failed to draw. Never leave the tap looking like nothing happened —
    // show a visible, recoverable error instead of freezing on stale content.
    const app = document.getElementById('app');
    if(app){
      const msg = (err && err.message) ? err.message : String(err);
      app.innerHTML = `
        <h2 class="title">Something went wrong opening that screen</h2>
        <p class="sub">This screen hit an error instead of loading. Nothing was lost — your hours and history are untouched. Tap below to go back to the start.</p>
        <p class="sub" style="font-family:monospace;font-size:12px;word-break:break-all">${String(msg).replace(/</g,'&lt;')}</p>
        <button class="btn-primary" style="width:100%" onclick="recoverToWho()">Back to start</button>`;
    }
  }
}

  weekDetail: (v)=>{

    const byDate = new Map();
    list.forEach(l=>{ if(!byDate.has(l.date)) byDate.set(l.date, []); byDate.get(l.date).push(l); });
    const days = [...byDate.entries()].sort((a,b)=> a[0]<b[0]?-1:1);
    const empName = (employees.find(e=>e.id===currentEmp)||{}).name || '';
    return `

      const dayHrs = dayList.reduce((s,l)=>s+l.hours,0);
      return `

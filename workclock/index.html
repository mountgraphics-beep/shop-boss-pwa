    const weeks = myAllWeeks();
    const periodVal = repState.period==='all' ? 'all' : (repState.period==='custom' ? 'custom' : (repState.wid||weekId()));
    const wkOpts = weeks.map(([wid])=>`<option value="${wid}" ${periodVal===wid?'selected':''}>${weekLabel(wid)}</option>`).join('');
    const curInList = weeks.some(([wid])=>wid===weekId());
    const carNames = [...new Set([...entries.filter(l=>l.empId===currentEmp).map(l=>l.car), ...completedDocs.filter(x=>x.empId===currentEmp).map(x=>x.car), ...photos.filter(p=>p.empId===currentEmp).map(p=>p.car)].filter(Boolean))].sort((a,b)=>a.localeCompare(b));
    const allCars = !repState.cars.length;
    const rangeTxt = repState.period==='all' ? 'All time' : (d.from===d.to ? fmtDate(d.from) : (d.from.startsWith('0000')?'Start':fmtDate(d.from))+' to '+(d.to.startsWith('9999')?'today':fmtDate(d.to)));
    const carTxt = allCars ? 'All cars' : repState.cars.join(', ');
    const empTxt = d.showClocks ? fmtHrsMin(d.clockHrs) : 'not shown when filtering by car';
    const line = l=>{
      const bits = [fmtDate(l.date), escText(l.car||'No car')];
      if(l.task) bits.push(escText(l.task));
      bits.push(fmtHrsMin(l.hours));
      if(l.consumables) bits.push('Parts/consumables: '+escText(l.consumables));
      Object.keys(l.pickListAnswers||{}).forEach(id=>{ if(l.pickListAnswers[id]) bits.push(escText(id==='consumables'?'Consumables and parts':((shopPickLists.find(x=>x.id===id)||{}).name||(id==='billingparts'?'Parts used':'List')))+': '+escText(l.pickListAnswers[id])); });
      if(l.desc) bits.push('Notes: '+escText(l.desc));
      return bits.join(' · ');
    };
    const screenDays = d.dates.map(date=>{
      const es = d.entries.filter(l=>l.date===date), ds = d.docs.filter(x=>x.date===date), ps = d.photos.filter(p=>p.date===date);
      const cl = d.showClocks ? d.clocks.filter(c=>c.date===date) : [];
      const th = es.reduce((t,l)=>t+l.hours,0);
      return `<details class="rep-det"><summary><span>${fmtDate(date)} <span class="rep-clock" style="display:inline">· ${es.length} entr${es.length===1?'y':'ies'}</span></span><span class="rep-hrs">${fmtHrsMin(th)}</span></summary>
        ${cl.map(c=>`<div class="rep-clock">${clockLineText(c)}</div>`).join('')}
        ${es.map(reportEntryLine).join('')}
        ${ds.length?`<div class="rep-note">Forms: ${ds.map(x=>escText(x.templateName)).join(', ')}</div>`:''}
        ${ps.length?`<div class="rep-note">${ps.length} photo${ps.length===1?'':'s'}</div>`:''}
      </details>`;
    }).join('');
    const printDays = d.dates.map(date=>{
      const es = d.entries.filter(l=>l.date===date), ds = d.docs.filter(x=>x.date===date), ps = d.photos.filter(p=>p.date===date);
      const cl = d.showClocks ? d.clocks.filter(c=>c.date===date) : [];
      return `<div style="margin-top:10px;break-inside:avoid">
        <div style="font-weight:700;border-bottom:1px solid #000">${fmtDate(date)}${cl.length?' — Employee hours: '+cl.map(clockLineText).join('; '):''}</div>
        ${es.map(l=>`<div style="padding:2px 0;border-bottom:1px solid #ddd">${line(l)}</div>`).join('')}
        ${ds.length?`<div style="padding:2px 0">Forms: ${ds.map(x=>escText(x.templateName)+(x.car?' ('+escText(x.car)+')':'')).join(', ')}</div>`:''}
        ${ps.length?`<div style="padding:2px 0">Photos: ${ps.length}</div>`:''}
      </div>`;
    }).join('');
    return `
    <div class="no-print">
    <h2 class="title">Work Report</h2>
    <p class="sub">${escText(empName)} — a report to look at or print. Nothing here can be changed or deleted.</p>
    <div class="field">
      <label>Work period</label>
      <select onchange="setRepPeriod(this.value)">
        <option value="all" ${periodVal==='all'?'selected':''}>All time</option>
        <option value="custom" ${periodVal==='custom'?'selected':''}>Custom dates</option>
        ${curInList?'':`<option value="${weekId()}" ${periodVal===weekId()?'selected':''}>${weekLabel(weekId())} (this week)</option>`}
        ${wkOpts}
      </select>
    </div>
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1"><label>From</label><input type="date" value="${repState.period==='all'?'':d.from}" onchange="setRepDate('from', this.value)"></div>
      <div class="field" style="flex:1"><label>To</label><input type="date" value="${repState.period==='all'?'':d.to}" onchange="setRepDate('to', this.value)"></div>
    </div>
    <div class="field">
      <label>Cars</label>
      <label class="rep-chk"><input type="checkbox" ${allCars?'checked':''} onchange="setRepAllCars()"> All cars</label>
      ${carNames.map(c=>`<label class="rep-chk"><input type="checkbox" ${repState.cars.includes(c)?'checked':''} onchange="toggleRepCar(${jsStr(c)})"> ${escText(c)}</label>`).join('')}
    </div>
    <p class="sub" style="margin:4px 0 12px"><strong>${rangeTxt}</strong> · ${escText(carTxt)}<br>Employee hours: <strong>${empTxt}</strong> · Task hours: <strong>${fmtHrsMin(d.taskHrs)}</strong> · ${d.entries.length} entr${d.entries.length===1?'y':'ies'}${d.docs.length?' · '+d.docs.length+' form'+(d.docs.length===1?'':'s'):''}${d.photos.length?' · '+d.photos.length+' photo'+(d.photos.length===1?'':'s'):''}</p>
    ${screenDays || '<p class="empty">Nothing in this period.</p>'}
    ${shareBtn()}
    <button class="btn-ghost" style="margin-top:10px" onclick="goBack()">Back</button>
    </div>
    <div class="print-only" style="color:#000;font-size:12px">
      <div style="font-size:18px;font-weight:700">Work Report — ${escText(empName)}</div>
      <div>${rangeTxt} · ${escText(carTxt)} · printed ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
      <div style="margin:6px 0 4px"><strong>Employee hours:</strong> ${empTxt} &nbsp; <strong>Task hours:</strong> ${fmtHrsMin(d.taskHrs)} &nbsp; ${d.entries.length} entr${d.entries.length===1?'y':'ies'}${d.docs.length?', '+d.docs.length+' form'+(d.docs.length===1?'':'s'):''}${d.photos.length?', '+d.photos.length+' photo'+(d.photos.length===1?'':'s'):''}</div>
      ${printDays || '<div>Nothing in this period.</div>'}
    </div>`;
  },

  dayDetail: (v)=>{
    const list = myEntriesForDate(v.date).sort((a,b)=>a.startedAt-b.startedAt);
    const hrs = list.reduce((s,l)=>s+l.hours,0);
    const docs = completedDocs.filter(d=>d.empId===currentEmp && d.date===v.date);
    const dayPhotos = photos.filter(p=>p.empId===currentEmp && p.date===v.date);
    const empName2 = (employees.find(e=>e.id===currentEmp)||{}).name || '';
    const clocks2 = myClocksForDate(v.date);
    return `
    <div class="print-only">${empName2} — printed ${new Date().toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'})}</div>
    <h2 class="title">${fmtDate(v.date)}</h2>
    <p class="sub">${fmtHrsMin(hrs)} · ${list.length} entr${list.length===1?'y':'ies'}</p>
    ${list.length ? list.map(entryRowHTML).join('') : `<p class="empty">Nothing logged this day.</p>`}
    ${docs.length ? `<p class="section-title">Documents filled out this day</p>${docs.map(completedDocRow).join('')}` : ''}
    ${dayPhotos.length ? `<p class="section-title">Photos this day</p><div class="photo-grid">${dayPhotos.map(photoThumb).join('')}</div>` : ''}
    ${clocks2.length ? `<p class="section-title">Clock-in and clock-out</p>${clocks2.map(c=>`<div class="card" style="margin-bottom:10px"><div class="entry-car">${clockLineText(c)}</div><div class="entry-date">${c.submitted?'Sent':'Not sent yet'} · <span class="edit-link" onclick="nav({type:'editClock', id:'${c.id}'})">Edit</span></div></div>`).join('')}` : ''}
    ${(list.length||docs.length||dayPhotos.length||clocks2.length) ? `<p class="hint" style="margin:14px 0 0">To send just this day again, submit the whole work week. Shop Boss ignores anything it already has.</p>` : ''}
    ${shareBtn()}
    ${v.date<=todayISO() ? `<button class="btn-ghost" style="margin-top:10px" onclick="nav({type:'newEntryForDate', date:'${v.date}'})">+ Add a work entry for this day</button>` : ''}
    ${list.length ? `<button class="btn-ghost" style="margin-top:10px;border-color:#7a2020;color:#e05a5a" onclick="requestDeleteDayEntries('${v.date}')">Delete all work entries for this day</button>` : ''}
    ${clocks2.length ? `<button class="btn-ghost" style="margin-top:10px;border-color:#7a2020;color:#e05a5a" onclick="requestDeleteDayClocks('${v.date}')">Delete clock-in and clock-out times for this day</button>` : ''}
    <button class="btn-ghost" style="margin-top:10px" onclick="goBack()">Back</button>`;
  },

  newEntryForDate: (v)=>{
    const dateStr = v.date;
    return `
    <h2 class="title">Add a work entry</h2>
    <p class="sub">For ${fmtDate(dateStr)} — since the clock isn't running for a past day, enter the start and end time yourself.</p>
    <div class="field">
      <label>Car</label>
      ${carSelectHTML(v.car)}
    </div>
    ${taskFieldHTML(v.task)}
    <div style="display:flex;gap:10px">
      <div class="field" style="flex:1;margin-bottom:0">
        <label>Start time</label>
        ${timeFieldHTML('startTimeInput', v.startTimeStr||'')}
      </div>
      <div class="field" style="flex:1;margin-bottom:0">
        <label>End time</label>
        ${timeFieldHTML('endTimeInput', v.endTimeStr||'')}
      </div>
    </div>
    <p class="hint" style="margin:6px 0 16px">Both times are on ${fmtDate(dateStr)}.</p>
    ${extraListsHTML(v.answers)}
    ${notesFieldHTML(v.notes)}
    ${v.err?`<p class="field-error">${v.err}</p>`:''}
    <button class="btn-primary" onclick="saveManualEntry(${jsStr(dateStr)}, document.getElementById('carInput').value, document.getElementById('lf-task').value, document.getElementById('startTimeInput').value, document.getElementById('endTimeInput').value, lfNotes())">Save entry</button>
    <p class="hint" style="text-align:center;margin:6px 0 0">Goes to the shop with your next send.</p>
    <button class="btn-ghost" onclick="goBack()">Cancel</button>`;
  },

  documents: ()=>{
    const general = documents.filter(d=>isGeneralItem(d) && docIsOpen(d));
    const generalNew = general.filter(d=>docTimesFilled(d)===0).length;
    const forMe = documents.filter(d=>d.empId===currentEmp && docIsOpen(d));
    const completed = completedDocs.filter(d=>d.empId===currentEmp).sort((a,b)=>b.completedAt-a.completedAt);
    const dismissedNotes = myDismissedNotes(), dismissedReqs = myDismissedPhotoRequests();
    const myPhotos = photos.filter(p=>p.empId===currentEmp).sort((a,b)=>b.takenAt-a.takenAt);
    const openReqs = myOpenPhotoRequests();
    const reqsMe = openReqs.filter(r=>r.empId), reqsAll = openReqs.filter(r=>!r.empId);
    const openNotes = myOpenNotes();
    const myShopPhotos = shopPhotos.filter(p=>!p.empId || p.empId===currentEmp);
    const reqCard = r=>`
      <div class="card" style="margin-bottom:10px">
        <div class="entry-car">${r.car?r.car+' — ':''}${r.note||'Photo requested'}</div>
        <div class="entry-date">Photo requested — take it from the task's 📎 button once you're on that car</div>
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;text-align:right"><span class="switch-link" style="padding:8px 14px" onclick="dismissPhotoRequest('${r.id}')">Dismiss</span></div>
      </div>`;
    const unsent = completed.filter(d=>!d.submitted).length;
    return `
    <h2 class="title">Documents</h2>
    <p class="sub">${lastUpdateAt ? 'Last update from Shop Boss: '+new Date(lastUpdateAt).toLocaleString() : 'No updates received from Shop Boss yet.'}</p>
    ${docPill('mine','Assigned to you', forMe.length+reqsMe.length, 'Forms and photo requests Shop Boss addressed to you.',
       (forMe.length||reqsMe.length) ? forMe.map(docRow).join('')+reqsMe.map(reqCard).join('') : '<p class="empty">Nothing assigned to you right now.</p>')}
    ${docPill('all','For everyone', generalNew+reqsAll.length, 'Forms and photo requests that go to the whole crew.',
       (general.length||reqsAll.length) ? general.map(docRow).join('')+reqsAll.map(reqCard).join('') : '<p class="empty">Nothing for everyone right now.</p>')}
    ${docPill('notes','Notes from the shop', openNotes.length+myShopPhotos.length, 'Notes and photos Shop Boss sent. Photos clear with the next update.',
       (openNotes.length||myShopPhotos.length)
        ? openNotes.map(n=>`
      <div class="card" style="margin-bottom:10px">
        <div class="entry-car">📝 ${n.text}</div>
        <div style="border-top:1px solid var(--line);margin-top:14px;padding-top:12px;text-align:right"><span class="switch-link" style="padding:8px 14px" onclick="dismissNote('${n.id}')">Dismiss</span></div>
      </div>`).join('') + (myShopPhotos.length ? `<div class="photo-grid" style="margin-top:6px">${myShopPhotos.map(p=>`<div class="photo-thumb" onclick="nav({type:'shopPhotoView', id:'${p.id}'})"><img src="${p.dataUrl}"><div class="photo-cap">${escText(p.caption||p.car||'From the shop')}</div></div>`).join('')}</div>` : '')
        : '<p class="empty">No notes or photos from the shop.</p>')}
    ${docPill('photos','Photos', myPhotos.length, 'Photos usually get attached from inside a task\'s 📎 button. Add one you already have here. Photos marked Sent have already gone to the shop and stay here until the next update. To send one again, open it, delete it, and attach it again.',
       `<input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handlePhotoFile(event)">
        <button class="btn-ghost" onclick="triggerGalleryPicker()">🖼 Add an existing photo</button>
        ${myPhotos.length ? `<div class="photo-grid" style="margin-top:14px">${myPhotos.map(photoThumb).join('')}</div>` : '<p class="empty">No photos yet.</p>'}`)}
    ${docPill('done','Completed / Sent', completed.length, 'Forms you filled out. Ones marked Sent have already gone to the shop and won\'t be sent again; they stay on this phone until the next update. To send one again, tap "Undo — remove filled out." The blank form comes back under Assigned to you, and you fill it out again. That new copy goes out with your next submit. Dismissed notes and photo requests are kept here too.',
       (completed.length ? completed.map(completedDocRow).join('') : '<p class="empty">Nothing filled out yet.</p>') +
       ((dismissedNotes.length||dismissedReqs.length) ? '<p class="section-title" style="margin-top:14px">Dismissed</p>' +
         dismissedNotes.map(n=>`<div class="card" style="margin-bottom:10px"><div class="entry-car">📝 ${escText(n.text)}</div><div style="text-align:right;margin-top:8px"><span class="switch-link" onclick="restoreNote('${n.id}')">Restore</span></div></div>`).join('') +
         dismissedReqs.map(r=>`<div class="card" style="margin-bottom:10px"><div class="entry-car">${r.car?escText(r.car)+' — ':''}${escText(r.note||'Photo requested')}</div><div class="entry-date">Photo request</div><div style="text-align:right;margin-top:8px"><span class="switch-link" onclick="restorePhotoRequest('${r.id}')">Restore</span></div></div>`).join('') : ''),
       unsent?unsent+' to send':'')}
    ${shareBtn()}
    <button class="btn-ghost" style="margin-top:10px" onclick="goBack()">Back</button>`;
  },

  shopPhotoView: (v)=>{
    const ph = shopPhotos.find(x=>x.id===v.id);

    return `
    <h2 class="title">${escText(ph.caption||'Photo from the shop')}</h2>

    <button class="btn-ghost" onclick="goBack()">Back</button>`;

  fillDocument: (v)=>{

      const empName = (employees.find(e=>e.id===currentEmp)||{}).name || '';
      fmTmplName = tmpl.name;
      const hasHdr = tmpl.fields.some(f=>f.type==='formheader');
      return `
      ${hasHdr ? '' : `<h2 class="title">${tmpl.name}${tmpl.car?` <span style="color:var(--accent)">— ${tmpl.car}</span>`:''}</h2>`}

      ${tmpl.fields.some(f=>f.type==='formheader' && (Array.isArray(f.items)?f.items:['car','date']).indexOf('car')>=0) ? '' : `<div class="field">
        <label>Car <span style="text-transform:none;color:var(--muted)">(optional)</span></label>
        <input type="text" id="carInput" list="carList" value="${(tmpl.car||'').replace(/"/g,'&quot;')}" placeholder="Leave blank if this isn't tied to a car" ${tmpl.car?'readonly':''}>
        <datalist id="carList">${knownCars().map(c=>`<option value="${c}">`).join('')}</datalist>
      </div>`}
      ${fmFormHTML(tmpl.fields, fbFillRows, f=>fbFillFieldHTML(f, empName, tmpl.car||''))}
      ${flagFieldHTML('flagInput', null)}
      <button class="btn-primary" onclick="submitStructuredForm('${tmpl.id}')">Save form</button>
    <p class="hint" style="text-align:center;margin:6px 0 0">Goes to the shop with your next send.</p>
      <button class="btn-ghost" onclick="goBack()">Cancel</button>`;
    }
    return `
    <h2 class="title">${tmpl.name}${tmpl.car?` <span style="color:var(--accent)">— ${tmpl.car}</span>`:''}</h2>
    <p class="sub">${tmpl.car ? `This one is tagged for the <strong>${tmpl.car}</strong> — ` : ''}Record that you filled this out today.${tmpl.car ? '' : ' Attach a car if it\'s for one — leave it blank if it isn\'t.'}</p>
    <div class="field">
      <label>Car <span style="text-transform:none;color:var(--muted)">(optional)</span></label>
      ${carSelectHTML(tmpl.car, true)}
    </div>
    <div class="field">
      <label>Attach the filled-out file <span style="text-transform:none;color:var(--muted)">(optional)</span></label>
      <input type="file" id="filledFile" accept="image/*,application/pdf">
    </div>
    ${flagFieldHTML('flagInput', null)}
    <button class="btn-primary" onclick="saveFilledDocument('${tmpl.id}', document.getElementById('carInput').value, document.getElementById('filledFile'), document.getElementById('flagInput').value)">Save</button>
    <p class="hint" style="text-align:center;margin:6px 0 0">Goes to the shop with your next send.</p>
    <button class="btn-ghost" onclick="goBack()">Cancel</button>`;
  },

  attachMenu: (v)=>`
    <h2 class="title">Attach to ${v.car}</h2>
    <p class="sub">What do you want to add to this task?</p>
    <button class="btn-primary" onclick="nav({type:'attachPhotoMenu', entryId:'${v.entryId}', car:${jsStr(v.car)}})">📷 Photos</button>
    <button class="btn-ghost" onclick="nav({type:'attachFormMenu', entryId:'${v.entryId}', car:${jsStr(v.car)}})">📄 Forms</button>
    <button class="btn-ghost" onclick="goBack()">Cancel</button>`,

  attachPhotoMenu: (v)=>`
    <h2 class="title">Add a photo</h2>
    <p class="sub">For ${v.car}</p>
    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none" onchange="handleAttachPhotoFile(event)">
    <input type="file" id="galleryInput" accept="image/*" style="display:none" onchange="handleAttachPhotoFile(event)">
    <button class="btn-primary" onclick="pendingAttachTarget={entryId:'${v.entryId}',car:${jsStr(v.car)}};triggerCameraPicker()">📷 Take photo</button>
    <button class="btn-ghost" onclick="pendingAttachTarget={entryId:'${v.entryId}',car:${jsStr(v.car)}};triggerGalleryPicker()">🖼 Choose existing photo</button>
    <button class="btn-ghost" onclick="goBack()">Cancel</button>`,

  attachFormMenu: (v)=>{
    // A form tagged for a specific car (by Darryl) only shows up here when that car matches the
    // one this task is actually for — otherwise it's too easy to grab a form meant for a
    // different car and attach it to the wrong one. Forms with no car tag at all are fine for any car.

    ${all.length ? all.map(d=>`<button class="btn-ghost" onclick="attachFormToEntry('${d.id}','${v.entryId}',${jsStr(v.car)})">${d.name}${d.car?` — ${d.car}`:''}</button>`).join('') : '<p class="empty">No forms for this car yet.</p>'}
    <button class="btn-ghost" onclick="goBack()">Cancel</button>`;
  },

    <img src="${photo.dataUrl}" style="width:100%;border-radius:10px;margin-bottom:16px;display:block">

    ${shareBtn()}
    ${photo.submitted?'<p class="hint" style="margin:-6px 0 14px">Sent — stays on this phone until the next update. To send it again, delete it and attach it again.</p>':''}
    <div class="field">
      <label>Car</label>
      ${carSelectHTML(photo.car)}
    </div>
    <div class="field">
      <label>Attach to a task <span style="text-transform:none;color:var(--muted)">(optional)</span></label>
      <select id="entrySelect">
        <option value="">None</option>
        ${myEntries.map(l=>`<option value="${l.id}" ${photo.entryId===l.id?'selected':''}>${fmtDate(l.date)} — ${l.car}${l.task?' · '+l.task:''}</option>`).join('')}
      </select>
    </div>
    ${flagFieldHTML('flagInput', photo.flagNote||null)}
    <button class="btn-primary" onclick="saveReassignedPhoto('${photo.id}', document.getElementById('carInput').value, document.getElementById('entrySelect').value, document.getElementById('flagInput').value)">Save</button>
    <p class="hint" style="text-align:center;margin:6px 0 0">Goes to the shop with your next send.</p>
    ${shareBtn()}
    <button class="btn-ghost" onclick="goBack()">Cancel</button>
    <p class="switch-link" style="color:#e05c5c" onclick="requestDeletePhoto('${photo.id}')">Delete this photo</p>`;
  },

  assignPhoto: ()=>{
    if(!pendingPhoto) return renderers.documents();
    const todays = entries.filter(l=>l.empId===currentEmp).sort((a,b)=>b.startedAt-a.startedAt);
    return `
    <h2 class="title">Assign this photo</h2>
    <p class="sub">For a photo you already had — taken outside the app.</p>

// ===== SBX-BEGIN smart box engine (shared by Shop Boss and WorkClock) =====
// A "smart box" is a text box (input or textarea) that may carry a list.
//   data-acmode="single"   list, pick ONE (typing allowed)      -> A
//   data-acmode="multi"    list, pick SEVERAL (comma separated) -> B
//   data-acmode="listonly" list, pick ONE, no typing, no keyboard -> C
//   (no data-acmode)       no list; just word suggestions       -> D / E
// The list comes from data-acopts (JSON) or acAppSource(el). The arrow button calls acToggleAll(id).
(function(){
  const KEY = 'wc-autocomplete-v1';
  let db = {};
  try{ db = JSON.parse(localStorage.getItem(KEY)||'{}') || {}; }catch(e){ db = {}; }
  try{ const FL = KEY+'-fresh46'; if(!localStorage.getItem(FL)){ db = {}; localStorage.removeItem(KEY); localStorage.setItem(FL,'1'); } }catch(e){}   // new version: start the learned words clean
  let saveT = null, cur = null, items = [], active = -1, skipInput = false, box = null, lastAccept = 0, lastEl = null;
  function persistDb(){
    clearTimeout(saveT);
    saveT = setTimeout(()=>{ try{
      const ks = Object.keys(db);
      if(ks.length>4000){ ks.sort((a,b)=>(db[a].n-db[b].n)||(db[a].u-db[b].u)); ks.slice(0,ks.length-3500).forEach(k=>delete db[k]); }
      localStorage.setItem(KEY, JSON.stringify(db));
    }catch(e){} }, 400);
  }
  function learnOne(t){
    t = String(t||'').trim().replace(/\s+/g,' ');
    if(t.length<2) return;
    if(t.length>80){ t.split(/[^\p{L}\p{N}'-]+/u).forEach(w=>{ if(w.length>=3 && w.length<=30) learnOne(w); }); return; }
    if(/^[\d\s.,:\/$%-]+$/.test(t)) return;
    const k = t.toLowerCase(), r = db[k];
    if(r){ r.n++; r.u = Date.now(); r.t = t; } else db[k] = {t:t, n:1, u:Date.now()};
  }
  function learn(text){ String(text||'').split(/[\n,;]+/).forEach(learnOne); persistDb(); }
  function reset(){ db = {}; try{ localStorage.removeItem(KEY); }catch(e){} }
  function modeOf(el){ return (el && el.getAttribute && el.getAttribute('data-acmode')) || (el && el.getAttribute && el.getAttribute('data-accombo') ? 'single' : ''); }
  function eligible(el){
    if(!el || !el.tagName) return false;
    if(el.disabled || el.hasAttribute('data-noac')) return false;
    if(el.readOnly && modeOf(el)!=='listonly') return false;
    if(el.tagName==='TEXTAREA') return true;
    if(el.tagName!=='INPUT') return false;
    const t = (el.getAttribute('type')||'text').toLowerCase();
    if(t!=='text' && t!=='search') return false;
    if(el.maxLength>0 && el.maxLength<=4) return false;
    if(/numeric|decimal|tel/.test(el.getAttribute('data-inputmode')||el.getAttribute('inputmode')||'')) return false;
    return true;
  }
  function ownOptions(el){
    let o = null;
    const a = el.getAttribute('data-acopts');
    if(a){ try{ o = JSON.parse(a); }catch(e){} }
    if(!o && typeof acAppSource==='function'){ try{ o = acAppSource(el); }catch(e){} }
    return Array.isArray(o) ? o.map(x=>String(x==null?'':(typeof x==='object'?(x.name||''):x))).filter(Boolean) : null;
  }
  function pool(el, mode, own){
    const out = [], seen = new Set();
    const add = arr=>(arr||[]).forEach(s=>{
      s = String(s==null ? '' : (typeof s==='object' ? (s.name||'') : s)).trim();
      if(!s || s.length>80) return;
      const k = s.toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push(s);
    });
    add(own);
    if(mode!=='single' && mode!=='listonly'){ try{ add(typeof acAppExtras==='function' ? acAppExtras() : []); }catch(e){} }
    if(mode!=='listonly') Object.keys(db).map(k=>db[k]).sort((a,b)=>(b.n-a.n)||(b.u-a.u)).forEach(r=>add([r.t]));
    return out;
  }
  function wordStarts(t, q){ return t.toLowerCase().split(/[\s\-\/(),]+/).some(w=>w.startsWith(q)); }
  function compute(el, showAll){
    const mode = modeOf(el), own = ownOptions(el), v = el.value;
    if(showAll){ return own ? own.map(o=>({text:o, from:0, to:v.length, all:true})).slice(0,500) : []; }
    if(mode==='listonly') return [];
    const caret = (el.selectionStart==null) ? v.length : el.selectionStart;
    const before = v.slice(0, caret);
    if(mode==='single'){
      const q = before.trim(), lq = q.toLowerCase();
      if(!q) return [];
      const res = [], seen = new Set();
      const P = pool(el, mode, own);
      P.forEach(t=>{ const l = t.toLowerCase(); if(l.startsWith(lq) && l!==lq && !seen.has(l)){ seen.add(l); res.push({text:t, from:0, to:v.length, whole:true}); } });
      P.forEach(t=>{ const l = t.toLowerCase(); if(!seen.has(l) && l!==lq && wordStarts(t, lq)){ seen.add(l); res.push({text:t, from:0, to:v.length, whole:true}); } });

    }

    const seg = segRaw.replace(/^\s+/, ''), segStart = caret - seg.length;
    const word = /[^\s,;]*$/.exec(before)[0], wStart = caret - word.length;
    const min = own ? 1 : 2;
    const ls = seg.toLowerCase().replace(/\s+/g,' '), lw = word.toLowerCase();

    const push = (text, from)=>{ const k = text.toLowerCase(); if(seen.has(k)) return; seen.add(k); res.push({text:text, from:from, to:caret, seg:(mode==='multi')}); };
    const P = pool(el, mode, own);
    if(seg.length>=min) P.forEach(t=>{ const l = t.toLowerCase(); if(l.startsWith(ls) && l!==ls) push(t, segStart); });
    if(mode==='multi' && own && seg.length>=1) P.forEach(t=>{ const l = t.toLowerCase(); if(!seen.has(l) && l!==ls && wordStarts(t, ls)) push(t, segStart); });

  function ensureBox(){
    if(box) return box;
    box = document.createElement('div');
    box.id = 'acBox';
    box.setAttribute('style','position:fixed;z-index:99999;display:none;background:var(--surface-2,#1F2123);color:var(--text,#ECEDEE);border:1px solid var(--line,#2C2E31);border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.45);overflow-y:auto;max-height:260px;-webkit-overflow-scrolling:touch');
    box.addEventListener('pointerdown', ev=>{ ev.stopPropagation(); });
    document.body.appendChild(box);
    return box;
  }

  function place(){
    if(!cur || !box || box.style.display==='none') return;
    const r = (cur.closest && cur.closest('.sbx') || cur).getBoundingClientRect();
    const w = Math.max(r.width, 200);
    box.style.width = w+'px';
    box.style.left = Math.max(4, Math.min(r.left, window.innerWidth-w-4))+'px';
    box.style.maxHeight = '260px';
    const natural = Math.min(260, box.scrollHeight);
    const below = vvBottom() - r.bottom - 8, above = r.top - 8;
    if(below >= Math.min(natural, 150) || below >= above){
      box.style.maxHeight = Math.max(90, Math.min(260, below))+'px'; box.style.bottom = ''; box.style.top = (r.bottom+4)+'px';
    } else {
      box.style.maxHeight = Math.max(90, Math.min(260, above))+'px'; box.style.top = ''; box.style.bottom = (window.innerHeight - r.top + 4)+'px';
    }
  }
  function hide(){ if(box) box.style.display = 'none'; items = []; active = -1; }
  function thumbFor(el, s){
    if(!el.getAttribute('data-acthumb') || typeof window.acThumbHTML!=='function') return null;
    return window.acThumbHTML(s.text);
  }
  function show(el, list, autoFirst){
    if(!list.length){ hide(); return; }
    cur = el; items = list; active = autoFirst ? 0 : -1;
    const b = ensureBox();
    b.innerHTML = '';
    list.forEach((s,i)=>{
      const d = document.createElement('div');
      d.setAttribute('data-i', i);
      d.setAttribute('style','padding:11px 14px;cursor:pointer;border-bottom:1px solid var(--line,#2C2E31);display:flex;align-items:center;gap:10px');
      const th = thumbFor(el, s);
      if(th){
        const t = document.createElement('span'); t.className = 'cp-thumb'; t.innerHTML = th;
        t.addEventListener('pointerdown', ev=>{ ev.preventDefault(); ev.stopPropagation(); if(typeof window.acThumbTap==='function') window.acThumbTap(s.text); });
        d.appendChild(t);
      }
      const tx = document.createElement('span'); tx.textContent = s.text; tx.style.flex = '1'; tx.style.minWidth = '0'; d.appendChild(tx);
      d.addEventListener('pointerdown', ev=>{ ev.preventDefault(); accept(s); });
      b.appendChild(d);
    });
    b.style.display = 'block';
    b.scrollTop = 0;
    paint(); place();
    keepVisible(el);
  }
  function keepVisible(el){
    try{
      const wrap = (el.closest && el.closest('.sbx')) || el, r = wrap.getBoundingClientRect();
      const need = r.bottom + 150;
      if(need > vvBottom()) wrap.scrollIntoView({block:'center'});
      setTimeout(place, 60);
    }catch(e){}
  }
  function paint(){
    if(!box) return;
    Array.prototype.forEach.call(box.children, (d,i)=>{ d.style.background = (i===active) ? 'var(--accent-tint,#241412)' : 'transparent'; });
    if(active>=0 && box.children[active] && box.children[active].scrollIntoView){ try{ box.children[active].scrollIntoView({block:'nearest'}); }catch(e){} }
  }
  function fire(el, type){ try{ el.dispatchEvent(new Event(type, {bubbles:true})); }catch(e){} }
  function accept(s){
    const el = cur; if(!el) return;
    const now = Date.now();

    lastAccept = now; lastEl = el;

    let text = s.text, from = s.from, to = s.to;
    if(mode==='multi'){
      const noEnter = el.hasAttribute('data-acnoenter');

    fire(el, 'change');
    hide();
    if(mode==='single' || mode==='listonly'){ try{ el.blur(); }catch(e){} }
    else if(wasFocused){ try{ el.focus(); }catch(e){} }
    try{ if(typeof window.acAfterPick==='function') window.acAfterPick(el, s.text); }catch(e){}
  }
  // ----- Enter / Backspace inside a multi box (comma + new line) -----
  function multiEnter(el){
    if(el.hasAttribute('data-acnoenter')) return false;
    const v = el.value, a = el.selectionStart==null ? v.length : el.selectionStart, b = el.selectionEnd==null ? a : el.selectionEnd;
    const before = v.slice(0, a);

    const ins = ',\n';

    try{ el.setSelectionRange(pos, pos); }catch(e){}

    return true;
  }
  function multiBackspace(el){
    const v = el.value, a = el.selectionStart, b = el.selectionEnd;
    if(a==null || a!==b || a<2) return false;
    const before = v.slice(0, a);
    const m = /,\n$|, $/.exec(before);
    if(!m) return false;
    el.value = before.slice(0, before.length - m[0].length) + v.slice(a);
    const pos = before.length - m[0].length;
    try{ el.setSelectionRange(pos, pos); }catch(e){}
    fire(el, 'input');
    return true;
  }
  document.addEventListener('beforeinput', e=>{
    const el = e.target;
    if(!el || !el.tagName || modeOf(el)!=='multi') return;
    if(e.inputType==='insertLineBreak' || e.inputType==='insertParagraph'){ if(multiEnter(el)) e.preventDefault(); }
    else if(e.inputType==='deleteContentBackward'){ if(multiBackspace(el)) e.preventDefault(); }
  }, true);
  document.addEventListener('input', e=>{
    if(skipInput) return;
    const el = e.target;
    if(!eligible(el)){ return; }
    if(modeOf(el)==='listonly') return;
    cur = el;
    const mode = modeOf(el);
    show(el, compute(el,false), (mode==='' ));       // list boxes: Enter never silently takes a suggestion
  });
  document.addEventListener('pointerdown', e=>{
    const el = e.target;
    if(el && el.getAttribute && el.getAttribute('data-inputmode-off')){ el.removeAttribute('inputmode'); el.removeAttribute('data-inputmode-off'); }
    if(el && el.getAttribute && modeOf(el)==='listonly' && eligible(el)){ e.preventDefault(); showAllFor(el); return; }
    if(box && box.style.display!=='none' && !(box.contains(el)) && !(el.closest && el.closest('.sbx-arrow'))){
      if(el!==cur) hide();
    }
  }, true);
  document.addEventListener('change', e=>{ if(eligible(e.target) && e.target.value && modeOf(e.target)!=='listonly') learn(e.target.value); });
  document.addEventListener('focusout', ()=>{ setTimeout(()=>{ if(document.activeElement!==cur && !(cur && cur.__sbxArrow)) hide(); }, 150); });
  document.addEventListener('keydown', e=>{
    const el = e.target;
    if(el && el.tagName && modeOf(el)==='multi' && !e.isComposing){
      if(e.key==='Enter'){ if(multiEnter(el)){ e.preventDefault(); e.stopImmediatePropagation(); return; } }
      else if(e.key==='Backspace'){ if(multiBackspace(el)){ e.preventDefault(); return; } }
    }
    if(!box || box.style.display==='none' || e.target!==cur || !items.length) return;
    if(e.key==='ArrowDown'){ active = Math.min(items.length-1, active+1); paint(); e.preventDefault(); }
    else if(e.key==='ArrowUp'){ active = Math.max(0, active-1); paint(); e.preventDefault(); }
    else if(e.key==='Escape'){ hide(); e.preventDefault(); }
    else if(e.key==='Enter' && active>=0){ e.preventDefault(); e.stopImmediatePropagation(); accept(items[active]); }

  if(window.visualViewport){ window.visualViewport.addEventListener('resize', place); window.visualViewport.addEventListener('scroll', place); }
  document.addEventListener('scroll', place, true);
  function showAllFor(el){
    cur = el; el.__sbxArrow = true;
    const list = compute(el, true);
    if(!list.length){ hide(); return; }
    show(el, list, false);
  }
  // The arrow: opens the whole list WITHOUT opening the keyboard.
  window.acToggleAll = function(id){
    const el = document.getElementById(id); if(!el) return;
    if(box && box.style.display!=='none' && cur===el){ hide(); return; }

      if(!el.getAttribute('data-inputmode-off')){ el.setAttribute('data-inputmode-off','1'); el.setAttribute('inputmode','none'); }
    }
    showAllFor(el);
  };

  window.acHide = hide;
})();

<script>
// ===== PIN helpers (identical in Shop Boss and WorkClock) =====
// Not real security: a 4-digit PIN only stops accidents. The PIN is stored scrambled (hashed) wherever it is sent or compared.
function pinHash(p){
  let h1=0xdeadbeef, h2=0x41c6ce57; const s='shopboss-pin-v1:'+String(p);
  for(let i=0,ch;i<s.length;i++){ ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
// Developer PIN (scrambled). TEST VALUE for now — replaced with the developer's real PIN before real use.
const DEV_PIN_HASH = '1rq01qf4qkm';
function pinIsDev(p){ return pinHash(p)===DEV_PIN_HASH; }
// A small PIN window. onOk(pin) returns true to close it, or a text to show as an error.
// opts: {noCancel:true, extraLabel, onExtra}
function pinAsk(title, msg, onOk, opts){
  opts = opts||{};
  const old = document.getElementById('pinOverlay'+(opts.noCancel?'Lock':'')); if(old) old.remove();
  const d = document.createElement('div');
  d.id = 'pinOverlay'+(opts.noCancel?'Lock':'');
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,'+(opts.noCancel?'.94':'.75')+');z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = '<div class="card" style="width:min(380px,100%)"><h3 style="margin:0 0 8px">'+title+'</h3>'
    + (msg?'<p class="sub" style="margin:0 0 12px">'+msg+'</p>':'')
    + '<input id="pinBox" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocomplete="off" placeholder="4-digit PIN" style="width:100%;box-sizing:border-box;font-size:28px;letter-spacing:10px;text-align:center;padding:12px;border-radius:12px;border:1px solid var(--line,#444);background:transparent;color:inherit">'
    + '<p id="pinErr" class="hint" style="color:#e05a5a;min-height:20px;margin:6px 0 0"></p>'
    + '<button class="btn-primary" id="pinOk" style="margin-top:8px">OK</button>'
    + (opts.extraLabel?'<button class="btn-ghost" id="pinExtra" style="margin-top:8px">'+opts.extraLabel+'</button>':'')
    + (opts.noCancel?'':'<button class="btn-ghost" id="pinCancel" style="margin-top:8px">Cancel</button>')+'</div>';
  document.body.appendChild(d);
  const box = d.querySelector('#pinBox'), err = d.querySelector('#pinErr');
  const close = ()=>{ d.remove(); };
  const submit = ()=>{
    const v = box.value.trim();
    if(!/^\d{4}$/.test(v)){ err.textContent = 'Enter 4 digits.'; return; }
    const r = onOk(v);
    if(r===true) close(); else { err.textContent = (typeof r==='string'&&r)?r:'That did not work.'; box.value=''; box.focus(); }
  };
  d.querySelector('#pinOk').onclick = submit;
  box.addEventListener('keydown', e=>{ if(e.key==='Enter') submit(); });
  box.addEventListener('input', ()=>{ box.value = box.value.replace(/\D/g,'').slice(0,4); err.textContent=''; });
  const c = d.querySelector('#pinCancel'); if(c) c.onclick = close;
  const x = d.querySelector('#pinExtra'); if(x) x.onclick = ()=>{ close(); if(opts.onExtra) opts.onExtra(); };
  setTimeout(()=>box.focus(), 50);
  return {close};
}
// Make a new PIN: asks twice. cb(pin) once both match.
function pinCreate(title, msg, cb, opts){
  opts = opts||{};
  pinAsk(title, msg, p1=>{
    setTimeout(()=>pinAsk('Enter it again', 'Type the same 4 digits to confirm.', p2=>{
      if(p2!==p1){ setTimeout(()=>pinCreate(title, 'Those did not match. Try again.', cb, opts), 30); return true; }
      cb(p1); return true;
    }, {noCancel:opts.noCancel}), 30);
    return true;
  }, opts);
}

// ===== Shared tablet mode, employee codes, big name (WorkClock) =====
// All of this lives in its own saved box so it never touches the main WorkClock data.
const WC_SHARED_KEY = 'wc-shared-v1';
let sharedState = {sharedTablet:false, empCodes:{}, shopOwnerPin:null, idleSec:120, bgSec:60};

function ownerOrDevOk(p){ return pinIsDev(p) || (!!sharedState.shopOwnerPin && pinHash(p)===sharedState.shopOwnerPin); }
function empCodeHash(empId, code){ return pinHash('emp:'+empId+':'+code); }

// The owner PIN travels inside the Shop Boss update (scrambled).
const _applyShopUpdate = applyShopUpdate;

  try{ if(payload && typeof payload==='object' && payload.ownerPin){ sharedState.shopOwnerPin = payload.ownerPin; saveShared(); } }catch(e){}
  return _applyShopUpdate.apply(this, arguments);
};

// ---- signing out of the shared tablet ----
function signOutShared(msg){
  if(!sharedState.sharedTablet || !currentEmp) return;
  currentEmp = null; homeClockExpanded = false; homeTaskExpanded = false;
  stack = [{type:'who'}];
  const o = document.getElementById('pinOverlay'); if(o) o.remove();
  render();
  if(msg) showToast(msg);
}
const _clockIn = clockIn, _clockOut = clockOut;
clockIn = function(){ const r = _clockIn.apply(this, arguments); setTimeout(()=>signOutShared('Clocked in — signed out for the next person.'), 400); return r; };
clockOut = function(){ const r = _clockOut.apply(this, arguments); setTimeout(()=>signOutShared('Clocked out — signed out for the next person.'), 400); return r; };
let lastTouch = Date.now(), hiddenAt = 0, graceUntil = 0;
['pointerdown','keydown','scroll','input'].forEach(ev=>document.addEventListener(ev, ()=>{ lastTouch = Date.now(); }, true));
// picking a file / taking a photo sends WorkClock to the background for a moment — don't sign out for that
document.addEventListener('click', e=>{ const t = e.target; if(t && t.tagName==='INPUT' && t.type==='file') graceUntil = Date.now()+180000; }, true);
setInterval(()=>{ if(sharedState.sharedTablet && currentEmp && Date.now()-lastTouch > (sharedState.idleSec||120)*1000) signOutShared('Signed out after '+sharedIdleLabel()+' with no use.'); }, 5000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='hidden'){ hiddenAt = Date.now(); return; }
  if(sharedState.sharedTablet && currentEmp && hiddenAt && Date.now()-hiddenAt > (sharedState.bgSec||60)*1000 && Date.now() > graceUntil) signOutShared();
  lastTouch = Date.now();
});

// ---- picking a name on the shared tablet needs that person's code ----
const _pickEmployee = pickEmployee;
function askEmpCode(id){
  const e = employees.find(x=>x.id===id); if(!e) return;
  pinAsk('Hi '+escText(e.name), 'Enter your 4-digit code.', p=>{
    if(!pinIsDev(p) && empCodeHash(id,p)!==sharedState.empCodes[id]) return 'Wrong code. Try again.';
    _pickEmployee(id); return true;
  }, {extraLabel:'Forgot my code', onExtra:()=>{
    pinAsk('Owner PIN needed', 'Ask the shop owner to enter the owner PIN to reset your code.', op=>{
      if(!ownerOrDevOk(op)) return 'Wrong PIN.';
      setTimeout(()=>makeEmpCode(id), 30); return true;
    });
  }});
}
function makeEmpCode(id){
  const e = employees.find(x=>x.id===id); if(!e) return;
  pinCreate('Make your code, '+escText(e.name), 'Pick 4 digits you will remember. You will use it to sign in on this tablet.', code=>{
    sharedState.empCodes[id] = empCodeHash(id, code); saveShared();
    _pickEmployee(id); showToast('Code saved. You are signed in.');
  });
}
pickEmployee = function(id){
  if(!sharedState.sharedTablet) return _pickEmployee(id);
  if(sharedState.empCodes[id]) askEmpCode(id); else makeEmpCode(id);
};
// a brand-new name typed or tapped on the "Who's clocking in?" screen also gets a code
const _addEmployee = addEmployee;
addEmployee = function(){
  const r = _addEmployee.apply(this, arguments);
  if(sharedState.sharedTablet && currentEmp){ const id = currentEmp; currentEmp = null; stack = [{type:'who'}]; render(); makeEmpCode(id); }
  return r;
};

function sharedIdleLabel(){ const s = sharedState.idleSec||120; return s%60===0 ? (s/60)+(s===60?' minute':' minutes') : s+' seconds'; }
const SHARED_IDLE_CHOICES = [[30,'30 seconds'],[60,'1 minute'],[120,'2 minutes'],[180,'3 minutes'],[300,'5 minutes'],[600,'10 minutes'],[900,'15 minutes'],[1800,'30 minutes']];
const SHARED_BG_CHOICES = [[15,'15 seconds'],[30,'30 seconds'],[60,'1 minute'],[120,'2 minutes'],[300,'5 minutes'],[600,'10 minutes'],[1800,'30 minutes']];
function setSharedTimeout(which, sec){
  sec = parseInt(sec,10); if(!sec) return;
  const label = which==='idle' ? 'no use' : 'the app away';
  pinAsk('Owner PIN', 'Enter the owner PIN to change this setting.', p=>{
    if(!ownerOrDevOk(p)) return 'Wrong PIN.';
    if(which==='idle') sharedState.idleSec = sec; else sharedState.bgSec = sec;
    saveShared(); render(); showToast('Saved.'); return true;
  }, {onCancel:()=>render()});
  setTimeout(render, 0);
}
// ---- settings: turn shared tablet mode on or off ----
function toggleSharedTablet(){
  const turningOn = !sharedState.sharedTablet;
  const note = sharedState.shopOwnerPin ? '' : ' (No update from Shop Boss has been imported yet, so only the developer PIN works for now.)';
  pinAsk('Owner PIN', 'Enter the owner PIN to turn shared tablet mode '+(turningOn?'on':'off')+'.'+note, p=>{
    if(!ownerOrDevOk(p)) return 'Wrong PIN.';
    sharedState.sharedTablet = turningOn; saveShared();
    if(turningOn){ currentEmp = null; stack = [{type:'who'}]; render(); showToast('Shared tablet mode is ON. Everyone signs in with their own code.'); }
    else { render(); showToast('Shared tablet mode is off.'); }
    return true;
  });
}
const _settings = renderers.settings;
renderers.settings = function(){
  return _settings.apply(this, arguments) + `
    <div class="card">
      <p class="theme-subhead" style="margin:0">Shared tablet mode</p>
      <p class="sub" style="margin:6px 0 12px">For a tablet that several people use. WorkClock shows the list of names every time it opens, each person signs in with their own 4-digit code, and it signs them out after they clock in or out, after the times you set below (no use, or the app away). Needs the owner PIN to turn on or off. Currently: <strong>${sharedState.sharedTablet?'ON':'off'}</strong></p>
      <button class="btn-ghost" style="margin-top:0" onclick="toggleSharedTablet()">${sharedState.sharedTablet?'Turn off shared tablet mode':'Turn on shared tablet mode'}</button>
      <div class="field" style="margin-top:14px"><label>Sign out after no touching, typing or scrolling</label>
        <select id="sharedIdleSel" onchange="setSharedTimeout('idle', this.value)">${SHARED_IDLE_CHOICES.map(c=>`<option value="${c[0]}" ${(sharedState.idleSec||120)===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
      <div class="field"><label>Sign out when the app was away or the screen was off for</label>
        <select id="sharedBgSel" onchange="setSharedTimeout('bg', this.value)">${SHARED_BG_CHOICES.map(c=>`<option value="${c[0]}" ${(sharedState.bgSec||60)===c[0]?'selected':''}>${c[1]}</option>`).join('')}</select></div>
      <p class="hint" style="margin:0">Changing either one needs the owner PIN. Taking a photo or picking a file gets 3 extra minutes.</p>
    </div>`;
};

// ---- big "who is this" name on the home screen ----
const _home = renderers.home;
renderers.home = function(){
  const me = employees.find(e=>e.id===currentEmp) || {};
  return `<div style="text-align:center;margin:2px 0 10px"><div class="hint" style="margin:0">Working as</div><div style="font-family:var(--display);font-size:34px;line-height:1.1;color:var(--accent)">${escText(me.name||'')}</div></div>` + _home.apply(this, arguments);
};

// ---- My picture: take one, not just choose one ----
const _myPicture = renderers.myPicture;
renderers.myPicture = function(){
  let h = _myPicture.apply(this, arguments);
  const me = employees.find(e=>e.id===currentEmp) || {};
  const cam = `<input type="file" id="myPicCam" accept="image/*" capture="user" style="display:none" onchange="setEmployeePicture('${currentEmp}', this.files[0])">
    <button class="btn-ghost" onclick="document.getElementById('myPicCam').click()">Take a picture</button>`;
  return h.replace('<button class="btn-ghost" onclick="goBack()">Done</button>', cam + '<button class="btn-ghost" onclick="goBack()">Done</button>');
};

// ---- start-up: on a shared tablet nobody stays signed in ----
if(sharedState.sharedTablet){ currentEmp = null; stack = [{type:'who'}]; render(); }

</script>
<!--MB-BEGIN-->
<script>
// ===== Shop mailbox (wireless) - shared by Shop Boss and WorkClock =====
// The mailbox is a small program on a computer in the shop (later a Raspberry Pi). The apps drop
// messages in it and pick messages up from it. Nothing here needs the internet, only the shop Wi-Fi.
window.MB = (function(){
  const K_ADDR='mb-addr', K_OUT='mb-outbox', K_SEEN='mb-seen', K_DEV='mb-device', K_BAK='mb-last-backup';
  const st = { role:'', peerLabel:'', nameFn:function(){return '';}, online:null, lastOk:0, lastErr:'', pending:[], busy:false, onChange:function(){} };
  const lsGet=(k,d)=>{ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } };
  const lsSet=(k,v)=>{ try{ localStorage.setItem(k,v); }catch(e){} };
  const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const isNative = ()=>!!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());

  function deviceId(){ let d=lsGet(K_DEV,''); if(!d){ d='d'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); lsSet(K_DEV,d); } return d; }
  function addr(){ return lsGet(K_ADDR,'').trim(); }
  function setAddr(a){ lsSet(K_ADDR, String(a||'').trim()); st.online=null; st.lastErr=''; }
  function base(){
    let a = addr(); if(!a) return '';
    if(!/^https?:\/\//i.test(a)) a = 'http://'+a;
    if(!/:\d+(\/|$)/.test(a.replace(/^https?:\/\//i,''))) a = a.replace(/\/+$/,'')+':8765';
    return a.replace(/\/+$/,'');
  }
  // The hosted iPhone page is a secure (https) page, which the phone will not let talk to a plain shop address.
  function unsupported(){ return location.protocol==='https:' && !isNative(); }

  async function req(method, path, body, ms){
    if(unsupported()) throw {code:'unsupported'};
    const b = base(); if(!b) throw {code:'noaddr'};
    const ctl = (typeof AbortController!=='undefined') ? new AbortController() : null;
    const t = setTimeout(()=>{ try{ ctl && ctl.abort(); }catch(e){} }, ms||8000);
    try{
      const opt = {method, cache:'no-store'};
      if(ctl) opt.signal = ctl.signal;
      if(body!==undefined){ opt.body = JSON.stringify(body); opt.headers = {'Content-Type':'text/plain'}; }
      const r = await fetch(b+path, opt);
      let j = null; try{ j = await r.json(); }catch(e){}
      if(!r.ok || !j || j.ok===false) throw {code:'bad', status:r.status, error:(j&&j.error)||''};
      st.online = true; st.lastOk = Date.now(); st.lastErr = '';
      return j;
    }catch(e){
      if(e && e.code){ if(e.code!=='bad') st.online=false; throw e; }
      st.online = false; st.lastErr = String((e&&e.message)||e);
      throw {code:'offline', error:st.lastErr};
    }finally{ clearTimeout(t); }
  }

  // ---- stored payloads (can be large) live in IndexedDB; the small list lives in localStorage ----
  const memStore = {};
  function idb(){ return new Promise((res,rej)=>{ try{ const r=indexedDB.open('mb-data',1); r.onupgradeneeded=()=>r.result.createObjectStore('p'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){ rej(e); } }); }
  async function putP(k,v){ try{ const db=await idb(); await new Promise((res,rej)=>{ const tx=db.transaction('p','readwrite'); tx.objectStore('p').put(v,k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){ memStore[k]=v; } }
  async function getP(k){ try{ const db=await idb(); return await new Promise((res,rej)=>{ const tx=db.transaction('p','readonly'); const q=tx.objectStore('p').get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }); }catch(e){ return memStore[k]; } }
  async function delP(k){ try{ const db=await idb(); await new Promise((res,rej)=>{ const tx=db.transaction('p','readwrite'); tx.objectStore('p').delete(k); tx.oncomplete=res; tx.onerror=()=>rej(tx.error); }); }catch(e){} delete memStore[k]; }

  function outbox(){ try{ return JSON.parse(lsGet(K_OUT,'[]'))||[]; }catch(e){ return []; } }
  function saveOut(l){ lsSet(K_OUT, JSON.stringify(l.slice(-200))); }
  function seen(){ try{ return JSON.parse(lsGet(K_SEEN,'[]'))||[]; }catch(e){ return []; } }
  function markSeen(id){ const l=seen(); if(!l.includes(id)){ l.push(id); lsSet(K_SEEN, JSON.stringify(l.slice(-500))); } }
  function isSeen(id){ return seen().includes(id); }

  async function queue(kind, to, name, text, label, meta){
    const id = 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    await putP('msg:'+id, text);
    const l = outbox();
    const it = {id, kind, to, name, label:label||name, createdAt:new Date().toISOString(), status:'waiting', sentAt:null, ackedBy:[], meta:meta||{}};
    l.push(it); saveOut(l);
    return it;
  }
  function removeItem(id){ saveOut(outbox().filter(x=>x.id!==id)); delP('msg:'+id); }

  // Try to send everything that is waiting. Stops at the first "can't reach it".
  async function flush(){
    if(st.busy) return {sent:0, waiting:outbox().filter(x=>x.status==='waiting').length};
    st.busy = true; let sent = 0;
    try{
      for(;;){
        const l = outbox(); const it = l.find(x=>x.status==='waiting'); if(!it) break;
        const text = await getP('msg:'+it.id);
        if(typeof text!=='string'){ it.status='sent'; it.error='lost'; saveOut(l); continue; }
        try{
          await req('POST','/send',{id:it.id, to:it.to, kind:it.kind, from:deviceId(), fromName:st.nameFn(), device:deviceId(), name:it.name, data:text, sentAt:it.createdAt, meta:it.meta}, 180000);
        }catch(e){ if(e&&e.code==='bad'){ it.error=e.error||'rejected'; it.status='failed'; saveOut(l); continue; } break; }
        const l2 = outbox(); const j = l2.find(x=>x.id===it.id);
        if(j){ j.status='sent'; j.sentAt=new Date().toISOString(); saveOut(l2); }
        delP('msg:'+it.id); sent++;
      }
      await flushBackup();
    }finally{ st.busy = false; }
    st.onChange();
    return {sent, waiting:outbox().filter(x=>x.status==='waiting').length};
  }

  // Backups go straight to the server's backup folder. Only the newest one that could not go is kept for later.
  async function backup(app, name, who, text){
    if(unsupported() || !base()) return false;
    const b = {app, name, who:who||'', device:deviceId(), savedAt:new Date().toISOString(), data:text};
    try{ await req('POST','/backup', b, 180000); lsSet(K_BAK, b.savedAt); await delP('bak:'+app+':'+name); st.onChange(); return true; }
    catch(e){ await putP('bak:'+app+':'+name, b); const keys = JSON.parse(lsGet('mb-bak-keys','[]')); if(!keys.includes('bak:'+app+':'+name)){ keys.push('bak:'+app+':'+name); lsSet('mb-bak-keys', JSON.stringify(keys.slice(-6))); } return false; }
  }
  async function flushBackup(){
    let keys = []; try{ keys = JSON.parse(lsGet('mb-bak-keys','[]')); }catch(e){}
    const left = [];
    for(const k of keys){
      const b = await getP(k); if(!b) continue;
      try{ await req('POST','/backup', b, 180000); lsSet(K_BAK, new Date().toISOString()); await delP(k); }catch(e){ left.push(k); if(e&&e.code!=='bad') { left.push(...keys.slice(keys.indexOf(k)+1)); break; } }
    }
    lsSet('mb-bak-keys', JSON.stringify([...new Set(left)]));
  }

  // Which of the messages I sent has the other side picked up and imported?
  async function checkSent(){
    const l = outbox(); const ids = l.filter(x=>x.status==='sent' || x.status==='received').filter(x=>x.kind!=='backup').map(x=>x.id).slice(-60);
    if(!ids.length) return;
    let r; try{ r = await req('GET','/status?ids='+ids.join(',')); }catch(e){ return; }
    let changed = false; const l2 = outbox();
    l2.forEach(it=>{
      const s = r.status && r.status[it.id]; if(!s || !s.have) return;
      const names = Object.keys(s.acks||{}).map(k=>s.acks[k].name||'').filter(Boolean);
      const n = Object.keys(s.acks||{}).length;
      if(n && (it.status!=='received' || (it.ackedBy||[]).length!==n)){ it.status='received'; it.ackedBy = names.length?names:new Array(n).fill(''); changed = true; }
    });
    if(changed){ saveOut(l2); st.onChange(); }
  }

  async function ping(){ const j = await req('GET','/ping', undefined, 4000); return j; }
  async function inbox(){
    const j = await req('GET','/inbox?to='+encodeURIComponent(st.role)+'&device='+encodeURIComponent(deviceId()));
    st.pending = (j.items||[]).filter(x=>!isSeen(x.id)); return st.pending;
  }
  async function message(id){ const j = await req('GET','/message?id='+encodeURIComponent(id), undefined, 120000); return j.message; }
  async function ack(id, name){ try{ await req('POST','/ack',{id, device:deviceId(), name:name||st.nameFn()}); return true; }catch(e){ return false; } }

  // ---- small screens: toast, banner, sheet ----
  let toastEl = null, toastT = 0;
  function toast(msg){
    if(!toastEl){ toastEl = document.createElement('div'); toastEl.style.cssText='position:fixed;left:12px;right:12px;bottom:24px;z-index:100001;background:#222;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.5)'; document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.style.display='block'; clearTimeout(toastT); toastT = setTimeout(()=>{ toastEl.style.display='none'; }, 5000);
  }
  function banner(key, text, label, fn){
    let d = document.getElementById('mbBanner');
    if(!text){ if(d) d.remove(); return; }
    if(!d){ d = document.createElement('div'); d.id='mbBanner'; d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:9000;background:var(--accent,#2a7);color:#fff;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:14px;box-shadow:0 2px 12px rgba(0,0,0,.5)'; document.body.appendChild(d); }
    d.dataset.key = key;
    d.innerHTML = '<span style="flex:1">'+esc(text)+'</span><button id="mbBannerGo" style="background:#fff;color:#000;border:0;border-radius:8px;padding:8px 12px;font-weight:700">'+esc(label)+'</button><button id="mbBannerX" aria-label="Hide" style="background:transparent;color:#fff;border:0;font-size:20px;padding:4px 8px">×</button>';
    d.querySelector('#mbBannerGo').onclick = ()=>{ fn(); };
    d.querySelector('#mbBannerX').onclick = ()=>{ d.remove(); };
  }
  let sheetEl = null, sheetRes = null;
  function closeSheet(){ if(!sheetEl) return false; const r=sheetRes; sheetEl.remove(); sheetEl=null; sheetRes=null; if(r) r(null); return true; }
  function sheet(o){
    closeSheet();
    return new Promise(res=>{
      const d = document.createElement('div'); d.id='mbSheet';
      d.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:100000;display:flex;align-items:center;justify-content:center;padding:16px';
      let h = '<div class="card" style="width:min(400px,100%);max-height:90vh;overflow:auto"><h3 style="margin:0 0 6px">'+esc(o.title||'')+'</h3>';
      if(o.notice) h += '<p style="margin:0 0 10px;padding:10px;border-radius:10px;background:rgba(224,90,90,.15);color:#ffb4b4;font-size:14px">'+esc(o.notice)+'</p>';
      if(o.sub) h += '<p class="sub" style="margin:0 0 12px">'+esc(o.sub)+'</p>';
      (o.buttons||[]).forEach((b,i)=>{ h += '<button class="'+(b.primary?'btn-primary':'btn-ghost')+'" data-i="'+i+'" style="margin-top:8px;width:100%">'+esc(b.label)+'</button>'; });
      if(o.cancel!==false) h += '<button class="btn-ghost" data-i="-1" style="margin-top:8px;width:100%">'+esc(o.cancelLabel||'Cancel')+'</button>';
      h += '</div>'; d.innerHTML = h;
      const done = v=>{ if(sheetEl===d){ sheetEl=null; sheetRes=null; } d.remove(); res(v); };
      d.addEventListener('click', ev=>{ const b = ev.target.closest && ev.target.closest('button'); if(!b){ if(ev.target===d) done(null); return; } const i=+b.getAttribute('data-i'); done(i<0?null:o.buttons[i].value); });
      sheetEl = d; sheetRes = res; document.body.appendChild(d);
    });
  }

  // ---- "send straight" from a Send menu. Returns {ok:true,state} or {ok:false,message} ----
  async function trySend(kind, to, name, text, label, meta){
    if(unsupported()) return {ok:false, message:'Sending straight to the mailbox is not available on this device (the iPhone web version). Use Share or Save instead.'};
    if(!base()) return {ok:false, message:'No mailbox server is set up yet. Try another way.'};
    const it = await queue(kind, to, name, text, label, meta);
    const r = await flush();
    const now = outbox().find(x=>x.id===it.id);
    if(now && now.status!=='waiting') return {ok:true, state:'sent', item:now};
    const c = await sheet({title:"Can't find the mailbox server", sub:'Are you on the shop Wi-Fi? You can keep this waiting. It goes out by itself when the server is found again. Or go back and try another way.',
      buttons:[{label:'Keep it waiting', value:'wait', primary:true}], cancelLabel:'Try another way'});
    if(c==='wait') return {ok:true, state:'waiting', item:now||it};
    removeItem(it.id);
    return {ok:false, message:"Can't find the mailbox server. Try another way."};
  }

  // ---- text for the status lists ----
  function statusText(it){
    if(it.kind==='backup') return 'Backed up to the mailbox server';
    if(it.status==='waiting') return 'Waiting. Not sent yet, goes out when the server is found';
    if(it.status==='failed') return 'The server did not accept it';
    if(it.status==='received'){
      const names = (it.ackedBy||[]).filter(Boolean);
      return 'Received by '+(names.length?names.join(', '):st.peerLabel);
    }
    return 'Sent. Waiting for '+st.peerLabel;
  }
  function outboxHTML(){
    const l = outbox().filter(x=>x.kind!=='backup').slice(-12).reverse();
    if(!l.length) return '<p class="list-sub" style="margin:4px 0 0">Nothing sent through the mailbox yet.</p>';
    return l.map(it=>'<div class="row" style="cursor:default"><div style="flex:1;min-width:0"><div class="row-title">'+esc(it.label)+'</div><div class="row-meta">'+esc(statusText(it))+' · '+esc(new Date(it.createdAt).toLocaleString())+'</div></div><button class="btn-ghost chip-btn" style="flex:none" aria-label="Remove" onclick="MB.askRemove(\''+esc(it.id)+'\')">Remove</button></div>').join('');
  }
  // Remove an item from the list. A waiting item will never be sent once removed.
  async function askRemove(id){
    const it = outbox().find(x=>x.id===id); if(!it) return;
    let sub;
    if(it.status==='waiting' || it.status==='failed'){
      sub = st.role==='wc'
        ? 'This has NOT been sent and will not be sent. The hours in it will not reach Shop Boss unless you send them another way.'
        : 'This has NOT been sent and will not be sent. Employees will not get it. Send a new update when you are ready.';
    } else {
      sub = 'This only removes it from this list. It does not take back anything that was already sent.';
    }
    const v = await sheet({title:'Remove this?', sub: it.label+'. '+sub, buttons:[{label:'Yes, remove it', value:'yes', primary:true}], cancelLabel:'Keep it'});
    if(v!=='yes') return;
    removeItem(id); toast('Removed.'); st.onChange();
  }
  function connText(){
    if(unsupported()) return 'Not available on this device (iPhone web version)';
    if(!base()) return 'Not set up';
    if(st.online===true) return 'Server found';
    if(st.online===false) return "Can't find the server";
    return 'Not checked yet';
  }
  async function uiTest(){
    const el = document.getElementById('mbAddr'); if(el) setAddr(el.value);
    if(unsupported() || !base()){ toast(unsupported()?'Not available on this device.':'Type the mailbox address first.'); st.onChange(); return; }
    toast('Looking for the mailbox server...');
    try{ await ping(); toast('Server found.'); flush(); }catch(e){ toast("Can't find the server."); }
    st.onChange();
  }
  function uiSave(){ const el = document.getElementById('mbAddr'); if(el){ setAddr(el.value); toast(el.value.trim()?'Mailbox address saved.':'Mailbox address cleared.'); st.onChange(); } }
  function addrCardHTML(){
    return '<p class="list-sub" style="margin:4px 0 10px">The mailbox is a small program on a computer in the shop. Type its address here, like 192.168.1.50 (the program prints it when it starts). Your '+(st.role==='wc'?'phone':'tablet')+' must be on the shop Wi-Fi.</p>'
      +'<input id="mbAddr" class="search-input" placeholder="Mailbox address" value="'+esc(addr())+'" inputmode="url" autocapitalize="off" autocomplete="off" onchange="MB.setAddr(this.value)" style="width:100%;box-sizing:border-box">'
      +'<p class="list-sub" style="margin:8px 0">Status: <b>'+esc(connText())+'</b></p>'
      +'<button class="btn-ghost" style="width:100%" onclick="MB.uiSave()">Set address</button>'
      +'<button class="btn-primary" style="width:100%;margin-top:8px" onclick="MB.uiTest()">Test connection</button>';
  }

  let timer = 0;
  function init(o){
    st.role = o.role; st.peerLabel = o.peerLabel; st.nameFn = o.nameFn || st.nameFn; st.onChange = o.onChange || st.onChange; st.onPoll = o.onPoll || function(){};
  }
  async function cycle(){
    if(unsupported() || !base()) return;
    try{ await flush(); await checkSent(); const items = await inbox(); await st.onPoll(items); }catch(e){}
    st.onChange();
  }
  function start(){
    setTimeout(cycle, 2500);
    clearInterval(timer); timer = setInterval(()=>{ if(!document.hidden) cycle(); }, 30000);
    document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(cycle, 600); });
    window.addEventListener('online', ()=>setTimeout(cycle, 600));
  }

  return {st, init, start, cycle, addr, setAddr, base, unsupported, req, ping, inbox, message, ack, markSeen, isSeen, queue, flush, backup, checkSent, trySend,
          outbox, removeItem, askRemove, sheet, closeSheet, banner, toast, outboxHTML, addrCardHTML, connText, statusText, uiTest, uiSave, deviceId, esc, isNative,
          lastBackup:()=>lsGet(K_BAK,'')};
})();

</script>
<script>
// ===== Shop mailbox + Home Screen tip (WorkClock) =====
function wcMbWho(){ const n = employees.map(e=>e.name).filter(Boolean); return n.length>3 ? n.slice(0,3).join(', ')+'...' : n.join(', '); }
function wcMbAckName(){
  if(employees.length===1) return employees[0].name;
  if(typeof sharedState!=='undefined' && sharedState.sharedTablet) return 'the shop tablet';
  const e = employees.find(x=>x.id===currentEmp); return e ? e.name : 'a phone';
}
let wcMbSig = '';
function wcMbRefresh(force){
  try{
    const sig = JSON.stringify([MB.outbox().map(x=>x.id+x.status+(x.ackedBy||[]).length), MB.st.online, MB.st.pending.length, MB.addr()]);
    if(!force && sig===wcMbSig) return; wcMbSig = sig;
    const a = document.activeElement; if(a && (a.tagName==='INPUT'||a.tagName==='TEXTAREA'||a.tagName==='SELECT')) return;
    const t = (stack[stack.length-1]||{}).type;
    if(t==='settings' || t==='home') render();
  }catch(e){}
}
function wcMbOnPoll(items){
  const ups = items.filter(i=>i.kind==='update');
  if(!ups.length){ if(document.getElementById('mbBanner') && document.getElementById('mbBanner').dataset.key==='upd') MB.banner('','',''); return; }
  MB.banner('upd', ups.length===1 ? 'New update from Shop Boss.' : ups.length+' new updates from Shop Boss.', 'Import', wcMbImportUpdates);
}
async function wcMbImportUpdates(){
  const ups = MB.st.pending.filter(i=>i.kind==='update'); let n = 0;
  for(const it of ups){
    try{
      const m = await MB.message(it.id); const payload = JSON.parse(m.data);
      applyShopUpdate(payload);
      await MB.ack(it.id); MB.markSeen(it.id); n++;
    }catch(e){ MB.toast("Couldn't get the update. Try again when the shop mailbox is found."); break; }
  }
  MB.st.pending = MB.st.pending.filter(i=>!MB.isSeen(i.id));
  if(!MB.st.pending.some(i=>i.kind==='update')) MB.banner('','','');
  wcMbRefresh(true);
}
MB.init({role:'wc', peerLabel:'Shop Boss', nameFn:wcMbAckName, onChange:()=>wcMbRefresh(false), onPoll:wcMbOnPoll});

// ---- the send menu: "Send straight to Shop Boss (mailbox)" next to the old ways ----
window.mbRoutable = function(fname){
  return (/^workclock-.*\.json$/.test(fname) && !/backup/i.test(fname)) ? {kind:'week', to:'shopboss', target:'Shop Boss'} : null;
};
window.mbDoSend = async function(fname, text){
  let label = fname, meta = {};
  try{ const p = JSON.parse(text); label = 'Hours: '+(p.employee||'')+', week of '+(p.weekOf||''); meta = {employee:p.employee||'', weekOf:p.weekOf||''}; }catch(e){}
  return MB.trySend('week','shopboss',fname,text,label,meta);
};
const _wcMbShare = shareOrSaveFile;
shareOrSaveFile = async function(fname, jsonText, shareTitle, shareText){
  if(!window.mbRoutable(fname)) return _wcMbShare.apply(this, arguments);
  let notice = '';
  for(;;){
    const v = await MB.sheet({title:'Send your hours', sub:'Pick how to get this week to Shop Boss.', notice,
      buttons:[{label:'Send straight to Shop Boss (mailbox)', value:'mailbox', primary:true}, {label:'Share or save a file...', value:'file'}]});
    if(v===null) return 'declined';
    if(v==='file') return _wcMbShare(fname, jsonText, shareTitle, shareText);
    const r = await window.mbDoSend(fname, jsonText);
    if(r.ok){ window.__mbLast = r; return 'mailbox'; }
    notice = r.message;
  }
};

// ---- backups also go to the mailbox server (when there is one) ----
function wcMbBackupName(){
  const who = (employees[0] ? employees[0].name : 'phone').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'phone';
  return 'workclock-'+who+'_'+MB.deviceId().slice(-6)+'-'+todayISO()+'.json';
}
let wcMbLastBak = 0;
window.__mbBackupMade = function(name, text, force){
  if(!force && Date.now()-wcMbLastBak < 15*60*1000) return;
  wcMbLastBak = Date.now();
  MB.backup('wc', wcMbBackupName(), wcMbWho(), text);
};
const _wcMbQB = quickBackup;
quickBackup = async function(){
  const r = await _wcMbQB.apply(this, arguments);
  try{ if(!MB.isNative()){ window.__mbBackupMade('', JSON.stringify({app:'WorkClock', kind:'backup', version:1, savedAt:new Date().toISOString(), data:{employees, dayClocks, entries, documents, completedDocs, photos, photoRequests}}, null, 2), true); } }catch(e){}
  return r;
};

// ---- Home Screen tip for iPhone / iPad (only when it is open in Safari and not yet on the Home Screen) ----
function wcIosTipNeeded(){
  const ua = navigator.userAgent||'';
  const ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints>1);
  const standalone = window.navigator.standalone===true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  return ios && !standalone && !MB.isNative();
}
function wcIosTipHidden(){ try{ return localStorage.getItem('wc-ios-tip-hide')==='1'; }catch(e){ return false; } }
function wcIosTipHide(){ try{ localStorage.setItem('wc-ios-tip-hide','1'); }catch(e){} render(); }
function wcIosTipHTML(withHide){
  return `<div class="card" style="border-color:var(--accent)">
    <p class="theme-subhead" style="margin:0">Add WorkClock to your Home Screen</p>
    <p class="sub" style="margin:6px 0 8px">Do this once, so your hours stay safe on this phone:</p>
    <ol class="sub" style="margin:0 0 10px 18px;padding:0;line-height:1.5">
      <li>Open this page in <b>Safari</b> (not inside another app).</li>
      <li>Tap the <b>Share</b> button (the square with an arrow pointing up).</li>
      <li>Scroll down and tap <b>Add to Home Screen</b>, then tap <b>Add</b>.</li>
      <li>From now on, open WorkClock from the new icon on your Home Screen.</li>
    </ol>
    <p class="sub" style="margin:0 0 6px"><b>Why:</b> Safari can erase a website's saved data after about a week of not opening it, unless it is on your Home Screen. The icon also opens WorkClock like a normal app, even with no internet.</p>
    <p class="sub" style="margin:0 0 10px">Still tap <b>Back up now</b> in Settings once in a while.</p>
    ${withHide?'<button class="btn-ghost" style="margin-top:0" onclick="wcIosTipHide()">Hide this tip</button>':''}
  </div>`;
}

// ---- screens ----
const _wcMbSettings = renderers.settings;
renderers.settings = function(){
  let h = _wcMbSettings.apply(this, arguments);
  h += `<div class="card">
      <p class="theme-subhead" style="margin:0">Shop mailbox</p>
      ${MB.addrCardHTML()}
      <p class="theme-subhead" style="margin:16px 0 6px">Sent through the mailbox</p>
      ${MB.outboxHTML()}
      <p class="list-sub" style="margin:10px 0 0">Last backup copied to the mailbox server: <b>${MB.lastBackup()?new Date(MB.lastBackup()).toLocaleString():'none yet'}</b></p>
    </div>`;
  if(wcIosTipNeeded()) h += wcIosTipHTML(false);
  return h;
};
const _wcMbHome = renderers.home;
renderers.home = function(){
  let extra = '';
  if(wcIosTipNeeded() && !wcIosTipHidden()) extra += wcIosTipHTML(true);
  const w = MB.outbox().filter(x=>x.status==='waiting').length;
  if(w) extra += `<div class="card" style="border-color:#c9a227"><p class="sub" style="margin:0"><b>${w} message${w===1?'':'s'} waiting to send.</b> ${w===1?'It goes':'They go'} out by itself when this phone finds the shop mailbox on the shop Wi-Fi.</p></div>`;
  const last = MB.outbox().filter(x=>x.kind==='week').slice(-1)[0];
  if(last && Date.now()-Date.parse(last.createdAt) < 3*86400000 && !w) extra += `<p class="hint" style="margin:0 0 8px;text-align:center">Last hours sent: ${MB.esc(MB.statusText(last))}</p>`;
  return extra + _wcMbHome.apply(this, arguments);
};
MB.start();

if('serviceWorker' in navigator){ window.addEventListener('load',function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
</script>
<!--MB-END-->
</body>

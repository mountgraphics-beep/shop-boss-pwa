<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  /* Layout: one column, phone-first, single running screen at a time — mirrors Shop Boss's stack navigation so it reads as the same family of app */
  :root{
    --bg:#0B0B0C; --surface:#17181A; --surface-2:#1F2123; --line:#2C2E31;
    --text:#ECEDEE; --muted:#8A8D91; --accent:#2BC4BB; --accent-dim:#155F59; --accent-tint:#112420;
    --good:#2EA85B; --warn:#E0A03A;
    --sans:'Work Sans',-apple-system,'Segoe UI',sans-serif;
    --display:'Oswald',var(--sans);
    color-scheme:dark;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  [hidden]{display:none!important}
  header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;align-items:center;gap:10px}
  header .logo-wrap{display:flex;align-items:center;gap:11px;line-height:0;cursor:pointer}
  header .brand{height:34px;display:block;border-radius:5px}
  header .wordmark{font-family:var(--display);font-size:26px;font-weight:600;letter-spacing:.01em;line-height:1.1;white-space:nowrap}
  header .wordmark em{font-style:normal;color:var(--accent)}
  header .version{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:0.4px;color:#fff;background:rgba(0,0,0,0.3);padding:2px 6px;border-radius:4px;margin-left:2px;align-self:flex-end}
  .emp-av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;overflow:hidden;background:#222;flex:none;vertical-align:middle;font-weight:700;color:var(--muted)}
  .emp-av img{width:100%;height:100%;object-fit:cover;display:block}
  header .who{margin-left:auto;color:var(--muted);font-size:13px;display:flex;align-items:center;gap:8px;cursor:pointer}
  main{max-width:480px;margin:0 auto;padding:24px 20px 90px;min-height:calc(100% - 56px)}
  footer{max-width:480px;margin:0 auto;padding:0 20px 30px;color:var(--muted);font-size:12px;text-align:center}
  h2.title{font-family:var(--display);font-size:26px;font-weight:600;margin:0 0 4px}
  p.sub{color:var(--muted);font-size:14.5px;margin:0 0 26px;line-height:1.5}
  .chips{display:flex;flex-wrap:wrap;gap:10px}
  .chip{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:12px 18px;font-size:15px;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px}
  .chip:active{border-color:var(--accent-dim);background:var(--surface-2)}
  .chip.add{border-style:dashed;color:var(--muted)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
  .card + .card{margin-top:14px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.04em}
  .field input[type=text], .field textarea, select, input[type=time]{width:100%;background:var(--surface-2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:12px 14px;font-family:var(--sans);font-size:15px;color-scheme:dark}
  .field input[type=text]:focus, .field textarea:focus, select:focus, input[type=time]:focus{outline:none;border-color:var(--accent)}

<script>
// Bump this with every shipped change — shows in the header badge and the browser tab title
// (which is what a manual "Save As" download defaults its filename to), so there's always one
// place that says what version is actually running.
const APP_VERSION = 'v0.30';
document.title = 'WorkClock ' + APP_VERSION;
(function(){ try{ var b=document.getElementById('appVersionBadge'); if(b) b.textContent=APP_VERSION; }catch(e){} })();
// ---------------------------------------------------------------------------
// Data model. WorkClock never reads Shop Boss's data and never writes to it
// directly — "Submit work week" is a one-way hand-off (a file today; a local
// wireless drop once the shop has its own network), never a live connection.
//
// Two separate timers, on purpose:
//  - the DAY clock: clock in when you arrive, clock out when you leave.
//  - the TASK clock: started fresh for each car/task while clocked in for
//    the day; ending a task never touches the day clock.
// ---------------------------------------------------------------------------
let employees = [];               // {id, name}
let dayClocks = [];               // {id, empId, date, clockedInAt, clockedOutAt|null}
let entries = [];                 // {id, empId, empName, car, task, desc, consumables, date, hours, startedAt, endedAt, weekId, submitted}
let active = null;                // {empId, car, task, startedAt} — the one running TASK clock, if any
let currentEmp = null;            // id of whoever has the app in front of them right now
let documents = [];               // {id, name, scope:'general'|'employee', empId, empName, fileName, mime, dataUrl, note, receivedAt} — BLANK forms Shop Boss sends in a weekly update
let completedDocs = [];            // {id, templateId, templateName, car, empId, date, weekId, fileName, dataUrl, submitted, completedAt} — a FILLED-OUT copy of one of the above
let photos = [];                   // {id, dataUrl, fileName, empId, car, entryId, requestId, date, weekId, submitted, takenAt}
let photoRequests = [];            // {id, note, scope:'general'|'employee'|'car', empId, empName, car, receivedAt, fulfilled} — Shop Boss asking for a photo
let pendingPhoto = null;           // {dataUrl, fileName} — a photo just captured/picked with no task in mind yet (not persisted)
let pendingAttachTarget = null;    // {entryId, car} — which task a photo taken via the paperclip should attach to (not persisted)
let lastUpdateAt = null;          // ISO timestamp of the last Shop Boss update this device received
let backupFolderConfigured = false; // has ANYONE on this device already picked a backup folder? (device-wide, not per-employee)
let backupFolderName = null;      // display name of that folder, e.g. "WorkClock Backups"
let backupDirHandle = null;       // the live FileSystemDirectoryHandle — reloaded from IndexedDB on startup, re-linked via re-picking if permission is lost
let submittedFolderName = null;   // display name of the folder submitted work weeks are copied into, e.g. "WorkClock/Submitted Weeks"
let submittedDirHandle = null;    // the live FileSystemDirectoryHandle for that folder — same IndexedDB-backed pattern as backupDirHandle
let darrenEmail = null;           // optional — if set, Submit also opens the email app addressed to this, as a third way the file can get to Shop Boss
// Which day starts the work week — Shop Boss OWNS this setting (its own Settings screen, key 'sb-week-start',
// short codes 'Mon'..'Sun', default 'Mon'). WorkClock has no such setting of its own on purpose: this always
// has to match whatever Shop Boss is set to, or the two apps slice weeks up differently and nothing reconciles.
// Until the weekly-update file actually carries this value over, it stays at the same 'Mon' default Shop Boss
// starts with — once the update format includes it, applyShopUpdate() below sets this from payload.weekStart.
let weekStartDay = 'Mon';
let weekEndDay = null;      // set by Shop Boss: last day of the work week (null = never told: Mon-Fri assumed for alerts)
let shopPhotos = [];        // {id, empId|null, car, caption, dataUrl} - photos Shop Boss sent; replaced on every update
const WEEK_DAY_CODES = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
// What Shop Boss's latest update said is currently in the shop — refreshed (not accumulated) every
// time a new update arrives, since it's meant to reflect "right now," not a permanent car roster.
let fmTmplName = '';
let shopLibrary = [];          // every word on every Shop Boss list, for autocomplete
let deviceId = '';              // this phone/tablet's own label, so Shop Boss can tell two devices apart
let shopTodos = [];            // [{carName, jobs:[{id,text}]}] — what's next, from Shop Boss
let todoDone = [];             // job ids this employee already did (saved on this device)
let shopShowNotes = true;      // Shop Boss decides whether the Notes box shows
let shopCars = [];            // {id, name, thumbDataUrl}
let shopBossEmployees = [];   // {id, name} — Shop Boss's own employee records, for matching by ID instead of fuzzy name text
let shopNotesHelper = [];     // quick words for the Notes box's + button, sent by Shop Boss in every update (may be empty)
let shopConsumables = [];     // ['Primer', 'Brake fluid', ...] — Darren's common-supplies list, for the "running low on" picker
let shopTaskMode = 'multi';
let shopWorkTypes = [];       // ['Oil change', 'Brake work', ...] — Darren's work-types list from Shop Boss; falls back to TASK_PRESETS below until the first update arrives
let shopConsumablesMandatory = false; // no longer used — nothing is "required" except the Task
// Darren's own custom lists (built in Shop Boss's Lists/Settings pages), sent down only when he's
// marked that particular list "Included" for this update. Each one auto-renders its own combo-box
// field on every task-entry screen below — no code change needed here when he adds a new list.
let shopPickLists = [];       // [{id, name, items:[...], mandatory:bool}, ...] — a snapshot, refreshed on every update
let employeeNotes = [];       // {id, text, empId, receivedAt, dismissed} — a plain note from Darren for one employee, not tied to a car or form
let stack = [{type:'who'}];
let timerHandle = null;
let pendingConfirm = null;

const TASK_PRESETS = ['Diagnosis','Oil change','Brake work','Bodywork / filler','Paint','Electrical','Engine work','Interior','Test drive','Parts pickup','Cleanup / detail'];
// Once Shop Boss has sent its own work-types list, that's what drives the picker instead of the
// fixed defaults above — same "Darren's list wins once it exists" rule used for cars and employees.
function currentTaskPresets(){ return shopWorkTypes.length ? shopWorkTypes : TASK_PRESETS; }
const LONG_DAY_HOURS = 10;   // nudge if a day shift looks this long
const LONG_TASK_HOURS = 6;   // nudge if a single task looks this long

function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
// A JS string literal safe to embed inside a DOUBLE-quoted HTML attribute (onclick="...").
// JSON.stringify() is the wrong tool here: it wraps in double quotes, which collide with
// the attribute's own double quotes and silently truncate the onclick handler.
function jsStr(s){
  return "'" + String(s==null?'':s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n') + "'";
}

// ---- theme: same pattern as Shop Boss, its own default color so the two apps read as separate ----
function mixHex(a, b, t){
  const pa=a.replace('#',''), pb=b.replace('#','');
  const ca=[0,2,4].map(i=>parseInt(pa.substr(i,2),16)), cb=[0,2,4].map(i=>parseInt(pb.substr(i,2),16));
  return '#'+ca.map((v,i)=>Math.round(v*t+cb[i]*(1-t)).toString(16).padStart(2,'0')).join('');
}
function applyAccent(color){
  const r=document.documentElement.style;
  r.setProperty('--accent', color);
  r.setProperty('--accent-dim', mixHex(color,'#000000',0.55));
  r.setProperty('--accent-tint', mixHex(color,'#0B0B0C',0.14));
}
const THEME_PRESETS = [
  {c:'#2BC4BB', label:'Teal (default)'},
  {c:'#D81E2C', label:'Red'},
  {c:'#2E8AE0', label:'Blue'},
  {c:'#2EA85B', label:'Green'},
  {c:'#C9A227', label:'Gold'},
  {c:'#8A4FD8', label:'Purple'},
  {c:'#E62E9E', label:'Neon magenta'},
];
function setTheme(color){
  applyAccent(color);
  try{ localStorage.setItem('wc-theme-accent', color); }catch(e){}
  render();
}
(function(){
  try{
    const saved = localStorage.getItem('wc-theme-accent');
    if(saved) applyAccent(saved);
  }catch(e){}
})();

// ---- Android/iOS hardware & gesture back button ----
// Same fix as Shop Boss: keep one harmless "trap" history entry armed so a back press gives us a
// popstate event instead of letting the OS just close the app. React like our own Back button (pop
// one screen, re-arm the trap) — except once we're already at the first screen, where we let it
// through on purpose so back-from-there still really exits.
// ---- Back-button guard: on a screen with a Save button, if anything was typed/changed, ask first ----
let bgDirty = false, bgKey = '';
function bgViewKey(){ try{ const t = stack[stack.length-1]; return JSON.stringify(typeof t==='string'?t:t); }catch(e){ return ''; } }
function bgSaveBtn(){
  const app = document.getElementById('app'); if(!app) return null;
  return Array.from(app.querySelectorAll('button')).find(b => /^Save/.test(b.textContent.trim()) && !/accountant/i.test(b.textContent)) || null;
}
['input','change'].forEach(ev => document.addEventListener(ev, function(e){
  const app = document.getElementById('app');
  if(app && app.contains(e.target) && bgSaveBtn()){ const k = bgViewKey(); if(k !== bgKey){ bgKey = k; bgDirty = false; } bgDirty = true; }
}, true));
function guardBack(){
  const k = bgViewKey(); if(k !== bgKey){ bgKey = k; bgDirty = false; }
  if(!bgDirty || !bgSaveBtn() || document.getElementById('bgPop')) return false;
  const d = document.createElement('div');
  d.id = 'bgPop';
  d.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:99999;display:flex;align-items:center;justify-content:center;padding:16px';
  d.innerHTML = '<div class="card" style="width:min(380px,100%)"><h3 style="margin:0 0 8px">Save your changes?</h3><p class="sub" style="margin:0 0 14px">You changed something on this screen.</p>'
    + '<button class="btn-primary" id="bgSave">Save</button>'
    + '<button class="btn-ghost" id="bgLeave" style="margin-top:8px">Leave without saving</button>'
    + '<button class="btn-ghost" id="bgKeep" style="margin-top:8px">Keep editing</button></div>';
  document.body.appendChild(d);
  const close = () => d.remove();
  document.getElementById('bgKeep').onclick = close;
  document.getElementById('bgLeave').onclick = () => { close(); bgDirty = false; goBack(); };
  document.getElementById('bgSave').onclick = () => { const b = bgSaveBtn(); close(); bgDirty = false; if(b) b.click(); };
  return true;
}
function armBackTrap(){ try{ history.pushState({__backTrap:true}, ''); }catch(e){} }
window.addEventListener('popstate', function(){
  if(stack.length>1 && guardBack()){ armBackTrap(); return; }
  if(stack.length>1){
    stack.pop();

    render();
  }
});
armBackTrap();

function handleRestoreFile(evt){

  const reader = new FileReader();
  reader.onload = ()=>{
    let payload;
    try{ payload = JSON.parse(reader.result); }
    catch(e){ showToast('That doesn\'t look like a WorkClock backup file.', true); return; }
    if(!payload || payload.kind!=='backup' || !payload.data){ showToast('That doesn\'t look like a WorkClock backup file.', true); return; }
    askConfirm('Restore this backup? It replaces everything currently on this device.', 'Restore', ()=>doRestore(payload));
  };

function doRestore(payload){
  const d = payload.data || {};

  if(Array.isArray(d.dayClocks)){ dayClocks.length=0; dayClocks.push(...d.dayClocks); }

// ---- date / time / week helpers (Monday start, matching Shop Boss's default) ----
function todayISO(){ return isoDateOf(Date.now()); }
// Same YYYY-MM-DD format as todayISO, but for any moment — used so a task is filed under the
// calendar day it actually started on, not whatever day it happens to be saved on (a task that
// runs past midnight should still land on the day it started, not get bumped to the next day).
function isoDateOf(ms){ const d=new Date(ms); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fmtTime(ms){ return new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}); }
// Hours are still STORED as decimal (e.g. 3.36) everywhere — that's what adds up cleanly for
// totals, and it's the same format Shop Boss's own numbers use, so submissions stay compatible
// without any conversion. This only changes how a number gets READ on screen: "3h 22m" instead
// of "3.36 hrs" — nobody naturally thinks in hundredths of an hour, so display converts to
// hours-and-minutes, while every calculation underneath keeps using the exact decimal value.
function fmtHrsMin(hoursDecimal){
  const totalMinutes = Math.round(hoursDecimal*60);
  if(totalMinutes<=0) return hoursDecimal>0 ? '<1m' : '0m';
  const h = Math.floor(totalMinutes/60), m = totalMinutes%60;
  if(h && m) return h+'h '+m+'m';
  if(h) return h+'h';
  return m+'m';
}
function shareBtn(){
  return `<button class="btn-ghost share-btn" onclick="window.print()"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;margin-right:6px"><path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="8" rx="1.5"/><path d="M7 14h10v6H7z"/></svg>Print / Save as PDF</button>`;
}
function msToTimeInputValue(ms){ const d=new Date(ms); return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
// Typed time field (hour / minute / AM-PM): phones' built-in time fields open a clock dial or do
// nothing, which left start times uneditable. The hidden input #id always holds "HH:MM" (24h) or ''.
function timeFieldHTML(id, val24){
  let h='', m='', pm=false;
  if(val24 && /^\d{1,2}:\d{2}$/.test(val24)){ let hh=parseInt(val24.split(':')[0],10); m=val24.split(':')[1]; pm=hh>=12; h=String(hh%12===0?12:hh%12); }
  return `<div class="tf"><input type="text" inputmode="numeric" maxlength="2" id="${id}-h" placeholder="h" value="${h}" onfocus="this.select()" oninput="tfSync('${id}')"><span class="tf-colon">:</span><input type="text" inputmode="numeric" maxlength="2" id="${id}-m" placeholder="mm" value="${m}" onfocus="this.select()" oninput="tfSync('${id}')" onblur="tfPad('${id}')"><select id="${id}-p" onchange="tfSync('${id}')"><option value="AM" ${pm?'':'selected'}>AM</option><option value="PM" ${pm?'selected':''}>PM</option></select><input type="hidden" id="${id}" value="${val24||''}"></div>`;
}
function tfSync(id){
  const hEl=document.getElementById(id+'-h'), mEl=document.getElementById(id+'-m'), pEl=document.getElementById(id+'-p'), out=document.getElementById(id);
  if(!hEl||!mEl||!pEl||!out) return;
  hEl.value = hEl.value.replace(/\D/g,''); mEl.value = mEl.value.replace(/\D/g,'');
  let h = parseInt(hEl.value,10), m = mEl.value===''?0:parseInt(mEl.value,10);
  if(isNaN(h) || m>59 || h>23){ out.value=''; return; }
  if(h>=13){ pEl.value='PM'; h-=12; }
  else if(h===0){ h=12; pEl.value='AM'; }
  if(h<1 || h>12){ out.value=''; return; }
  const h24 = (h%12) + (pEl.value==='PM'?12:0);
  out.value = String(h24).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function tfPad(id){ const mEl=document.getElementById(id+'-m'); if(mEl && mEl.value!=='' && mEl.value.length<2) mEl.value='0'+mEl.value; tfSync(id); }
function timeInputToMs(timeStr, baseMs){
  const base = new Date(baseMs||Date.now());
  const [h,m] = timeStr.split(':').map(Number);
  return new Date(base.getFullYear(), base.getMonth(), base.getDate(), h, m, 0, 0).getTime();
}
function weekRange(){
  const now = new Date();
  const dow = now.getDay(); // 0 Sun..6 Sat
  const startDow = WEEK_DAY_CODES.indexOf(weekStartDay)>=0 ? (WEEK_DAY_CODES.indexOf(weekStartDay)+1)%7 : 1;
  const sinceStart = (dow - startDow + 7)%7;
  const start = new Date(now.getFullYear(), now.getMonth(), now.getDate()-sinceStart);
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+7);
  return {start, end};
}
function weekId(){ const {start} = weekRange(); return start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0'); }
function inCurrentWeek(dateStr){
  const {start,end} = weekRange();
  const d = new Date(dateStr+'T00:00:00');
  return d>=start && d<end;
}
function fmtDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
}
function fmtElapsed(ms){
  const s = Math.max(0,Math.floor(ms/1000));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');
}

// ---- history: Monday-start week id for ANY date (not just today), used by Calendar + Work periods ----
function weekIdFor(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = d.getDay(); // 0=Sun..6=Sat
  const startDow = WEEK_DAY_CODES.indexOf(weekStartDay)>=0 ? (WEEK_DAY_CODES.indexOf(weekStartDay)+1)%7 : 1; // convert 'Mon'-based code to a 0=Sun..6=Sat index
  const sinceStart = (dow - startDow + 7)%7;
  const start = new Date(d.getFullYear(), d.getMonth(), d.getDate()-sinceStart);
  return start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0');
}
function weekLabel(wid){
  const start = new Date(wid+'T00:00:00');
  const end = new Date(start.getFullYear(), start.getMonth(), start.getDate()+6);
  const fmt = (d)=>d.toLocaleDateString('en-US',{month:'short', day:'numeric'});
  return fmt(start)+' – '+fmt(end);
}
function myAllWeeks(){

// ---- employee roster (local to this device — not shared with Shop Boss) ----
function addEmployee(name){
  name = (name||'').trim();
  if(!name){ showToast('Enter your name first.', true); return; }
  const existing = employees.find(e=>e.name.toLowerCase()===name.toLowerCase());
  const emp = existing || {id:uid(), name};
  if(!existing) employees.push(emp);
  // Match this employee to Shop Boss's own roster by name, once Shop Boss has sent one over — from
  // here on, anything scoped to this person (forms, photo requests) matches by that real ID, not by
  // whatever text happens to be typed here, which is the fragile part this is meant to replace.
  if(!emp.shopBossId && shopBossEmployees.length){
    const match = shopBossEmployees.find(se=>se.name.toLowerCase()===emp.name.toLowerCase());
    if(match) emp.shopBossId = match.id;
  }
  currentEmp = emp.id;
  resolveRestrictedItems();
  persist();
  // The backup folder is a device-wide setting, not a per-employee one — once anyone on this
  // device has picked it, later employees just enter their name and go straight in.
  stack = [ backupFolderConfigured ? {type:'home'} : {type:'chooseBackupFolder'} ];
  render();
}

// ---- backup / submitted-weeks folders (device-wide) — real folders on disk, chosen once, that
// WorkClock writes a copy directly into going forward, on top of (not instead of) the normal
// Share Sheet / Save flow. Only works where the browser supports the File System Access API
// (desktop Chrome/Edge as of this build — not iOS/Android browsers), so it quietly does nothing
// on a phone rather than break anything; the Share/Save path always still runs regardless. ----
function backupFolderApiAvailable(){ return typeof window!=='undefined' && typeof window.showDirectoryPicker==='function'; }
// A tiny IndexedDB key-value store just for the two live FileSystemDirectoryHandle objects —
// they can't go in localStorage (not JSON-safe), but IndexedDB can hold them directly, so the
// folder choice survives a reload instead of needing to be re-picked every time.
function wcIdbOpen(){
  return new Promise((resolve,reject)=>{
    if(typeof indexedDB==='undefined'){ reject(new Error('no indexedDB')); return; }
    const req = indexedDB.open('workclock-folders', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function wcIdbGetHandle(key){
  try{
    const db = await wcIdbOpen();
    return await new Promise(resolve=>{
      const tx = db.transaction('handles','readonly');
      const req = tx.objectStore('handles').get(key);
      req.onsuccess = ()=>resolve(req.result||null);
      req.onerror = ()=>resolve(null);
    });
  }catch(e){ return null; }
}
async function wcIdbSetHandle(key, handle){
  try{
    const db = await wcIdbOpen();
    await new Promise((resolve,reject)=>{
      const tx = db.transaction('handles','readwrite');
      tx.objectStore('handles').put(handle, key);
      tx.oncomplete = resolve; tx.onerror = ()=>reject(tx.error);
    });
  }catch(e){}
}
async function wcEnsureFolderPermission(handle){
  if(!handle) return false;
  try{
    const opts = {mode:'readwrite'};
    if((await handle.queryPermission(opts))==='granted') return true;
    if((await handle.requestPermission(opts))==='granted') return true;
    return false;
  }catch(e){ return false; }
}
async function wcWriteFileToHandle(dirHandle, filename, text){
  try{
    if(!(await wcEnsureFolderPermission(dirHandle))) return false;

// ---- the DAY clock ----
function myOpenDayClock(){ return dayClocks.find(d=>d.empId===currentEmp && d.clockedOutAt==null) || null; }
// `active` (the running task) is a single, device-wide slot — there's only ever one task running
// at a time on this tablet. On a shared tablet that's handed between employees, that used to mean
// whoever is currently signed in sees and can end ANYONE's running task as if it were their own,
// and ending it credited the hours to whoever happened to be signed in at that moment, not whoever
// actually did the work. This checks whose task it actually is before showing/acting on it.
function activeIsMine(){ return !!(active && active.empId===currentEmp); }
function activeOwnerName(){
  if(!active) return '';
  const e = employees.find(x=>x.id===active.empId);
  return e ? e.name : 'Someone';
}
function clockIn(){
  if(myOpenDayClock()) return;
  dayClocks.push({id:uid(), empId:currentEmp, date:todayISO(), clockedInAt:Date.now(), clockedOutAt:null, submitted:false});
  render();
}
function clockOut(ts){
  const dc = myOpenDayClock();
  if(!dc) return;
  dc.clockedOutAt = ts;
  dc.submitted = false; // a changed clock time goes out again with the next submit
  render();
}
// A day's clock records, oldest first, for the signed-in person.
function myClocksForDate(date){ return dayClocks.filter(c=>c.empId===currentEmp && c.date===date).sort((a,b)=>a.clockedInAt-b.clockedInAt); }
function clockHoursOf(c){ return ((c.clockedOutAt==null ? Date.now() : c.clockedOutAt) - c.clockedInAt)/3600000; }
// Employee hours (the paid time) for a work week, from clock-in to clock-out.
function weekClockHours(wid){ return dayClocks.filter(c=>c.empId===currentEmp && weekIdFor(c.date)===wid).reduce((t,c)=>t+clockHoursOf(c),0); }
function clockLineText(c){
  return 'In '+fmtTime(c.clockedInAt)+' · Out '+(c.clockedOutAt==null?'still clocked in':fmtTime(c.clockedOutAt))+' · '+fmtHrsMin(clockHoursOf(c));
}
// Edit one clock record: its day and its times. Past days only.
function saveEditClock(id, inStr, outStr, dateStr){
  const c = dayClocks.find(x=>x.id===id);
  if(!c) return;
  if(!inStr){ showToast('Pick a clock-in time.', true); return; }
  const newDate = (dateStr && /^\d{4}-\d{2}-\d{2}$/.test(dateStr)) ? dateStr : c.date;
  if(newDate>todayISO()){ showToast('That date is in the future.', true); return; }
  const base = new Date(newDate+'T12:00:00').getTime();
  const inMs = timeInputToMs(inStr, base);
  let outMs = null;
  if(outStr) outMs = timeInputToMs(outStr, base);
  else if(c.clockedOutAt!=null){ showToast('Pick a clock-out time.', true); return; }
  if(inMs>Date.now()){ showToast('The clock-in time is in the future.', true); return; }
  if(outMs!=null){
    if(outMs>Date.now()){ showToast('The clock-out time is in the future.', true); return; }
    if(outMs<=inMs){ showToast('Clock-out has to be after clock-in.', true); return; }
  }
  // A record can't overlap another one of this person's clock records.
  const endMs = outMs==null ? Infinity : outMs;
  const clash = dayClocks.some(o=>o!==c && o.empId===c.empId && inMs < (o.clockedOutAt==null?Infinity:o.clockedOutAt) && o.clockedInAt < endMs);
  if(clash){ showToast('That overlaps another clock-in and clock-out on your phone.', true); return; }
  const oldDate = c.date;
  c.date = newDate;
  // Moved to another work week: the week it left has to be sent again so Shop Boss drops it there.
  if(oldDate!==newDate && weekIdFor(oldDate)!==weekIdFor(newDate)){
    dayClocks.forEach(o=>{ if(o!==c && o.empId===c.empId && weekIdFor(o.date)===weekIdFor(oldDate)) o.submitted = false; });
  }
  c.clockedInAt = inMs;
  c.clockedOutAt = outMs;
  c.submitted = false;
  const hrs = outMs==null ? 0 : (outMs-inMs)/3600000;
  showToast(hrs>LONG_DAY_HOURS ? ('Saved. That is a long day ('+fmtHrsMin(hrs)+') - check the times.') : 'Clock times saved.');
  goBack();
}
function requestDeleteDayClocks(date){
  const list = myClocksForDate(date);
  if(!list.length) return;
  const hrs = list.reduce((t,c)=>t+clockHoursOf(c),0);
  const sent = list.filter(c=>c.submitted).length;
  askConfirm('Delete the clock-in and clock-out times for '+fmtDate(date)+'? That is '+list.length+' clock record'+(list.length===1?'':'s')+' ('+fmtHrsMin(hrs)+')'+(sent?', '+sent+' already sent to Shop Boss. Shop Boss keeps its copy':'')+'. Your work entries, forms and photos stay. This cannot be undone.', 'Delete clock times', ()=>{
    for(let i=dayClocks.length-1;i>=0;i--){ if(dayClocks[i].empId===currentEmp && dayClocks[i].date===date) dayClocks.splice(i,1); }
    stack.pop(); // the confirm screen
    render();
  });
}
function requestDeleteDayEntries(date){
  const list = myEntriesForDate(date);
  if(!list.length) return;
  const hrs = list.reduce((t,l)=>t+l.hours,0);
  const sent = list.filter(l=>l.submitted).length;
  askConfirm('Delete all '+list.length+' work entr'+(list.length===1?'y':'ies')+' for '+fmtDate(date)+' ('+fmtHrsMin(hrs)+')? '+(sent?sent+' of them '+(sent===1?'was':'were')+' already sent to Shop Boss; Shop Boss keeps its copy. ':'None have been sent yet. ')+'Your clock-in and clock-out times, forms and photos stay. This cannot be undone.', 'Delete entries', ()=>{
    const ids = new Set(list.map(l=>l.id));
    for(let i=entries.length-1;i>=0;i--){ if(ids.has(entries[i].id)) entries.splice(i,1); }
    photos.forEach(p=>{ if(ids.has(p.entryId)) p.entryId = null; });
    completedDocs.forEach(d=>{ if(ids.has(d.entryId)) d.entryId = null; });
    stack.pop(); // the confirm screen
    render();
  });
}
function requestClockOut(){
  if(activeIsMine()){ showToast('End your current task first — "'+active.task+'" on '+active.car+' — before clocking out.', true); return; }
  const dc = myOpenDayClock();
  if(!dc) return;
  // A confirmation step on purpose — this button lives right next to Clock In inside the same
  // banner now, so an accidental tap (rather than a fat-fingered miss on a separate button) is
  // the thing this is guarding against.
  askConfirm('Clock out now?', 'Clock out', doConfirmedClockOut);
}
function doConfirmedClockOut(){
  const dc = myOpenDayClock();
  if(!dc) return;
  const hrs = (Date.now()-dc.clockedInAt)/3600000;
  stack.pop(); // dismiss the confirm screen first, so whatever happens next actually shows up
  if(hrs > LONG_DAY_HOURS){
    showToast('That’s '+fmtHrsMin(hrs)+' today — check the clock-out time before saving.');

function setEmployeePicture(empId, file){
  const emp = employees.find(e=>e.id===empId); if(!emp || !file) return;
  const rd = new FileReader();
  rd.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const S = 160, cv = document.createElement('canvas'); cv.width = S; cv.height = S;
      const c = cv.getContext('2d'); const k = Math.min(S/im.width, S/im.height);
      const w = im.width*k, h = im.height*k; c.drawImage(im, (S-w)/2, (S-h)/2, w, h);
      emp.thumb = cv.toDataURL('image/png'); persist(); render();
    };
    im.onerror = ()=>alert("That file couldn't be read as a picture. Try a different one.");
    im.src = rd.result;
  };
  rd.readAsDataURL(file);
}

function startTask(car, taskText, todoId){

  car = (car||'').trim();
  const task = normList(taskText);
  if(!car){ navReplace({type:'newEntry', task, err:'Enter which car this is for.'}); return; }
  if(!task){ navReplace({type:'newEntry', car, err:'Add at least one task — type it, or tap + to pick.'}); return; }
  // the task gets its id NOW, while it's still running, so a photo or form attached mid-task
  // (via the paperclip) already points at the right entry once the task is saved — no re-linking step.
  // Starting a task with no clock-in running also clocks the employee in. Ending the task never clocks them out.
  if(!myOpenDayClock()){ dayClocks.push({id:uid(), empId:currentEmp, date:todayISO(), clockedInAt:Date.now(), clockedOutAt:null, submitted:false}); showToast('You were clocked in too.'); }
  active = {id: uid(), empId: currentEmp, car, carId: matchShopCarId(car), task, startedAt: Date.now()};

function stopTask(){
  if(!activeIsMine()) return;
  // Kept at full precision here on purpose — a very short task (a few seconds) rounds away to
  // exactly 0.00 at 2 decimal places, and 0 fails the "must be more than zero" check on Save,
  // silently dropping the task with no obvious explanation. Rounding only happens for display.
  const hours = (Date.now()-active.startedAt)/3600000;
  // `active` is deliberately NOT cleared here — this screen is the only place the task's hours
  // get saved, and it has no Cancel button, so a stray back-button tap used to pop the screen
  // with the task already gone and nothing saved: the hours just vanished with no warning. Leaving
  // `active` alone means backing out just leaves the task looking like it's still running (which,
  // as far as anything else in the app knows, it is) — tapping "End task" again picks right back
  // up here. saveEntry() is what actually clears it, once the hours are safely recorded.
  const dv = {type:'entryDetails', id:active.id, empId:active.empId, car:active.car, task:active.task, startedAt:active.startedAt, endedAt:Date.now(), hours};
  // From home, push (so Back returns to home); from the old full-screen timer, replace it.
  if(stack.length && stack[stack.length-1].type==='running') navReplace(dv); else nav(dv);

  for(let i=completedDocs.length-1;i>=0;i--) if(completedDocs[i].entryId===active.id) completedDocs.splice(i,1);
  active = null;
